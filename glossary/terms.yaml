# Seed glossary for the PMP knowledge base.
# domain: people | process | business-environment (the 3 official ECO domains)
#         agile | formula (cross-cutting tags, not official ECO domains)
# source: 'seed' = came from the original roadmap; otherwise a path under sources/

- term: Project
  definition: A temporary endeavor undertaken to create a unique product, service, or result.
  domain: process
  source: seed
- term: Program
  definition: A group of related projects, subsidiary programs, and activities managed in a coordinated
    way to obtain benefits not available from managing them individually.
  domain: process
  source: seed
- term: Portfolio
  definition: Projects, programs, and operations managed as a group to achieve strategic objectives.
  domain: process
  source: seed
- term: PMO (Project Management Office)
  definition: An organizational structure that standardizes governance and shares resources, methodologies,
    and tools across projects.
  domain: business-environment
  source: seed
- term: Project Charter
  definition: The document that formally authorizes a project and gives the project manager authority
    to apply resources to it.
  domain: process
  source: seed
- term: Project Management Plan
  definition: The document describing how the project will be executed, monitored, controlled, and closed
    — the sum of all subsidiary plans.
  domain: process
  source: seed
- term: Performance Domain
  definition: PMBOK® Guide 8's term for the seven interrelated areas of focus (Governance, Scope, Schedule,
    Finance, Stakeholders, Resources, Risk) that work together to deliver outcomes.
  domain: process
  source: seed
- term: Focus Area
  definition: PMBOK® Guide 8's five-stage flow — Initiating, Planning, Executing, Monitoring & Controlling,
    Closing — successor to the old Process Groups.
  domain: process
  source: seed
- term: Tailoring
  definition: Deliberately adjusting the degree and type of project management processes, tools, and techniques
    used, based on the project's context.
  domain: process
  source: seed
- term: Predictive Approach
  definition: A development approach where scope, schedule, and cost are determined early and changes
    are carefully managed (traditional/waterfall).
  domain: process
  source: seed
- term: Adaptive Approach
  definition: A development approach where requirements and solutions evolve through iterative work and
    continuous feedback (agile).
  domain: agile
  source: seed
- term: Hybrid Approach
  definition: A blend of predictive and adaptive elements tailored to a project's specific needs.
  domain: agile
  source: seed
- term: Enterprise Environmental Factors (EEF)
  definition: Conditions not under the project team's control — culture, infrastructure, market conditions
    — that influence, constrain, or direct the project.
  domain: business-environment
  source: seed
- term: Organizational Process Assets (OPA)
  definition: Plans, processes, policies, procedures, and knowledge bases specific to and used by the
    performing organization.
  domain: business-environment
  source: seed
- term: Benefits Management Plan
  definition: Describes how and when the strategic benefits of the project will be realized and measured.
  domain: business-environment
  source: seed
- term: Business Case
  definition: A documented economic feasibility study used to establish the validity of a project's benefits.
  domain: business-environment
  source: seed
- term: Scope Baseline
  definition: The approved version of the scope statement, WBS, and WBS dictionary, used as a basis for
    comparison.
  domain: process
  source: seed
- term: Work Breakdown Structure (WBS)
  definition: A hierarchical decomposition of the total scope of work into smaller, more manageable components.
  domain: process
  source: seed
- term: WBS Dictionary
  definition: A document that provides detailed deliverable, activity, and scheduling information for
    each WBS component.
  domain: process
  source: seed
- term: Requirements Traceability Matrix
  definition: A grid linking product requirements to their origin and tracking them through the project
    lifecycle.
  domain: process
  source: seed
- term: Scope Creep
  definition: Uncontrolled expansion of project scope without adjustments to time, cost, or resources.
  domain: process
  source: seed
- term: Gold Plating
  definition: Giving the customer more than what was asked for, without approval — considered a risk,
    not a bonus.
  domain: process
  source: seed
- term: Critical Path Method (CPM)
  definition: A technique to estimate the minimum project duration by identifying the longest sequence
    of dependent activities.
  domain: formula
  source: seed
- term: Float / Slack
  definition: The amount of time an activity can be delayed without delaying the project end date (total
    float) or the next activity (free float).
  domain: formula
  source: seed
- term: Precedence Diagramming Method (PDM)
  definition: A technique for constructing a schedule model where activities are represented by nodes
    and linked by dependencies.
  domain: formula
  source: seed
- term: Crashing
  definition: A schedule compression technique that adds resources to shorten duration, usually increasing
    cost.
  domain: formula
  source: seed
- term: Fast Tracking
  definition: A schedule compression technique that performs activities in parallel that were originally
    planned in sequence.
  domain: formula
  source: seed
- term: Rolling Wave Planning
  definition: Iterative planning where near-term work is planned in detail and future work is planned
    at a higher level.
  domain: process
  source: seed
- term: Milestone
  definition: A significant point or event in a project with zero duration.
  domain: process
  source: seed
- term: Earned Value Management (EVM)
  definition: A methodology that integrates scope, schedule, and cost to objectively measure project performance.
  domain: formula
  source: seed
- term: Planned Value (PV)
  definition: The authorized budget assigned to scheduled work as of a given date.
  domain: formula
  source: seed
- term: Earned Value (EV)
  definition: The value of work actually completed, expressed in terms of the approved budget.
  domain: formula
  source: seed
- term: Actual Cost (AC)
  definition: The realized cost incurred for the work performed on an activity.
  domain: formula
  source: seed
- term: Cost Variance (CV) / Schedule Variance (SV)
  definition: CV = EV − AC (are we over/under budget); SV = EV − PV (are we ahead/behind schedule).
  domain: formula
  source: seed
- term: Cost Performance Index (CPI) / Schedule Performance Index (SPI)
  definition: CPI = EV / AC (cost efficiency); SPI = EV / PV (schedule efficiency). Above 1.0 is favorable.
  domain: formula
  source: seed
- term: Estimate at Completion (EAC)
  definition: The expected total cost of completing all work, given current performance.
  domain: formula
  source: seed
- term: Estimate to Complete (ETC)
  definition: The expected cost needed to finish all remaining project work.
  domain: formula
  source: seed
- term: To-Complete Performance Index (TCPI)
  definition: The efficiency required on remaining work to meet a specified cost or budget goal.
  domain: formula
  source: seed
- term: Contingency Reserve / Management Reserve
  definition: Budget for identified risks within scope (contingency) vs. unforeseen work within scope
    (management).
  domain: process
  source: seed
- term: Three-Point Estimating (PERT)
  definition: An estimating technique using optimistic, pessimistic, and most-likely values to calculate
    an expected duration or cost.
  domain: formula
  source: seed
- term: Cost of Quality (COQ)
  definition: The total cost of conformance (prevention + appraisal) and nonconformance (internal + external
    failure) work.
  domain: process
  source: seed
- term: Quality Assurance vs. Quality Control
  definition: QA is proactive, process-focused (are we following the right process?); QC is reactive,
    product-focused (is the deliverable correct?).
  domain: process
  source: seed
- term: Risk Register
  definition: A document listing identified risks, their owners, and planned responses.
  domain: business-environment
  source: seed
- term: Risk Appetite / Tolerance / Threshold
  definition: 'Appetite: general willingness to take on risk. Tolerance: acceptable variation in outcome.
    Threshold: the risk exposure level that triggers action.'
  domain: business-environment
  source: seed
- term: Qualitative vs. Quantitative Risk Analysis
  definition: Qualitative prioritizes risks by probability and impact; quantitative numerically analyzes
    the effect of risks on overall objectives.
  domain: business-environment
  source: seed
- term: Risk Response Strategies
  definition: 'Threats: avoid, mitigate, transfer, accept, escalate. Opportunities: exploit, enhance,
    share, accept.'
  domain: business-environment
  source: seed
- term: Risk Owner
  definition: The person responsible for monitoring a risk and executing the chosen response.
  domain: business-environment
  source: seed
- term: Issue Log
  definition: A document used to record and track information on issues occurring during the project.
  domain: business-environment
  source: seed
- term: Fixed-Price Contract
  definition: A contract that sets a total price for a defined scope of work, placing cost-overrun risk
    on the seller. Subfamilies: FFP (Firm Fixed Price), FPIF (Fixed Price Incentive Fee), FPEPA (Fixed
    Price with Economic Price Adjustment).
  domain: process
  source: seed
- term: Cost-Reimbursable Contract
  definition: A contract that pays the seller's actual costs plus a fee, placing more cost risk on the
    buyer. Subfamilies: CPFF (Cost Plus Fixed Fee), CPAF (Cost Plus Award Fee), CPIF (Cost Plus
    Incentive Fee).
  domain: process
  source: seed
- term: Time and Materials (T&M) Contract
  definition: A hybrid contract type paying for labor hours and materials used; open-ended, used for smaller
    or undefined-scope work.
  domain: process
  source: seed
- term: Procurement Statement of Work
  definition: Describes the portion of scope to be included in the related contract with a seller.
  domain: process
  source: seed
- term: Make-or-Buy Analysis
  definition: Determining whether work can be done by the project team or should be purchased from an
    outside source.
  domain: process
  source: seed
- term: Source Selection Criteria
  definition: Criteria used to rate or score seller proposals during procurement.
  domain: process
  source: seed
- term: Servant Leadership
  definition: A leadership style focused on the growth and well-being of the team, putting others' needs
    first.
  domain: people
  source: seed
- term: Emotional Intelligence (EI)
  definition: The ability to identify and manage one's own emotions and those of others.
  domain: people
  source: seed
- term: RACI Matrix
  definition: 'A responsibility-assignment chart: Responsible, Accountable, Consulted, Informed.'
  domain: people
  source: seed
- term: Stakeholder Register
  definition: A document identifying stakeholders and their assessment and classification information.
  domain: people
  source: seed
- term: Power/Interest Grid
  definition: A stakeholder-analysis tool that groups stakeholders by their level of authority and level
    of concern.
  domain: people
  source: seed
- term: Conflict Resolution Techniques
  definition: Collaborate/problem-solve, compromise, smooth/accommodate, force/direct, withdraw/avoid
    — ranked roughly best to weakest for long-term resolution.
  domain: people
  source: seed
- term: Tuckman's Ladder
  definition: 'Team development stages: forming, storming, norming, performing, adjourning.'
  domain: people
  source: seed
- term: Virtual / Distributed Team
  definition: A team whose members are not colocated and collaborate primarily through technology.
  domain: people
  source: seed
- term: Ground Rules
  definition: Expectations for acceptable team behavior, often set collaboratively in a team charter.
  domain: people
  source: seed
- term: Colocation
  definition: Placing project team members in the same physical location to enhance communication and
    performance.
  domain: people
  source: seed
- term: Agile Manifesto
  definition: The foundational 2001 statement of four values and twelve principles behind adaptive software
    development.
  domain: agile
  source: seed
- term: Scrum
  definition: An agile framework using fixed-length sprints, defined roles, and regular inspection/adaptation
    events.
  domain: agile
  source: seed
- term: Sprint / Iteration
  definition: A fixed, short time period (commonly 1–4 weeks) in which a usable increment of product is
    created.
  domain: agile
  source: seed
- term: Sprint Backlog / Product Backlog
  definition: 'Product backlog: the full, prioritized list of work. Sprint backlog: the subset of items
    selected for the current sprint.'
  domain: agile
  source: seed
- term: Product Owner
  definition: The Scrum role accountable for maximizing product value and managing the product backlog.
  domain: agile
  source: seed
- term: Scrum Master
  definition: The Scrum role that coaches the team and removes impediments, acting as a servant leader
    to the process.
  domain: agile
  source: seed
- term: Daily Standup
  definition: A short, timeboxed daily event where the team synchronizes activities and plans the next
    24 hours.
  domain: agile
  source: seed
- term: Sprint Retrospective
  definition: An event at the end of a sprint where the team reflects on process and identifies improvements.
  domain: agile
  source: seed
- term: Sprint Review
  definition: An event at the end of a sprint where the increment is inspected with stakeholders and the
    backlog is adapted.
  domain: agile
  source: seed
- term: Velocity
  definition: A measure of the amount of work a team completes in a sprint, used to forecast future capacity.
  domain: agile
  source: seed
- term: Story Points
  definition: A relative, unit-less measure of the effort/complexity required to implement a user story.
  domain: agile
  source: seed
- term: User Story
  definition: A short, plain-language description of a feature from the end user's perspective.
  domain: agile
  source: seed
- term: Definition of Done (DoD)
  definition: A shared, explicit checklist of criteria a work item must meet to be considered complete.
  domain: agile
  source: seed
- term: Kanban Board
  definition: A visual workflow tool using columns to represent stages of work, used to manage flow and
    limit WIP.
  domain: agile
  source: seed
- term: WIP Limit
  definition: A cap on the number of work items allowed in a given workflow stage at one time, used to
    expose bottlenecks.
  domain: agile
  source: seed
- term: Burndown / Burnup Chart
  definition: Charts tracking remaining work (burndown) or completed work (burnup) against time within
    an iteration or release.
  domain: agile
  source: seed
- term: Minimum Viable Product (MVP)
  definition: The smallest version of a product that delivers enough value to be usable and gather feedback.
  domain: agile
  source: seed
- term: Timeboxing
  definition: Allocating a fixed, maximum unit of time to an activity, after which it stops regardless
    of completion.
  domain: agile
  source: seed
- term: Spike
  definition: A short, timeboxed investigation used to answer a question or reduce uncertainty before
    committing to work.
  domain: agile
  source: seed
- term: Change Control Board (CCB)
  definition: A formally chartered group responsible for reviewing, evaluating, and approving or rejecting
    project changes.
  domain: process
  source: seed
- term: Configuration Management
  definition: A subsystem of the project management plan used to manage changes to a product's or system's
    baseline.
  domain: process
  source: seed
- term: Progressive Elaboration
  definition: Continuously improving and detailing a plan as more information and more accurate estimates
    become available.
  domain: process
  source: seed
- term: Lessons Learned Register
  definition: A project document used to record knowledge gained so it can be used by the current and
    future projects.
  domain: business-environment
  source: seed
- term: Organizational Change Management (ADKAR)
  definition: 'A structured approach to transitioning people through change: Awareness, Desire, Knowledge,
    Ability, Reinforcement.'
  domain: business-environment
  source: seed
- term: Value Delivery / Benefits Realization
  definition: Ensuring project outputs are converted into outcomes that produce the intended business
    benefits.
  domain: business-environment
  source: seed
- term: Murder Board
  definition: A committee of experts (senior managers and subject matter experts) that critically and
    aggressively evaluates a project proposal, asking tough questions to look for reasons the project
    should not be considered. It is a project selection technique used before a project is approved.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md
- term: Stakeholder
  definition: Any individual, group, or organization that has an interest in the project or is affected
    by its outcomes — a broader set than just the project team, including sponsors, users, suppliers,
    government/regulators, financial institutions, and other impacted parties (e.g. neighbors).
  domain: people
  source: sources/guides/2026-09-10-project-stakeholders.md
- term: Stakeholder Management Plan
  definition: A project document that guides how stakeholders will be identified, analyzed,
    prioritized, engaged, and monitored throughout the project, clarifying responsibilities for
    managing stakeholder interactions.
  domain: people
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md
- term: Communication Strategy
  definition: The structured, high-level blueprint for managing information flow in a project —
    the overall approach for engaging stakeholders so communication stays purposeful, consistent, and
    aligned with the project's vision and constraints.
  domain: people
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md
- term: Communication Management Plan
  definition: A detailed, tactical document (also called the Communication Plan) that specifies the
    methods, timelines, and tools used to get project information to the right stakeholders in a
    timely, effective manner. Organized around Who (audience), What (message/format), and How
    (delivery method, formality, frequency).
  domain: people
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md
- term: Job Task Analysis (JTA)
  definition: A criterion-referenced study of what practicing project managers actually do, used by
    PMI to build each PMP exam cycle so questions map to real, frequently-performed work rather than
    abstract theory.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md
- term: Examination Content Outline (ECO)
  definition: PMI's official document defining what a PMP exam cycle covers — domains, tasks, and
    enablers — validated by the Job Task Analysis. Distinct from the PMBOK Guide, which is a knowledge
    reference; the ECO defines the job tasks a PM performs and is what the exam actually tests against.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md
- term: Professional Development Unit (PDU)
  definition: A unit of continuing-education credit. Certified PMPs must earn 60 PDUs every 3 years to
    maintain the certification (Continuing Certification Requirements, or CCR).
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md
- term: Functional Organization
  definition: An organizational structure divided into departments by skill (sales, marketing, IT,
    etc.), where all authority — budget, resources, decisions — belongs to the functional manager.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Weak Matrix Organization
  definition: A matrix structure that leans toward functional — the functional manager holds most
    authority; the PM mainly assists the team.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Balanced Matrix Organization
  definition: A matrix structure giving the PM more authority than a weak matrix, but the functional
    manager remains the primary managerial authority.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Strong Matrix Organization
  definition: A matrix structure giving the PM authority to make project decisions, with the
    functional manager assisting only for specialized tasks.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Projectized Organization
  definition: A structure where most resources and authority are dedicated to project work, and
    project managers have full authority over their projects.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Functional Manager
  definition: The person with management authority within a business unit/department, with direct
    supervision over resources on the project team or direct responsibility for functions that affect
    or are affected by the project.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Authority
  definition: The right to apply project resources, expend funds, make decisions, or give approvals
    within a project.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Business Analysis
  definition: Understanding the needs of business stakeholders and defining the project
    characteristics needed to meet those needs.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Business Analyst
  definition: A role that elicits stakeholder needs from customers, staff, IT, and executives, and
    facilitates communication between organizational units.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Business Model Canvas
  definition: A brief, high-level description of a project's purpose and a commitment to what the
    team will accomplish by its end.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Business Value
  definition: The benefit — tangible, intangible, or both — that a project's results provide to its
    stakeholders.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Product Life Cycle
  definition: The full duration and evolution of a product from concept through development,
    introduction, growth, maturity, and decline — broader in scope than any single project's life
    cycle.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Capital Projects
  definition: Large-scale, very-high-expenditure projects — roads, railways, manufacturing plants,
    power plants, electrical distribution.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Triple Bottom Line
  definition: A tool evaluating a business opportunity's value across Profit, People, and Planet —
    the economic, social, and ecological balance it could achieve.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Value Proposition
  definition: The value of a product or service that an organization communicates to its customers.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Value Creation
  definition: Any process that creates outputs more valuable than its inputs.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Vanity Metric
  definition: A metric that shows results reflecting no real value or performance insight, and doesn't
    help evaluate important aspects or make informed decisions.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Time-to-Market
  definition: The time needed to take a product from idea to release/sale.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Profitability
  definition: A project's ability to yield financial profit or gain for an organization.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Innovation
  definition: Renewing or updating a domain, product, or service by applying new processes,
    introducing new techniques, or establishing successful ideas to create new value.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Confidentiality
  definition: Rules or promises, usually via confidentiality agreements, that limit access to or
    distribution of certain types of information.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Benefit-Cost Ratio (BCR)
  definition: The relationship between a project's costs and benefits (benefits ÷ costs). A BCR
    greater than 1 means benefits/revenue exceed costs and the project is expected to deliver a
    positive net present value.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Cost-Benefit Analysis
  definition: A financial analysis method that weighs a project's benefits against its costs; used to
    determine profitability or to make the case for a solution to stakeholders.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Net Present Value (NPV)
  definition: Determines whether a project's anticipated financial gains outweigh its present-day
    investment. Positive NPV indicates expected profitability; negative NPV indicates an expected
    loss.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Internal Rate of Return (IRR)
  definition: The discount rate at which an investment's Net Present Value would be zero. When
    comparing projects, the one with the highest IRR is often the best choice.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Payback Period
  definition: How long it takes for a project's revenue to break even with its total investment; after
    this point the project starts generating profit.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Sunk Cost
  definition: Money already spent and unrecoverable — irrelevant to future project decisions.
  domain: formula
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Brainstorming
  definition: A data-gathering technique where a group quickly shares as many ideas as possible;
    inputs are analyzed afterward to define a requirement or find a solution.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Brainwriting
  definition: Gives each participant time to individually reflect on and write down ideas before the
    group session, reducing groupthink and dominant-voice bias versus brainstorming.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Focus Groups
  definition: A facilitated, face-to-face conversation bringing together stakeholders and SMEs to
    share and discuss input on a particular subject.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Delphi Technique
  definition: Builds consensus from expert opinion through several rounds of anonymous surveys, each
    round informed by the previous round's answers.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Design Thinking
  definition: An iterative process to understand users, challenge assumptions, redefine problems, and
    create/prototype/test innovative solutions.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Affinity Diagram
  definition: Classifies a large number of ideas into groups or clusters for review and analysis.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Mind Map
  definition: A visual tool used after brainstorming/nominal-group sessions to organize and display
    the relationships between collected ideas.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Nominal Group Technique
  definition: Enhances brainstorming with a voting process used to rank the most useful ideas for
    further brainstorming or prioritization.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: MoSCoW
  definition: A prioritization technique that sorts requirements into Must Have, Should Have, Could
    Have, and Won't Have.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Kano Model
  definition: Prioritizes product functionality by weighing implementation cost against its potential
    to satisfy customers.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Multicriteria Decision Analysis
  definition: A systematic, structured approach to evaluating and comparing options against multiple
    criteria/objectives, for an objective and transparent decision.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Paired Comparison / Pairwise Comparison
  definition: A systematic approach for evaluating a small set of options by comparing them against
    each other, one pair at a time.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Voting
  definition: Picking the option that gets more votes among involved parties — the decision can be by
    unanimity, majority, or plurality.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Last Responsible Moment
  definition: A strategy of deliberately delaying a decision until the latest possible point, to
    consider more options, scenarios, and information before committing.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Context Diagram
  definition: A visual depiction of how different elements interact — e.g. how third-party apps, APIs,
    and users interact with a product.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Data Representation Techniques
  definition: Graphical techniques used to visualize and organize project data so it can be conveyed
    to stakeholders.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Data-Driven Decision-Making
  definition: Using facts, metrics, and data — rather than opinion — to guide decisions aligned with
    project goals and objectives.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Simulation
  definition: An analytical/mathematical tool that explores the impact of variance on deliverables or
    outcomes during a project.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Alternatives Analysis
  definition: A technique comparing time and cost across multiple options to select the best approach.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Budget
  definition: The approved estimate for a project or any scheduled activity.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Close Project or Phase
  definition: The process of finalizing all activities for a project, phase, or contract — deliverables
    are finalized and transferred, and documentation is signed off, approved, and archived.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Collect Requirements
  definition: The process of determining, documenting, and managing stakeholder needs and requirements
    to meet project objectives.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Competing Constraints
  definition: When the triple constraints (Cost, Scope, Time) extend to also include Quality,
    Resources, and Risk.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Conditions of Satisfaction (CoS)
  definition: A customer's explicit description of all the actual requirements that must be satisfied
    for them to feel they received exactly what was wanted.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Constraint
  definition: A limiting factor that affects the execution of a project or process.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Criteria
  definition: Standards, rules, or tests on which a judgment or decision can be based, or by which a
    product, service, result, or process can be evaluated.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Customer Obsession
  definition: Aiming to create a better customer experience from the customer's own perspective.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Cycle Time
  definition: How long it takes for the team to complete a task.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Deliverable
  definition: A tangible or intangible output produced as a result of a project.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Fit for Purpose
  definition: A product, service, solution, or process that satisfies its initial intended purpose,
    its users' needs, and its clients' expectations.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Fit for Use
  definition: A product usable and capable of meeting business, technical, or operational goals in its
    current state — it can still be subject to further improvement even when fit for use.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Framework
  definition: A set of practices, standards, processes, and techniques used to carry a project from
    initiation to closure.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Inputs
  definition: Things used to implement a project — time, finances, hardware/software, office space,
    and similar resources.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Key Performance Indicators (KPIs)
  definition: Quantifiable measures used to evaluate the success of a project.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Leadership
  definition: The ability to lead a team and inspire them to do their jobs well — encompassing a wide
    range of skills, abilities, and actions.
  domain: people
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Lead Time
  definition: The duration of a task from its creation to its completion.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Management
  definition: The process of planning, organizing, leading, and controlling resources — people,
    finances, materials — to achieve organizational goals.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Metric
  definition: A measurement that reveals how a project is performing and indicates progress toward
    the project goal.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Modeling
  definition: Creating a prototype, storyboard, diagram, or mock-up as a simplified representation of
    a system, deliverable, or solution.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Objective
  definition: Something the project team works toward — a strategic position to attain, a purpose to
    achieve, a result to obtain, a product to produce, or a service to perform.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Operation
  definition: The ongoing execution of activities that follow an organization's procedures to produce
    the same result or a repetitive service — contrast with a project, which is temporary and unique.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Outcome
  definition: The end result or consequence of a process or project. Broader than outputs — focused
    on the benefits and value the project was undertaken to deliver.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Output
  definition: Project activities or work items performed to achieve outcomes. Easily measurable since
    they're often tangible, but completing outputs doesn't guarantee outcomes were achieved.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Phase
  definition: A number of logically related project activities aiming to complete one or more
    deliverables and reach a certain milestone.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Portfolio Manager
  definition: Manages projects and programs within a portfolio to achieve strategic objectives.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Procedure
  definition: A set of instructions for completing a single task or activity within a process.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Product
  definition: A solution created to meet the needs of a user, providing value and solving specific
    problems or fulfilling particular desires.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Product Analysis
  definition: Understanding user behavior toward a product, using real customer feedback and
    behavioral data to inform future updates or improvements.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Product Management
  definition: Developing and maintaining a product throughout its life cycle.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Program Manager
  definition: Coordinates the efforts of multiple similar or related projects to achieve the program's
    objectives.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Development Approach
  definition: The method by which a project deliverable (product, service, or result) is created and
    achieved — applying a set of procedures, techniques, practices, and rules throughout the life
    cycle. See also Predictive/Adaptive/Hybrid Approach.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Feasibility Study
  definition: Assesses a proposed project to determine whether it's realistically and practically
    achievable, and if so, how likely it is to succeed.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Manager / Project Lead
  definition: The person assigned by the performing organization to lead the team responsible for
    achieving the project objectives.
  domain: people
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Scope
  definition: The work performed to deliver a product, service, or result with the specified features
    and functions.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Strategy
  definition: A plan outlining the approach, actions, and measures taken to achieve specific goals
    within a project.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Team
  definition: The set of individuals who perform the required work for a project to successfully meet
    its goals.
  domain: people
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Project Vision
  definition: A short statement or paragraph summarizing the goal of the project and how it fits
    within the organization's overall strategy.
  domain: people
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Prototype
  definition: A primary or partial version of a required product/solution, used to obtain early
    feedback on requirements before committing to the final deliverable.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Requirement
  definition: A condition or capability necessary to be present in a product, service, or result to
    satisfy a business need.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Resource
  definition: A necessary asset that helps carry out a task or project — a person, team, tool,
    finances, or time.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Responsibility
  definition: The state of being answerable or accountable for something within one's power, control,
    or management.
  domain: people
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Scope Stability
  definition: Agile projects have low scope stability (requirements expected to change throughout);
    predictive projects have high scope stability (scope thoroughly defined during planning).
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: SMART Objective
  definition: Specific, Measurable, Achievable, Relevant, Time-bound — a framework for effectively
    setting and achieving goals.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Steering Committee / Project Board
  definition: An advisory body that provides direction and makes decisions outside the project team's
    authority.
  domain: business-environment
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Success Criteria
  definition: The measures used to determine whether a project has been successful — often scope,
    budget, timeline, business goals, deliverables, and risk management.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Task
  definition: A single unit of work or step in a multi-step project, completed by a set deadline and
    contributing toward work-related objectives. In agile, user stories split into tasks; in
    predictive, activities split into tasks.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Triple Constraints / Iron Triangle
  definition: Time, Cost, and Scope constraints that must be kept in balance to ensure deliverable
    quality.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Use Case
  definition: A definition of the sequence of actions a system performs that yields an observable
    result of value to a particular actor.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Wireframe
  definition: A top-level blueprint illustrating the structure of a website, app, or project, without
    design details — it maps structure and key elements only.
  domain: process
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md
- term: Team Facilitator
  definition: The agile team-lead role that removes impediments, facilitates, and coaches through
    servant leadership. Also called Scrum Master, project team lead, project manager, or team coach —
    overlapping titles for the same function, not distinct roles.
  domain: agile
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md
- term: PMI Talent Triangle
  definition: The three key PM skill areas PMI expects — business acumen, ways of working (technical
    PM skills), and power skills (interpersonal/leadership skills).
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: PMI Code of Ethics and Professional Conduct
  definition: PMI's four core values for professional conduct — Honesty, Respect, Fairness,
    Responsibility. Requires PMs to report accurate information promptly, comply with laws/regulations,
    and not conceal errors or omissions they discover.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: PMO Structures by Control Level
  definition: 'Three levels of PMO control, low to high: Supportive (consultative, provides
    templates/best practices on request), Controlling (requires compliance with frameworks/templates),
    Directive (directly manages the projects).'
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Leadership Styles
  definition: 'Situational (most common — matches style to the situation), Servant, Democratic,
    Transformational, Laissez-faire, Transactional, Charismatic, Authentic, Autocratic, and
    Interactional (a mix of Charismatic, Transactional, Transformational).'
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Power Types
  definition: 'Sources of a PM''s influence: Legitimate (formal position), Reward, Punish, Referent
    (personal respect/charisma), Expert (knowledge/skill), and Situational.'
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Motivation Theory (Theory X/Y/Z)
  definition: 'Theory X assumes people dislike work and need control; Theory Y assumes people are
    self-motivated and seek responsibility; Theory Z (Ouchi) emphasizes long-term employment,
    collective decision-making, and employee well-being.'
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Expectancy Theory
  definition: A motivation theory holding that motivation depends on believing effort leads to
    performance, and performance leads to a valued reward.
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Herzberg's Two-Factor Theory
  definition: Distinguishes intrinsic motivators (achievement, recognition, growth) from extrinsic
    hygiene factors (salary, conditions, policies) — hygiene factors prevent dissatisfaction but don't
    themselves motivate.
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Team Charter
  definition: A document, established during the Norming stage of team development, that captures how
    a team agrees to work together — including its ground rules.
  domain: people
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Lean
  definition: A management approach focused on continuous improvement of existing processes by
    eliminating waste.
  domain: agile
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Scrum of Scrums
  definition: A coordination mechanism for synchronizing work across multiple Scrum teams and Scrum
    Masters working on the same larger initiative.
  domain: agile
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Definition of Ready (DoR)
  definition: A checklist of criteria a backlog item must meet before it can be pulled into sprint
    planning — applied at Planning, as distinct from the Definition of Done, applied at Review.
  domain: agile
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Minimum Marketable Product (MMP)
  definition: The smallest product release with enough features to be sellable, prioritizing speed to
    market over the feedback/risk-reduction goal an MVP emphasizes.
  domain: agile
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Resource Leveling
  definition: A technique for resolving over-allocated resources by expanding the schedule.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Resource Smoothing
  definition: A technique for resolving resource conflicts using existing schedule slack, without
    expanding the schedule.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Lead (Schedule)
  definition: A planning parameter allowing a successor activity to start before its predecessor
    finishes (overlap). Set during the Planning phase.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Lag (Schedule)
  definition: A planning parameter enforcing a delay between a predecessor activity finishing and a
    successor starting. Set during the Planning phase.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Request For Quotation (RFQ) / Proposal (RFP) / Information (RFI)
  definition: 'Procurement request types: RFQ asks for pricing on a well-defined item; RFP asks for a
    full proposed approach on less-defined, complex work; RFI asks for general information before
    deciding what to formally request.'
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Bidder Conference
  definition: A meeting where the buyer answers seller questions and clarifies bid terms/conditions to
    all bidders at once, ensuring a level playing field.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Exit Criteria
  definition: The conditions a contract or project must meet to be considered complete.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Procurement Audit
  definition: A formal review of procurement processes, procedures, and activities across a project or
    organization.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Dispute Resolution Steps
  definition: 'The order procurement disputes should escalate through: (1) direct negotiation, (2)
    indirect negotiation (mediation/arbitration), (3) litigation, as a last resort.'
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Grading
  definition: Ranking between products or categories of differing scope/features — distinct from
    quality, which measures whether a deliverable meets its own requirements and fitness for use.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Regulations vs. Standards
  definition: Regulations are legally mandatory and must be complied with. Standards are guidelines —
    best practice, not a requirement, unless a contract or regulation specifically mandates them.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Kaizen
  definition: A continuous-improvement philosophy applied to processes, including quality processes.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Technical Debt
  definition: Delayed error-correction in a product or codebase — the longer it's deferred, the
    costlier it becomes to fix.
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Root Cause Analysis Tools
  definition: 'Techniques for tracing a defect or non-conformance back to its actual cause: the
    Fishbone (Ishikawa) diagram, the 5 Whys, and Why-Why diagrams.'
  domain: process
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Estimate Precision Ranges (ROM/Budgetary/Definitive)
  definition: 'Expected accuracy by estimate type: Rough Order of Magnitude (ROM) −25%/+75%,
    Conceptual/Budgetary −10%/+25%, Definitive −5%/+10%. Precision tightens as planning matures.'
  domain: formula
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Risk Breakdown Structure (RBS)
  definition: A hierarchical categorization of risk sources — Technical, External, Organizational,
    Managerial.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: VUCA (Volatility, Uncertainty, Complexity, Ambiguity)
  definition: 'Four factors used to characterize a risk environment: Volatility (unpredictable,
    fast-changing), Uncertainty (unclear present/future), Complexity (many interconnected factors),
    Ambiguity (lack of clarity about the event itself).'
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Active Acceptance / Passive Acceptance
  definition: Active acceptance takes some preparatory action (e.g. setting aside contingency) for an
    accepted risk; passive acceptance just monitors and responds only if/when the risk occurs.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Risk Audit / Risk Review
  definition: A risk audit checks the effectiveness of the risk management process itself; a risk
    review re-checks the effectiveness of the response plans already in place.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Trigger Condition
  definition: An event or condition that indicates a risk is about to occur or has occurred, prompting
    the planned response.
  domain: business-environment
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Budget at Completion (BAC)
  definition: The total planned/approved budget for the project.
  domain: formula
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Variance at Completion (VAC)
  definition: 'BAC minus EAC — the expected budget over/under at project completion, given current
    performance.'
  domain: formula
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md
- term: Active Listening
  definition: 'The practice of fully engaging with a speaker to accurately understand their message:
    allowing time to speak, using body language/eye contact, asking questions, paraphrasing to
    confirm understanding, avoiding distractions and judgment, and summarizing to close the loop.'
  domain: people
  source: sources/guides/2026-09-10-active-listening-skills.md
- term: Paraphrasing
  definition: Rewording what a speaker said back to them, to confirm understanding and give them a
    chance to correct any misconception before it compounds.
  domain: people
  source: sources/guides/2026-09-10-active-listening-skills.md
