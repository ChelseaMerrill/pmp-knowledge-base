# Quiz question bank. Claude appends to this when processing sources — see CLAUDE.md for the schema
# and workflow. Seeded with a handful of examples so the format is clear from the start.

- id: q-0001
  domain: formula
  topic: earned value management
  question: "A project has PV = $50,000, EV = $45,000, and AC = $52,000. Is the project ahead or behind schedule, and over or under budget?"
  answer: "Behind schedule and over budget."
  explanation: "SV = EV - PV = 45,000 - 50,000 = -5,000 (behind schedule). CV = EV - AC = 45,000 - 52,000 = -7,000 (over budget). Negative SV/CV is unfavorable."
  source: seed

- id: q-0002
  domain: agile
  topic: scrum roles
  question: "Who is accountable for maximizing the value of the product resulting from the work of the Scrum Team?"
  answer: "The Product Owner."
  explanation: "The Scrum Master coaches the team and removes impediments; the Product Owner owns the backlog and value."
  source: seed

- id: q-0003
  domain: people
  topic: conflict resolution
  question: "A team member insists on their preferred technical approach even after being shown data favoring an alternative. Which conflict-resolution technique are they using, and what is generally the strongest long-term approach instead?"
  answer: "They are using force/direct. Collaborate/problem-solve is generally the strongest long-term technique."
  explanation: "Force/direct pushes one view through regardless of input; collaborate/problem-solve looks for a solution that actually addresses the underlying concern, so it holds up better over time."
  source: seed

- id: q-0004
  domain: business-environment
  topic: risk response
  question: "A risk owner decides to purchase insurance to cover the financial impact of a risk if it occurs. Which risk response strategy is this?"
  answer: "Transfer."
  explanation: "Transfer shifts the impact of a threat to a third party (like an insurer) without eliminating it, distinct from mitigate (reduce probability/impact) or avoid (eliminate the risk entirely)."
  source: seed

- id: q-0005
  domain: process
  topic: critical path method
  question: "On a network diagram, an activity has a total float of 3 days and a free float of 0 days. What does that tell you?"
  answer: "The activity can slip up to 3 days without delaying the project end date, but any slip at all will delay the very next activity."
  explanation: "Total float measures slack against the project finish date; free float measures slack against the next activity's early start. Zero free float with nonzero total float is common when several paths share downstream activities."
  source: seed

- id: q-0006
  domain: people
  topic: stakeholder identification
  question: "During a construction project, several neighboring homeowners complain about noise and site traffic, even though they have no contractual relationship to the project. Are they stakeholders?"
  answer: "Yes."
  explanation: "A stakeholder is anyone with an interest in the project or affected by its outcomes — that includes parties impacted by the project who aren't part of the team, sponsor chain, or contract, such as neighbors."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0007
  domain: people
  topic: stakeholder identification
  question: "Name three stakeholder categories besides the project team and project manager that a project manager should consider when identifying stakeholders on a construction project."
  answer: "Any three of: sponsor, users/end-users, suppliers, government, financial institutions, others (e.g. neighbors, family members)."
  explanation: "Stakeholder identification should go well beyond the immediate team — sponsors, end-users, suppliers, regulators/government, financial institutions, and other impacted parties are all legitimate categories."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0008
  domain: people
  topic: stakeholder engagement
  question: "What is the difference between 'align stakeholder expectations' and 'manage stakeholder expectations' as ECO tasks?"
  answer: "Aligning happens up front, setting realistic shared expectations before/as the project starts; managing is ongoing throughout the project as circumstances change."
  explanation: "These are two separate ECO tasks in the People domain — one is a point-in-time activity early in the project, the other is continuous communication and negotiation as the project runs."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0009
  domain: people
  topic: stakeholder analysis
  question: "A project manager wants to decide how much engagement effort to spend on each stakeholder. What tool classifies stakeholders by authority and level of concern to help make that call?"
  answer: "The power/interest grid."
  explanation: "The power/interest grid plots stakeholders on power (authority) vs. interest (concern), guiding engagement strategy (e.g. manage closely vs. monitor)."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0010
  domain: people
  topic: stakeholder identification
  question: "A bank financing a construction project and the local zoning authority reviewing permits — are these considered project stakeholders even though neither is the customer or the project team?"
  answer: "Yes — financial institutions and government/regulatory bodies are both recognized stakeholder categories."
  explanation: "Stakeholders extend beyond the team and sponsor to anyone with an interest in or affected by the project, including financial institutions (banks, VCs, business angels) and government (local authorities, regulators)."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0011
  domain: people
  topic: stakeholder management plan
  question: "What is the purpose of a Stakeholder Management Plan, as distinct from the stakeholder register?"
  answer: "It's the formal framework/document that guides how stakeholders will be identified, analyzed, prioritized, engaged, and monitored throughout the project — the register is one input/output used to execute that plan, not the plan itself."
  explanation: "The Stakeholder Management Plan is the governing document; the stakeholder register captures the actual list and classification data that the plan's processes act on."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0012
  domain: people
  topic: communication planning
  question: "What is the difference between a communication strategy and a Communication Management Plan?"
  answer: "The communication strategy is the high-level, structured blueprint for the overall approach to engaging stakeholders; the Communication Management Plan is the detailed, tactical document specifying the actual methods, timelines, and tools."
  explanation: "Strategy sets direction and principles; the Communication Management Plan is the operational document a PM works from day to day."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0013
  domain: people
  topic: communication planning
  question: "The Communication Management Plan is organized around three core questions. What are they, and what does each cover?"
  answer: "Who (the target audience and their expectations/interests), What (the message types and formats), and How (delivery method/tools, formality level, and frequency)."
  explanation: "Who/What/How is the structuring framework the exam associates with building out a Communication Management Plan."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0014
  domain: formula
  topic: communication channels
  question: "A project team grows from 6 people to 10 people. How many additional communication channels does that add?"
  answer: "30 additional channels."
  explanation: "Channels = n(n-1)/2. At n=6: 6×5/2=15. At n=10: 10×9/2=45. Increase = 45−15 = 30."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0015
  domain: people
  topic: knowledge transfer
  question: "A senior engineer who is rolling off the project has years of hard-to-document troubleshooting intuition. What kind of knowledge is this, and what's the typical way to transfer it (vs. just writing a document)?"
  answer: "Tacit knowledge — typically transferred through mentoring, pairing, or direct conversation rather than documentation."
  explanation: "Explicit knowledge is easily codified in documents; tacit knowledge is experience-based and resists documentation, so it needs person-to-person transfer methods."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0016
  domain: business-environment
  topic: exam content outline
  question: "What is the difference between the ECO (Examination Content Outline) and the PMBOK Guide?"
  answer: "The ECO defines the critical job tasks a practicing PM performs, validated by the Job Task Analysis, and is what the exam actually tests. The PMBOK Guide is a knowledge reference of principles and processes — the exam tests applied judgment on realistic scenarios, not memorization of the Guide."
  explanation: "This distinction matters because study effort should center on being able to apply judgment to scenario-based tasks, not on memorizing the Guide's contents."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0017
  domain: process
  topic: development approach
  question: "Roughly what share of exam items reflect predictive approaches versus adaptive/agile and hybrid approaches combined?"
  answer: "About 40% predictive, and about 60% split between adaptive/agile and hybrid."
  explanation: "This roughly 40/60 split is why heavy agile/hybrid preparation matters even though 'Process' (the largest domain) has historically skewed predictive in older materials — approach isn't confined to one domain."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0018
  domain: business-environment
  topic: eligibility experience
  question: "A candidate leads Project I from Jan 1–Mar 31 and Project II from Feb 1–May 31 (overlapping). How many months of PM experience do these two projects count as, toward PMP eligibility?"
  answer: "5 months (Jan 1–May 31), not 7."
  explanation: "PMI counts eligibility experience by calendar tenure, not by summing each project's duration — overlapping time leading multiple projects isn't double-counted."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0019
  domain: business-environment
  topic: organizational structures
  question: "In a balanced matrix organization, who holds the primary managerial authority — the project manager or the functional manager?"
  answer: "The functional manager, though the PM has more authority than in a weak matrix."
  explanation: "Balanced matrix is a middle ground: the PM gains real influence, but the functional manager remains the primary authority until you reach a strong matrix or projectized structure."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0020
  domain: formula
  topic: financial selection
  question: "A project has a Benefit-Cost Ratio (BCR) of 0.8. Should the organization proceed, based on this number alone?"
  answer: "No — a BCR below 1.0 means costs outweigh benefits."
  explanation: "BCR = benefits ÷ costs. Above 1.0 is favorable (benefits exceed costs); below 1.0 means the project's costs outweigh its projected benefits."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0021
  domain: process
  topic: prioritization techniques
  question: "A product team wants to prioritize a long backlog into four tiers reflecting negotiable necessity. Which technique are they using: MoSCoW or the Kano model?"
  answer: "MoSCoW."
  explanation: "MoSCoW sorts items into Must Have / Should Have / Could Have / Won't Have. The Kano model instead weighs implementation cost against customer-satisfaction potential — a different axis, not a four-tier necessity sort."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0022
  domain: process
  topic: deliverable quality
  question: "A delivered product meets its original intended purpose and the client's expectations, but the client mentions they'd still like some UX polish later. Is this product 'fit for purpose,' 'fit for use,' both, or neither?"
  answer: "Both — fit for purpose and fit for use aren't mutually exclusive, and a fit-for-use product can still be improved further."
  explanation: "Fit for purpose means it satisfies its intended purpose and client expectations; fit for use means it's usable and meets goals in its current state. A product can be both and still have room for future improvement."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0023
  domain: formula
  topic: financial selection
  question: "A project manager is deciding whether to continue a troubled project. A team member argues to continue because '$200,000 has already been invested — we can't just abandon that.' What concept does this argument mischaracterize?"
  answer: "Sunk cost — money already spent is unrecoverable and irrelevant to the decision about what to do next."
  explanation: "The PM should evaluate the remaining costs and benefits of continuing vs. stopping, not the amount already spent. Letting sunk cost drive the decision is a classic bias the exam tests for."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0024
  domain: process
  topic: business value
  question: "A project finishes on time and under budget, but a stakeholder asks how the PM can be sure the customer will actually be satisfied. What actually ensures customer satisfaction?"
  answer: "Delivering value and conforming to project requirements."
  explanation: "On-time/under-budget delivery isn't sufficient by itself. Customer satisfaction depends on whether the deliverable conforms to requirements and is usable — that's what's actually measured."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0025
  domain: process
  topic: development approach
  question: "A complex AI platform project has cutting-edge tech, diverse stakeholder interests, and heavy regulatory compliance needs. What development approach fits best?"
  answer: "A hybrid approach."
  explanation: "Hybrid allows the structured planning/documentation regulatory compliance needs, while still enabling iterative development to handle evolving requirements and stakeholder needs — pure waterfall or pure agile each miss half of what's needed here."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0026
  domain: process
  topic: integration
  question: "What documents does a project manager need to develop the project charter? (Select the set.)"
  answer: "The business case, agreements, and the strategic/benefits plan."
  explanation: "These are the business documents feeding charter development. The project management plan is NOT one of them — it's developed after the charter is signed, not before."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0027
  domain: business-environment
  topic: organizational change
  question: "A company-wide Agile transformation faces resistance from stakeholders used to traditional PM, plus heavy regulatory compliance needs. What should the PM prioritize? (Select two.)"
  answer: "Establish a cross-functional Agile transformation team for alignment/inclusivity, and develop a tailored Agile training program for varying skill levels."
  explanation: "Dismissing resistance outright is wrong — the fix is inclusive structure (cross-functional team) plus meeting people where they are (tailored training), not ignoring concerns or skipping suitability groundwork."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0028
  domain: process
  topic: development approach
  question: "Some stakeholders don't support a digital marketing project; others want full up-front planning. The sponsor wants a quick win to build support. What approach should the PM take, and why?"
  answer: "An agile approach, because it produces functioning deliverables quickly."
  explanation: "The distinguishing reason matters on the exam: it's not 'agile would please the majority' (option A) — it's that agile's early, working deliverables are what create the quick win the sponsor actually needs."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0029
  domain: process
  topic: project life cycle
  question: "A team of five is building a mobile app. What project life cycle fits, and how is that different from a process group list or Tuckman's stages?"
  answer: "Wireframing, prototyping, designing, developing, testing, deploying — this is the project life cycle (the deliverable-specific phases), not process groups (initiating, planning, executing, M&C, closing) or team development stages (forming, storming, norming, performing, adjourning)."
  explanation: "The exam likes to mix these three phase-like lists together as distractors — know which kind of 'phases' a question is actually asking about."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0030
  domain: process
  topic: tailoring
  question: "Under PMBOK 7, what specifically does 'tailoring' mean?"
  answer: "The selection of the appropriate processes, inputs, tools, techniques, and life cycle phases for managing a project."
  explanation: "Distinguish this from 'project management' itself (applying knowledge/skills/tools/techniques to meet project requirements) and 'program management' (the same, but for a program) — tailoring is specifically about selecting the right subset for the specific project."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0031
  domain: business-environment
  topic: project selection
  question: "A PM presents to a committee of senior managers and SMEs who ask tough, critical questions aimed at finding reasons the project should NOT proceed. What's this technique called?"
  answer: "A murder board."
  explanation: "The murder board's job is to aggressively look for reasons to reject the proposal; the proposer's job is to answer every query and prove the project's worth."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0032
  domain: process
  topic: integration
  question: "A new project manager keeps hearing that work can't start until 'an official document is issued.' What document is this, and what does it do?"
  answer: "The project charter — it authorizes the project manager to launch project execution."
  explanation: "The charter also gives a brief description of the project and its requirements; the scope statement and project management plan both contain a more detailed version of the same, developed after the charter."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0033
  domain: process
  topic: project closure
  question: "At sprint review, the product owner is satisfied with the increment; a team member wants another iteration to fix bugs; the sponsor says funding for further work depends on next quarter's budget. What should the PM do?"
  answer: "Release all resources and close the project."
  explanation: "The client/sponsor is effectively requesting closure, even knowing about remaining bugs — continuing work to satisfy the client at this point is gold plating, and a project can't stay open pending uncertain future funding. If funding arrives, a new project addresses the remaining work."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0034
  domain: process
  topic: value delivery
  question: "A sponsor doubts the product will meet business demand and wants to minimize cost. What should the PM do?"
  answer: "Identify and implement the requirements for a Minimum Viable Product (MVP)."
  explanation: "MVP defines the smallest release that validates value against real demand — cheaper than a full incremental buildout, and it doesn't require excluding stakeholders or relying on a fixed-cost contract, neither of which addresses the actual concern (unproven demand)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0035
  domain: process
  topic: agile change management
  question: "During execution of an agile software project, the customer requests a requirement change. What should the PM do, and why is a CCB not the answer here?"
  answer: "Welcome the change request. Agile encourages responding to change; unlike predictive projects, agile doesn't route changes through a Change Control Board."
  explanation: "Flexibility is core to agile — regular stakeholder feedback is expected to reshape scope, which is the opposite of blocking or routing it through a formal board."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0036
  domain: process
  topic: business value
  question: "A make-or-buy analysis favored in-house development based on a developer rate that turns out to be half the current market rate. What should the PM do first?"
  answer: "Inform the sponsor about the findings."
  explanation: "This affects the project's business value/financial assumptions — the sponsor needs to know before anything else happens (submitting a change request, updating the analysis, or assuming SPI/CPI being on track covers it are all premature or insufficient)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0037
  domain: process
  topic: integration
  question: "A newly assigned PM is replacing one who recently left the project. What should they consult first?"
  answer: "The project charter — to understand the project's goals and business case."
  explanation: "Understanding why the project exists and what it's meant to achieve comes before diving into baselines (the PM plan), open issues (issues/lessons-learned logs), or stakeholder outreach (the register) — those all follow from understanding the charter first."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0038
  domain: process
  topic: development approach
  question: "An adaptive-approach project has a fixed budget, 3–5 previewed releases, and progressively detailed scope. What should the PM do as the project proceeds?"
  answer: "Work with stakeholders to prioritize work for each release until the budget runs out."
  explanation: "In adaptive approaches, cost and schedule are typically fixed while scope flexes — so the team prioritizes the highest-value work per release rather than pre-committing to a fixed scope or switching to predictive."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0039
  domain: business-environment
  topic: professional responsibility
  question: "A PM reviewing a predictive project discovers deliverables marked 'finished' are actually still in progress, and the project is really over budget and behind schedule (contrary to what the sponsor believes). What should the PM do next?"
  answer: "Notify the sponsor of the findings."
  explanation: "Per PMI's Code of Ethics and Professional Conduct, a PM who discovers errors or omissions caused by others must communicate them to the appropriate party promptly and accurately — not quietly try to fix it, decline the assignment, or jump straight to schedule compression."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0040
  domain: business-environment
  topic: compliance
  question: "While developing the project charter, a PM discovers missing regulatory requirements in the business case — compliance risks scope/budget overrun, non-compliance risks legal exposure. What should the PM do, and why can't they issue a change request yet?"
  answer: "Inform the project sponsor of the findings. A change request isn't possible yet because the project isn't authorized or baselined — it's still in charter development."
  explanation: "PMI's Code of Ethics requires compliance with laws/regulations and prohibits concealing such findings. Change requests operate against a baseline, which doesn't exist yet at this stage."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0041
  domain: people
  topic: agile roles
  question: "A PM worried about job security under an Agile transition believes Agile teams only have team members, a Scrum Master, and a Product Owner — no PM. Is that concern justified?"
  answer: "No — the PM can continue, typically as more of a facilitator (team facilitator/Scrum Master/coach are overlapping titles for that role)."
  explanation: "Agile's three common roles are cross-functional team members, the product owner, and a team facilitator — which can be titled Scrum Master, project team lead, project manager, or team coach. The role leans on servant leadership: removing impediments, facilitating, coaching."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0042
  domain: process
  topic: project vs operations
  question: "How do operations differ from projects, precisely?"
  answer: "Operations are ongoing endeavors that generate repetitive outputs — the continuous execution of activities per an organization's procedures to produce the same result or a recurring service. There's no such thing as an 'ongoing project.'"
  explanation: "A project is temporary with a unique result; an operation is permanent/ongoing with a repetitive result. Production, manufacturing, and accounting are examples of operations, not projects."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0043
  domain: business-environment
  topic: organizational structures
  question: "In a weak matrix organization, who's in charge of hiring when additional team members are needed?"
  answer: "The functional manager."
  explanation: "In a weak matrix, authority leans functional — the functional manager controls staffing decisions, not the PM."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0044
  domain: business-environment
  topic: organizational structures
  question: "In which organizational structure does the project manager have the most control?"
  answer: "Projectized."
  explanation: "Projectized gives the PM full authority over the project — more than strong matrix, balanced matrix, or weak matrix, in that order."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0045
  domain: process
  topic: project success
  question: "A senior engineer is newly assigned to manage an Agile project. What should they do first to set the project up for success?"
  answer: "Define the project success criteria."
  explanation: "Before identifying risks, planning sprint activities, or defining quality metrics, the project needs an agreed definition of what success actually looks like — everything else should trace back to that."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0046
  domain: process
  topic: business value
  question: "All requirements have been gathered for a new software build. What should the team focus on next?"
  answer: "Delivering value to the customer."
  explanation: "Cost reduction, teamwork, and hitting the schedule are all secondary to the actual point of the project — delivering value that satisfies the gathered requirements."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0047
  domain: business-environment
  topic: organizational change
  question: "A large organization adopted Agile based on industry trends, invested heavily, but the implementation failed within months. What should the PM have done differently?"
  answer: "Assessed the organization's culture, performed a suitability analysis, and determined the future state before implementing."
  explanation: "Training everyone, running a postmortem, or hiring a third-party team are all downstream fixes — the actual gap was skipping the upfront culture/suitability assessment that determines whether and how Agile should be adopted at all."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0048
  domain: process
  topic: development approach
  question: "A component was being built predictively per the scope management plan, but changing regulations lead the team to request switching to Agile. What should the PM do first?"
  answer: "Analyze the requirements that would need to be addressed under the requested (Agile) method."
  explanation: "Before escalating for money, routing to the PMO, or seeking sponsor approval, the PM needs to understand what the change in approach actually requires — that analysis is what any of those next steps would be based on."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0049
  domain: process
  topic: project closure
  question: "During closing, the PM learns a deliverable isn't meeting customer expectations. How should they proceed?"
  answer: "Review the deliverable requirements, check the customer's approval criteria, and proceed accordingly."
  explanation: "This grounds the next step in what was actually agreed to, rather than jumping to a new change request, an ad hoc scope negotiation, or looping in the sponsor before even confirming what the criteria said."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0050
  domain: business-environment
  topic: organizational process assets
  question: "During sprint zero, a team member recalls a similar past project that went over budget and behind schedule. Where should the PM look for that project's performance details?"
  answer: "In the Organizational Process Assets (OPAs)."
  explanation: "Historical project performance data is exactly what OPAs are for — not EEFs (external conditions), the issue log (current project's own issues), and it's not irrelevant just because the past project used a different development approach."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0051
  domain: people
  topic: stakeholder engagement
  question: "Two weeks after charter approval on a global project, the PM realizes it was approved based on a different understanding among international stakeholders than what was actually presented. What should the PM have done to prevent this?"
  answer: "Validated each stakeholder's understanding during the kickoff meeting."
  explanation: "Sending minutes afterward or reviewing approvals later are both after-the-fact fixes; actively validating understanding in the room (across cultures/time zones) is what prevents the misalignment in the first place."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0052
  domain: process
  topic: requirements
  question: "A PM receives a requirements document from the customer but finds several requirements, outputs, and the project's ultimate goal hard to understand. What should the PM do next?"
  answer: "Ask the customer for clarification."
  explanation: "Don't reject the project, start planning around assumptions, or acquire a separate team to reverse-engineer intent — go to the source and ask."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0053
  domain: people
  topic: stakeholder engagement
  question: "A project has dozens of stakeholders — most need only high-level updates, a few need detailed, frequent updates. What should the PM create to address this?"
  answer: "A stakeholder engagement plan."
  explanation: "The power/interest grid classifies stakeholders but doesn't itself define communication cadence and depth; the salience model and engagement assessment matrix are related but the engagement plan is the actual deliverable that operationalizes differentiated engagement."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0054
  domain: people
  topic: stakeholder engagement
  question: "Mid-project, stakeholder engagement seems to be fading and the PM wants to measure satisfaction. Which two tools/techniques help most directly?"
  answer: "Net Promoter Score (NPS) and mood charts."
  explanation: "The power/interest grid and engagement assessment matrix are classification/planning tools, not satisfaction-measurement tools — NPS and mood charts are the ones that actually gauge how stakeholders currently feel."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0055
  domain: business-environment
  topic: project closure
  question: "Halfway through a 3D modeling project, the sponsor requests termination because an unrelated external change (a nearby dam) will make the deliverable's location unappealing. What should the PM do?"
  answer: "Terminate the project as per the sponsor's request."
  explanation: "The sponsor has the authority to end the project, and the stated reason is legitimate (external change affecting value) — negotiating to continue or insisting the dam is irrelevant both override a decision that's the sponsor's to make."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0056
  domain: process
  topic: integrated change control
  question: "The PM proposed a plan to the CCB for a scope deviation; the CCB approved a different implementation method than the PM's own proposal. The PM disagrees with the approved method. What should they do?"
  answer: "Implement the change using the approved method."
  explanation: "Once the CCB decides, the PM implements the approved decision exactly as approved — not their own preferred alternative, and not by refusing, resigning, or trying to relitigate the decision with a new prototype."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0057
  domain: people
  topic: communication planning
  question: "A PM leads a project for a client; a representative verbally agreed by phone to an extra $8,000 in added scope, then later refused to pay when invoiced. What could the PM have done differently?"
  answer: "Chosen a more appropriate communication channel — i.e., gotten the agreement in writing rather than relying on a verbal phone agreement."
  explanation: "Cutting scope or negotiating a lower price after the fact don't address the actual root cause: an informal, undocumented commitment for a cost-impacting change."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0058
  domain: people
  topic: stakeholder engagement
  question: "A legal stakeholder skips meetings and shows no interest in the product design during planning. How should the PM handle this?"
  answer: "Review the stakeholder engagement plan and communication strategy."
  explanation: "Escalating immediately, chasing the stakeholder down personally, or just updating the register without a strategy change all skip the actual diagnostic step — check whether the current engagement approach even fits this stakeholder before doing anything else."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0059
  domain: process
  topic: earned value management
  question: "A project has BAC = $500,000 and a current EAC of $540,000. What's the Variance at Completion (VAC), and what does it mean?"
  answer: "VAC = BAC − EAC = 500,000 − 540,000 = −$40,000, meaning the project is forecast to finish $40,000 over its original budget."
  explanation: "VAC extends the EVM formula set: a negative VAC signals an unfavorable budget outcome at completion, the same direction convention as CV and SV."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0060
  domain: process
  topic: schedule control
  question: "A resource is over-allocated across two activities. The PM has schedule slack available and doesn't want to push out the project end date. Should they use resource leveling or resource smoothing?"
  answer: "Resource smoothing — it resolves the conflict using existing slack without expanding the schedule."
  explanation: "Resource leveling would also fix the over-allocation but does so by expanding the schedule, which isn't what the PM wants here."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0061
  domain: people
  topic: active listening
  question: "A stakeholder is explaining a concern. Before responding with a solution, what should the PM do to confirm they actually understood the concern correctly?"
  answer: "Paraphrase — reword what the stakeholder said back to them, giving them a chance to correct any misunderstanding."
  explanation: "Paraphrasing closes the loop on understanding before acting; jumping straight to a solution risks solving the wrong problem."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0062
  domain: people
  topic: active listening
  question: "During a heated conversation with a team member, the PM catches themselves already forming a rebuttal while the team member is still talking. Which active listening principle are they violating?"
  answer: "Allowing time to speak (and, relatedly, avoiding judgment) — rushing to reply before fully listening hinders actual understanding."
  explanation: "The first active listening principle is patience: let the other person finish before responding, rather than half-listening while preparing a reply."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0063
  domain: people
  topic: active listening
  question: "A productive conversation with a stakeholder just ended without anyone stating what happens next. What active listening step was skipped, and why does it matter?"
  answer: "Summarizing and moving forward — without it, there's no confirmed alignment on key points or agreed next steps, so the discussion doesn't reliably lead to a tangible outcome."
  explanation: "Summarizing is the closing step that converts a conversation into action — skipping it is a common way agreements quietly fail to happen."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0064
  domain: business-environment
  topic: project governance
  question: "What is project governance, in one sentence?"
  answer: "The framework of policies, processes, and practices that guide project decision-making, ensuring alignment with organizational objectives, accountability, and successful delivery."
  explanation: "Governance is a framework, not a single document — it's the overall structure of oversight, decision rights, and controls a project operates inside."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0065
  domain: business-environment
  topic: project governance
  question: "Name the five pillars of effective project governance."
  answer: "Clear Roles and Accountability; a Decision-Making Framework; Effective Risk Management; Performance Monitoring and Control (Oversight); and Stakeholder Engagement & Transparency."
  explanation: "These five together are what makes a governance framework actually function, not just exist on paper."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0066
  domain: business-environment
  topic: project governance
  question: "On a large construction project, the project organigram shows a Project Board (finance, design authority, regulatory authority, government, community stakeholders, procurement) sitting above a Project Team (design/engineering and construction teams). What does this two-level split represent?"
  answer: "The general governance pattern of an oversight/decision-making layer structurally above the delivery layer, with clear accountability running between them."
  explanation: "This is the standard shape of project governance: a board that holds decision-making authority and approves direction, distinct from the teams executing the work."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0067
  domain: process
  topic: PMIS
  question: "A stakeholder asks whether the Communication Management Plan and the PMIS are the same thing. How would you explain the difference?"
  answer: "No — the Communication Management Plan defines who needs what information, in what format, and how often; the PMIS is the software/tooling that actually stores, moves, and gives centralized access to that information."
  explanation: "PMIS is a tool/technique, not a plan. The plan drives what should happen; the PMIS is (one of) the means by which it happens."
  source: sources/guides/2026-09-10-pmis.md

- id: q-0068
  domain: process
  topic: interface management
  question: "The architectural team and structural engineering team coordinate to make sure the building design aligns with load-bearing requirements. What interface type is this, along the scope axis and the nature axis?"
  answer: "Internal (a single scope of work — design) and Soft (an exchange of information between teams, not a physical connection)."
  explanation: "Internal/External and Soft/Hard are two independent classification axes — this example is internal because both teams work within the same overall scope, and soft because it's information exchange, not a physical fit."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0069
  domain: process
  topic: interface management
  question: "Pre-fabricated steel beams from an external supplier must fit precisely with the foundation and load-bearing columns built by the project team. What interface type is this?"
  answer: "A Hard interface (a physical connection between components) — and External, since it spans two separate scopes of work (the supplier's fabrication scope and the project's construction scope)."
  explanation: "Hard interfaces are about physical fit, not communication — but they still get classified as internal or external depending on whether the connected parties share a scope of work."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0070
  domain: process
  topic: interface management
  question: "Name at least three advantages of actively managing interfaces between project stakeholders, rather than leaving coordination to chance."
  answer: "Any three of: increased alignment, improved visibility and oversight, facilitated communication, mitigated risk."
  explanation: "Interface Management exists because leaving multi-party coordination unmanaged is itself a risk — these are the direct benefits of managing it deliberately."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0071
  domain: people
  topic: stakeholder engagement
  question: "A construction project for an electricity factory in a forested area triggers environmentalist protests, widely covered in the media, that disrupt the project. What should the PM have done earlier to avoid this?"
  answer: "Engage in open dialogue with the environmentalists early to understand their concerns and perspectives on the project's environmental impact."
  explanation: "Open dialogue builds trust and goodwill and surfaces concerns before they escalate — insurance, financial incentives, or purely internal mitigation planning don't address the actual relationship with this stakeholder group."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0072
  domain: people
  topic: cross-cultural communication
  question: "A PM working with foreign stakeholders learns their email tone has been read as harsh and abrasive. What should the PM do?"
  answer: "Apologize for any unintended offense and adjust future emails to be more culturally sensitive and diplomatic."
  explanation: "Defending the style as 'clear and direct,' or just switching medium without addressing tone, both dodge the actual feedback — acknowledging impact and adjusting is the right response."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0073
  domain: people
  topic: stakeholder engagement
  question: "A key stakeholder (the Mayor's Chief of Staff) has high influence but a notoriously packed schedule, making regular face-to-face meetings impossible. What communication approach fits best?"
  answer: "Concise, targeted channels — weekly email updates, bi-weekly status reports, and regular calls — to keep him informed and solicit feedback without requiring dedicated meeting time."
  explanation: "Persistently pushing for face-to-face meetings ignores the schedule constraint; delegating communication away from the PM risks losing a high-influence relationship; quarterly sessions are too infrequent for someone this influential."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0074
  domain: people
  topic: stakeholder analysis
  question: "A significant shareholder shows little interest in a project, missing most meetings despite repeated engagement attempts. What should the PM do?"
  answer: "Initiate a stakeholder analysis to tailor communication strategies and engagement approaches to this stakeholder's actual preferences and priorities."
  explanation: "Giving up and focusing only on responsive stakeholders, or demanding participation, both skip the diagnostic step — understanding why they're disengaged should come before deciding how to re-engage them."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0075
  domain: process
  topic: agile roles
  question: "At a sprint review, the product owner approves release of the increment, but a key stakeholder in attendance disapproves. What should the PM/facilitator do first?"
  answer: "Align the product owner and the key stakeholder on a common decision. If that fails, support the product owner's decision, since the PO is accountable for approving deliverables."
  explanation: "It's not up to the cross-functional team to vote on release decisions — that authority sits with the PO, and the facilitator's first move is trying to reconcile the disagreement, not immediately defaulting to either party."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0076
  domain: people
  topic: stakeholder engagement
  question: "A key, high-power stakeholder refuses to sign off the acceptance document during product validation, claiming functionalities don't meet expectations. What should the PM have done to avoid this?"
  answer: "Involve the key stakeholder during all project phases, not just planning or quality control alone."
  explanation: "High-power stakeholders (per the power/interest grid) need to be managed closely and/or kept satisfied throughout — waiting until validation to involve them is what creates last-minute surprises like this."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0077
  domain: people
  topic: stakeholder identification
  question: "A project installing 120 air conditioners has a huge number of stakeholders — nearly one per office. What's the best way for the PM to handle this scale?"
  answer: "Set up an effective, systematic way to define the needs of each individual stakeholder."
  explanation: "Delegating representation to the sponsor, only engaging high power/interest stakeholders, or splitting the work into a program purely to dodge the stakeholder count are all shortcuts that skip identifying real needs — scale is a process problem, not a reason to exclude people."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0078
  domain: people
  topic: stakeholder analysis
  question: "The head of investments claims they never receive the PM's emails and can't help; the head of customer relations is too busy to reply to emails but responds fine in person. How should the PM classify each in the stakeholder engagement assessment matrix?"
  answer: "The head of investments is resistant (unwilling to help); the head of customer relations is neutral (too busy/indifferent, not opposed)."
  explanation: "Resistant means aware but unsupportive; neutral means aware but neither supportive nor resistant. Claiming to never get emails is a passive-resistance pattern, not genuine unawareness."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0079
  domain: people
  topic: stakeholder resistance
  question: "A project manager presents a stadium project the community supports in principle, but encounters strong stakeholder resistance from the start. What should the PM do to resolve this — and what should they NOT do?"
  answer: "Schedule a meeting to thoroughly explain the project, establish ground rules, ensure involvement, and surface any underlying personal/organizational issues. They should NOT create a 'fait accompli' to pressure acceptance."
  explanation: "Overcoming resistance starts with listening and understanding what drives it — a fait accompli tries to bypass that understanding entirely, and is a reliable wrong answer on the exam."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0080
  domain: process
  topic: development approach
  question: "Starting the second phase of a hybrid project after requirements challenges in phase one, the PM wants stakeholders to find common ground before differences widen. What should they do?"
  answer: "Invite all concerned stakeholders to a requirements workshop to develop user stories together."
  explanation: "A facilitated workshop's shared interaction helps a group reach consensus in a way that individual questionnaires, one-on-one meetings, or user surveys don't."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0081
  domain: people
  topic: power/interest grid
  question: "A stakeholder has high power but low interest in the project. Which power/interest grid engagement strategy fits, and how does that differ from a stakeholder with high power AND high interest?"
  answer: "Keep Satisfied (high power, low interest) — don't overwhelm them with detail, but don't neglect them either, since they can still impact the project. High power + high interest is Manage Closely, requiring active engagement."
  explanation: "The four quadrant labels are Manage Closely (high/high), Keep Satisfied (high power/low interest), Keep Informed (low power/high interest), and Monitor (low/low)."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0082
  domain: people
  topic: conflict resolution
  question: "What are the 5 levels of conflict escalation, in order?"
  answer: "Problem to solve, Disagreement, Contest, Crusade, World War."
  explanation: "Each level needs a more deliberate response than the last — the goal of resolving conflict early and well is to stop it from escalating to the next level."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0083
  domain: people
  topic: communication methods
  question: "A PM gives a demanding sponsor access to the project management software so they can check real-time status themselves. Is this sufficient communication for a high-power, high-interest stakeholder on a complex project?"
  answer: "Not on its own — this is pull communication, which shifts the effort onto the sponsor to seek information, and may not be sufficient for a high-power, demanding stakeholder who expects information pushed to them plus regular interactive touchpoints."
  explanation: "For complex projects with demanding sponsors, frequent push/interactive communication (regular meetings, standup access) generally beats pull-only or infrequent push-only approaches."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0084
  domain: people
  topic: communication model
  question: "During a status meeting, a team member uses heavy industry jargon that confuses the rest of the group. What type of communication noise is this?"
  answer: "Semantic noise."
  explanation: "Semantic noise is caused by word choice/jargon the receiver doesn't understand — distinct from physiological (speaker-side delivery), psychological (judgment/bias), or physical (environmental) noise."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0085
  domain: people
  topic: stakeholder engagement
  question: "What's the difference between the Stakeholder Engagement Assessment Matrix and the Stakeholder Engagement Plan?"
  answer: "The assessment matrix compares each stakeholder's current engagement state against their desired state — a diagnostic snapshot. The engagement plan specifies the actual strategies and actions to close that gap."
  explanation: "Analysis tools (power/interest grid, engagement assessment matrix, Salience Model) tell you where stakeholders stand; the engagement plan is the actionable document built from that analysis."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0086
  domain: people
  topic: team development
  question: "A PM is starting a new project with an experienced team. At which Tuckman stage should the team charter be created, and why?"
  answer: "At the Forming stage — creating it at the outset establishes clear goals, roles, and expectations from the start, giving the team a foundation to work from through Storming, Norming, and Performing."
  explanation: "This corrects an earlier note in this knowledge base that placed the team charter at Norming — the team-management source material is explicit that it belongs at Forming, not left to emerge organically later."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0087
  domain: people
  topic: power types
  question: "A stakeholder tells a team member they're 'not living up to what was promised' in order to get them to comply. Which type of power is this, and how does it differ from pressure-based power?"
  answer: "Guilt-based power — inducing guilt to motivate compliance. Pressure-based power is different: it works by limiting someone's freedom of choice, not by making them feel guilty."
  explanation: "Both are less-common power types beyond the core five (legitimate, reward, penalty, referent, expert) — the exam distinguishes them by mechanism: guilt-based plays on emotion, pressure-based constrains options."
  source: sources/guides/2026-09-11-team-management-keywords.md

- id: q-0088
  domain: people
  topic: personality assessment
  question: "A team member with deep expertise actively volunteers to coach and mentor newer members, but in meetings pushes his own solutions assertively without weighing alternative perspectives. Which two MBTI traits does this describe?"
  answer: "Extrovert and Judging."
  explanation: "Volunteering to actively engage with others indicates Extrovert (vs. Introvert); being assertive/decisive and not fully considering alternatives aligns with Judging (vs. Perceiving, which stays open and flexible)."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0089
  domain: people
  topic: motivation
  question: "A senior team member on a multi-year project starts losing motivation, saying their work could easily be done by a junior. What's the right fix, and why not just give them a raise?"
  answer: "Find them more challenging work. The demotivation is intrinsic — they want challenge and growth, not just compensation — so a raise or team-building activity doesn't address the actual cause."
  explanation: "Per PMBOK 7th edition (p. 25), team members respond well to stretch goals and problem-solving when the underlying issue is intrinsic motivation, not extrinsic (hygiene) factors like pay."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0090
  domain: people
  topic: self-organizing teams
  question: "After an org-wide move to Agile, team members still wait for the PM to hand them work instead of self-organizing. What should the PM actually do?"
  answer: "Mentor the team on how to make their own decisions."
  explanation: "Self-organization is a capability the team has to build, not just a structural condition — ensuring diverse functional expertise or removing impediments helps, but doesn't teach the team how to decide for itself."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0091
  domain: people
  topic: resource management
  question: "A construction PM needs to know whether the electricity team is free in the next two weeks to resolve a dependency. Should they check the RACI/RAM, or the resource calendar — and why?"
  answer: "The resource calendar — it shows when resources (team members and equipment) are actually available. The RACI/RAM shows who is responsible for what, not when they're free."
  explanation: "A common exam trap: RAM/RACI and resource calendars both look like 'team management documents,' but they answer different questions — responsibility vs. availability."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0092
  domain: people
  topic: remote team communication
  question: "A PM leads a hybrid team spread across four continents and communication is suffering. What two techniques specifically help, and what do they each involve?"
  answer: "Remote pairing (two or more people join an online event at a set time to discuss and share screens) and fishbowl windows (a long-lived video feed team members join at the start of the workday and leave at the end, so the team feels co-located)."
  explanation: "Both come from the Agile Practice Guide (p. 46) — colocating a globally distributed team isn't realistic, and 'use an agile approach' on its own doesn't address the communication mechanics."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0093
  domain: people
  topic: conflict resolution
  question: "Before a client demo, the team spends 15 minutes stuck debating repair-vs-replace for a defective component — both options are negligible in cost, risk-free, and take under an hour. What should the PM do?"
  answer: "Call for a vote to reach a decision."
  explanation: "Voting is the right tool for a quick, low-stakes decision the team can't converge on — it's simple and efficient. Letting the debate continue, calling a formal meeting, or escalating to the sponsor would all be disproportionate to the stakes involved."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0094
  domain: people
  topic: conflict resolution
  question: "A frustrated team member tells the PM a coworker's mistakes put him behind schedule. The PM reassures him she's aware of the situation and that his hard work is noticed and appreciated. Which conflict resolution technique is this, and what's its limitation?"
  answer: "Smoothing — giving more consideration to one side to defuse the situation. It builds harmony for a non-critical issue, but unlike collaborating/problem-solving, it doesn't actually address the root cause (the coworker's mistakes)."
  explanation: "Smoothing sits in the middle of the technique ranking (below collaborating and compromising) precisely because it prioritizes short-term harmony over resolving the underlying issue."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0095
  domain: process
  topic: schedule behavioral traps
  question: "A project team is stuck behind schedule because activities that finished early sat idle since the next team wasn't ready to start. Which schedule/resource behavioral trap is this, and how does it differ from Student Syndrome?"
  answer: "Dropped Baton — the preceding activity finishes early but the successor isn't ready, so the time gained is lost. Student Syndrome is different: it's procrastination eating into an activity's own slack, not a handoff failure between two activities."
  explanation: "Both traps waste schedule buffer, but Dropped Baton is a coordination/handoff problem between activities, while Student Syndrome is a within-activity timing problem."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0096
  domain: process
  topic: estimating
  question: "A sponsor asks the PM for an approximate cost estimate by end of day, very early in the project, with almost no information available yet. What estimating technique should the PM use, and why?"
  answer: "Analogous (top-down) estimating — using the known costs of a similar completed project, combined with expert judgment and historical data. Building a WBS and summing work-package costs, or creating the cost management plan, are both too involved for a same-day, early-stage estimate."
  explanation: "Analogous estimating trades accuracy for speed, which is exactly the tradeoff this scenario calls for — it fits the ROM/preliminary estimate range (−25%/+75%), appropriate this early."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0097
  domain: process
  topic: EVM interpretation
  question: "Over four months, a project's SPI trends from 1.00 up to 1.25 while its CPI trends from 1.00 down to 0.70. What should the PM do?"
  answer: "Take corrective action on cost specifically — the project is increasingly over budget (CPI < 1) even though it's increasingly ahead of schedule (SPI > 1). Schedule doesn't need fixing; cost does."
  explanation: "Reading CPI and SPI together (not just individually) is what tells you which lever to pull — treating both as broken, or doing nothing because schedule looks fine, both misread the data."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0098
  domain: process
  topic: scope statement
  question: "A PM and business analyst are about to develop the scope statement from gathered requirements on a waterfall project. What four things does the scope statement itself contain?"
  answer: "Scope description, deliverables, acceptance criteria, and exclusions (PMBOK 7th edition, page 246)."
  explanation: "This is distinct from the WBS/WBS dictionary (built after the scope statement), the Scope Management Plan/SOW/RTM, and the project charter/PM plan — each is a separate document in the planning sequence."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0099
  domain: process
  topic: resource management
  question: "Team members allocated to a project at 50% availability are actually spending less than half their time on it, and the PM didn't personally assign them. Who should the PM negotiate with to fix this, and why?"
  answer: "The functional managers — negotiating clear, written assignments with reliable scheduling priorities. Since the PM didn't assign the team directly, the organization is functional, and staff assignment is the functional managers' responsibility, not the sponsor's."
  explanation: "Asking the sponsor for more resources, adjusting deadlines, or crashing the project all skip past the actual root cause: competing priorities set by the functional managers who control the staff."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0100
  domain: process
  topic: requirements traceability
  question: "A predictive project team discovers many implemented features differ from what's in the scope statement. Which document should the PM check, and where does it sit in the planning flow?"
  answer: "The Requirements Traceability Matrix (RTM) — it maps requirements to the deliverables that satisfy them, along with issues and test results. Flow: Requirements → Scope Statement → WBS/WBS Dictionary → Execution."
  explanation: "The RTM is the evidence trail confirming requirements were actually fulfilled (PMBOK 7th edition, page 189) — not the WBS/WBS dictionary (which organize the work) or the project charter (which authorizes the project)."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0101
  domain: process
  topic: change control
  question: "A conference sponsor requests two more attendees one day before the event, requiring PM to rearrange lodging, catering, and gift packages, even though the room technically has capacity. What should the PM do first?"
  answer: "Issue a change request to the Change Control Board (CCB), even though it came from the sponsor and even though it's last-minute."
  explanation: "A critical key stakeholder's request still has to go through the formal change process — auto-accepting it because it's the sponsor, or refusing it because it's late notice, both skip the CCB (PMBOK 7th edition, page 77)."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0102
  domain: process
  topic: EVM corrective action
  question: "A project's SPI is 1.10 (ahead of schedule) and CPI is 0.80 (over budget). What technique should the PM use to balance the two, and what's the tradeoff?"
  answer: "Resource leveling — spreading out resource usage (and therefore costs) over time to reduce spending spikes. The tradeoff is that it may lengthen the schedule, which is acceptable here since the project has schedule cushion to spend."
  explanation: "Crashing or fast-tracking would only make the budget problem worse (both cost more or add risk); leveling is the technique that specifically trades schedule slack for cost control."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0103
  domain: process
  topic: work authorization
  question: "Tasks on a project keep happening out of the right order at the wrong times, causing rework and hurting morale. Which PM tool addresses this directly, and why not a RACI matrix?"
  answer: "A Work Authorization System — formal documented procedures for authorizing work, ensuring it happens at the right time and in the correct sequence. A RACI matrix defines who's responsible for what, not when work is allowed to start."
  explanation: "Org charts and RACI matrices are responsibility/reporting tools; the work authorization system is specifically a sequencing/timing control."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0104
  domain: process
  topic: schedule compression
  question: "A sponsor tells the PM the project must finish one week earlier than agreed. Between crashing and fast-tracking, which should the PM try first, and why?"
  answer: "Fast-tracking — running originally sequential activities in parallel. It's the less costly option; crashing (adding resources) costs more, so the cheaper compression technique should be tried first when possible (PMBOK 7th edition, page 59)."
  explanation: "Adding duration buffers or leveling resources wouldn't shorten the schedule at all, so they don't answer the sponsor's request."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0105
  domain: people
  topic: agile vision vs sprint goal
  question: "A self-organizing team is reviewing an important Epic and members surface fundamentally different interpretations of how it should be broken down — revealing they don't share a common understanding of why the project exists. What should the PM do, and why isn't reminding them of the sprint goal enough?"
  answer: "Remind the team of the project/product vision. The sprint goal only frames the current iteration's purpose, not the overall project purpose — it can't fix a gap in understanding that sits above the sprint level."
  explanation: "The release plan and the Epic's acceptance criteria have the same problem: they clarify a narrower scope (a release, or the Epic's approval conditions) but don't establish the project's overall purpose."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0106
  domain: process
  topic: sprint backlog renegotiation
  question: "Mid-sprint, a team hits unexpected technical complexity (e.g. integrating a third-party payment gateway) and realizes it won't finish all committed user stories. What should happen to the sprint backlog, and why not just cancel the sprint?"
  answer: "The team collaborates with the product owner to re-negotiate the remaining items on the sprint backlog. The sprint backlog can be clarified and adjusted mid-sprint as more is learned, keeping the sprint goal achievable without a full cancellation."
  explanation: "Cancelling the sprint is reserved for when the sprint goal itself becomes obsolete, and only the PO can do it — a capacity/complexity surprise doesn't rise to that level."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0107
  domain: people
  topic: servant leadership and impediments
  question: "A designer hired to keep the agile team cross-functional reports that his software subscription plan is missing functionality he needs, and asks for an upgrade. What should the PM do, and what leadership style does this illustrate?"
  answer: "Reach out to the appropriate stakeholder to get the subscription upgraded. This illustrates servant leadership — the PM's job is to listen for impediments raised by team members and act to remove them, not defer the issue to a future ceremony or tell the member to work around it."
  explanation: "Telling the designer to be self-reliant, or waiting for the next retrospective, both leave a known impediment blocking the team's work instead of removing it."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0108
  domain: process
  topic: risk-value backlog prioritization
  question: "Using a risk-value matrix to prioritize a product backlog, in what order (highest to lowest priority) should these four categories of items be worked: high value/high risk, high value/low risk, low value/low risk, low value/high risk?"
  answer: "High value/low risk first, then high value/high risk, then low value/low risk, then low value/high risk last."
  explanation: "Value is weighted more heavily than risk-avoidance: the matrix pulls high-value work forward regardless of risk level, and pushes low-value work back — with low-value/high-risk items deprioritized hardest since they offer the least return for the most exposure."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0109
  domain: process
  topic: Hawthorne effect and success metrics
  question: "A team measured only by number of features shipped delivers a record volume of features, but customers start complaining about bugs. What should the product owner do, and what behavioral principle explains why measuring only feature count backfired?"
  answer: "Include customer-satisfaction and quality KPIs as product success metrics, alongside feature count. This is the Hawthorne effect (PMBOK 7th edition, page 112) — the act of measuring one thing (feature volume) shapes behavior toward that thing, at the expense of anything left unmeasured, like quality."
  explanation: "Adding a tech-debt item to the sprint backlog or discussing feedback at the demo treat symptoms; they don't fix the underlying measurement system that's rewarding volume over quality."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0110
  domain: people
  topic: self-organization and buy-in
  question: "A PM carefully sequenced and assigned all the work himself to hit the iteration goal, but the team is off track halfway through — and the PM is surprised. What should he have done differently?"
  answer: "Empowered the team to self-organize — letting them handle their own task selection and prioritization — instead of sequencing and assigning the work top-down."
  explanation: "Self-organization produces higher buy-in and motivation because it gives the team autonomy over how they accomplish their work (PMBOK 7th edition, page 249); training, better reporting, and contingency reserves don't address the root cause here, which is a lack of ownership."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0111
  domain: process
  topic: story point estimation
  question: "A team assigns a task 8 total story points by adding the developers' estimate (5) to the testers' estimate (3) separately. What's wrong with this approach?"
  answer: "Story points should be estimated for the story as a whole, not built up from separate per-role/per-segment sub-estimates."
  explanation: "Story points measure the total effort to deliver the whole feature; splitting the estimate by role undercuts the point of relative, whole-story estimation and makes velocity tracking inconsistent across stories."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0112
  domain: people
  topic: scaling scrum team size
  question: "A Scrum team has grown from 6 to 12 members, collaboration has gotten complicated, and standups keep running long. What should the scrum master do, and why not just tighten standup facilitation or extend its timebox?"
  answer: "Split the team into two Scrum teams and apply Scrum of Scrums to coordinate between them."
  explanation: "12 members exceeds the practical maximum (~9) for a single Scrum team; tightening or extending the standup timebox treats a symptom of the team being too large rather than the underlying structural problem."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0113
  domain: process
  topic: rejected feature at sprint review
  question: "At sprint review, the product owner rejects a feature the development team demonstrated. What happens to that user story next?"
  answer: "It gets updated to address the reasons it was rejected, and is then moved back to the product backlog for reprioritization."
  explanation: "Deleting it isn't rational — the feature was already built, implying it has value; auto-moving it straight into the next sprint backlog skips the PO's reprioritization step against everything else in the backlog."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0114
  domain: process
  topic: Definition of Ready
  question: "A team member insists a user story about a rewards policy shouldn't enter the next sprint because it doesn't specify how rewards vary by employee role or position. What's the most likely reason, and what checklist does it fail?"
  answer: "The story fails the Definition of Ready (DoR) — the checklist of criteria a story must meet before it's ready to be pulled into a sprint for execution (Agile Practice Guide, page 151)."
  explanation: "This isn't a Definition of Done issue (DoD applies at review, to a completed increment) — the story never even entered the sprint yet, so the gap is in its readiness for planning, not its completeness at delivery."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0115
  domain: process
  topic: user story quality criteria
  question: "What do the 3 C's of a user story stand for, and what does INVEST add on top of that?"
  answer: "The 3 C's are Card (the story is written down), Conversation (discussed to build shared understanding), and Confirmation (completion confirmed via acceptance criteria). INVEST is a separate quality checklist for the story itself: Independent, Negotiable, Valuable, Estimable, Small, Testable."
  explanation: "The 3 C's describe the process of creating and confirming a story; INVEST describes the qualities a well-formed story should have once written."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0116
  domain: process
  topic: backlog quality (DEEP)
  question: "What does the DEEP acronym check for when assessing whether a product backlog is healthy?"
  answer: "Detailed (appropriately — nearer-term items more so than distant ones), Emergent, Estimated, and Prioritized."
  explanation: "DEEP is a backlog-level quality checklist, distinct from INVEST, which checks an individual story's quality."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0117
  domain: people
  topic: Scrum values and pillars
  question: "Name Scrum's 3 pillars and its 5 values — and explain the difference between the two groupings."
  answer: "Pillars (the empirical process foundation): Transparency, Inspection, Adaptation. Values (team behavioral commitments): Commitment, Courage, Focus, Openness, Respect."
  explanation: "The pillars describe how Scrum's empirical process works; the values describe how the team is expected to behave within that process."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0118
  domain: people
  topic: T-shaped vs I-shaped team members
  question: "What's the difference between a T-shaped and an I-shaped team member, and which is generally more valuable to a cross-functional agile team?"
  answer: "T-shaped: deep expertise in one area plus workable skills in others, and more willingness to collaborate outside their specialty. I-shaped: deep expertise in only one domain, with no interest in work outside it. T-shaped members are generally more valuable to a cross-functional team."
  explanation: "Cross-functional teams depend on members being able to flex across work types when needed — I-shaped specialists create more single points of failure."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0119
  domain: people
  topic: servant leadership
  question: "How does servant leadership, as practiced by a Scrum Master, differ from a traditional command-and-control leadership style?"
  answer: "A servant leader's primary focus is serving and empowering team members — removing impediments and enabling the team's own decision-making — rather than directing and controlling their work."
  explanation: "This is why a Scrum Master resolves a blocking impediment on a team member's behalf (e.g. escalating a tool/license issue) instead of assigning them a workaround to execute."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0120
  domain: process
  topic: product vision, roadmap, and release plan
  question: "Rank product vision, product roadmap, and release plan from broadest/most strategic to narrowest/most detailed, and say who typically owns them."
  answer: "Product vision (broadest — the overall future-state 'why') → product roadmap (sequences milestones across the product's life) → release plan (narrowest — maps a specific near-term release's features and timing). The product owner owns all three."
  explanation: "Exam scenarios often test whether you can tell these apart when a team's confusion is at the vision level (project purpose) vs. the roadmap or release level (delivery sequencing)."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0121
  domain: process
  topic: scaled agile frameworks
  question: "Name three scaled agile frameworks (beyond plain Scrum of Scrums) and what each is best suited for."
  answer: "SAFe (Scaled Agile Framework) — structured, enterprise-level agile adoption across many teams. LeSS (Large Scale Scrum) — scaling Scrum to multiple teams working on one product. Disciplined Agile (DA/DAD) — lightweight, individuals-first guidance letting each team tailor its own process."
  explanation: "Scrum of Scrums itself is the lightest-weight scaling technique — just coordinating multiple Scrum teams — while SAFe, LeSS, and DA are more comprehensive frameworks for scaling agile across an organization."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0122
  domain: process
  topic: estimation techniques
  question: "What's the difference between relative estimation and absolute estimation, and which one does planning poker use?"
  answer: "Relative estimation sizes an item by comparing it to other similar items (e.g. story points); absolute estimation assigns a specific time/cost/effort unit without that comparison. Planning poker is a relative-estimation technique, typically using Fibonacci-sequence cards (0, 1, 2, 3, 5, 8, 13, 21…)."
  explanation: "The growing gaps between Fibonacci numbers deliberately reflect growing uncertainty as estimates get larger, discouraging false precision on big items."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0123
  domain: process
  topic: burndown vs burnup charts
  question: "What's the difference between a burndown chart and a burnup chart, and which direction is 'good' on each?"
  answer: "A burndown chart tracks remaining work with a downward-trending line — trending below the ideal line is good. A burnup chart tracks completed work with an upward-trending line — trending above the ideal line is good."
  explanation: "Because the two charts plot opposite quantities (remaining vs. completed), 'ahead of plan' looks like below-the-line on one and above-the-line on the other — a common source of exam confusion."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0124
  domain: process
  topic: cumulative flow diagram
  question: "On a Cumulative Flow Diagram (CFD), how do you visually spot a work-in-progress (WIP) problem, and what two time metrics can you also read off the same chart?"
  answer: "A widening 'In Progress' band (increasing vertical thickness at a point in time) signals rising WIP. Cycle time and lead time can both be read as horizontal distances on the chart: cycle time from 'In Progress' to 'Done', lead time from 'Backlog' all the way to 'Done'."
  explanation: "The CFD's three headline metrics are throughput, WIP, and cycle time — but lead time is also directly readable as the full horizontal span."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0125
  domain: process
  topic: lead time vs cycle time
  question: "Define lead time and cycle time, and say which one is always the larger (or equal) value."
  answer: "Lead time is the duration from a task's creation to its completion (Task Created → Work Completed). Cycle time is the duration from when work starts to when it's completed (Work Started → Work Completed). Lead time is always greater than or equal to cycle time, since cycle time is the portion of lead time after work actually begins."
  explanation: "A task can sit in a backlog for a long time (adding to lead time) before work on it ever starts (which is when the cycle time clock begins)."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0126
  domain: process
  topic: throughput chart
  question: "What does a throughput chart typically compare per sprint, and what does a persistent gap between the two bars tell you?"
  answer: "It typically compares story points committed vs. story points of work completed, per sprint (as a bar or scatter chart). A persistent gap where completed is well below committed signals the team is over-committing relative to its actual delivery capacity."
  explanation: "This is the agile-project analog of comparing planned vs. actual — but tracked per-sprint rather than cumulatively like EVM's PV/EV."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0127
  domain: process
  topic: escaped defects
  question: "What are escaped defects, and what does a rising escaped-defects trend over several months most likely indicate?"
  answer: "Escaped defects are defects the agile team missed — or didn't find — during development, which end-users then discover after the product releases. A rising trend most likely indicates a growing testing/quality gap upstream of release, not just increased support volume."
  explanation: "Because escaped defects are counted per unit of time (or per sprint/release), a sustained rise points to a systemic quality issue rather than one bad sprint."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0128
  domain: process
  topic: empirical measurement
  question: "What does 'empirical measurement' mean in an agile context, and how does it contrast with how traditional/predictive projects typically measure performance?"
  answer: "Empirical measurement means making decisions based on direct observation and experimentation — a realistic, current view of actual project progress. Traditional/predictive measurement instead focuses mainly on predictions and outputs (e.g. planned-value baselines)."
  explanation: "This is why agile KPIs (burn charts, CFDs, throughput, escaped defects) are all built from actually-observed work, rather than from a pre-set baseline like EVM's PV curve."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0129
  domain: process
  topic: procurement issue triage
  question: "A supplier tells the PM a steel-bar order may be delayed 3 days. What should the PM do first, and why not immediately renegotiate with the vendor or find a new one?"
  answer: "Evaluate the impact of the delay first — a delayed activity doesn't automatically delay the whole project."
  explanation: "If the activity isn't on the critical path, or has more lag than the delay itself, the project finish date may not move at all — jumping straight to negotiation or vendor replacement skips the impact analysis that should drive the decision."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0130
  domain: process
  topic: contract as source of truth for payment
  question: "A vendor calls a newly assigned PM claiming 50% completion and requesting payment. Which document should the PM check to verify how much (if anything) is owed, and why not the RFP or the vendor's bid response?"
  answer: "The contract — a mutually binding agreement obligating the seller to deliver and the buyer to pay a predetermined amount on an agreed schedule (PMBOK 7th edition, page 191)."
  explanation: "The RFP is just the buyer's original request; the seller's bid/proposal may have changed during negotiation before the contract was signed — only the signed contract reflects the final, binding payment terms."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0131
  domain: process
  topic: bidder conference scope
  question: "During a bidder conference, which two things does the PM actually do, and which two things does the PM NOT do there?"
  answer: "Does: clarify doubts, and explain the bid terms and conditions. Does NOT: shortlist prospective sellers, or award the contract."
  explanation: "A bidder conference (PMBOK 7th edition, page 70) exists purely to give all potential sellers a common, equal understanding of requirements before they bid — shortlisting and awarding happen later, as separate steps."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0132
  domain: process
  topic: high-value procurement approval
  question: "After scoring vendor proposals and selecting a winner for a complex, high-value, high-risk bridge-repair contract, what should the PM do next, before finalizing the award?"
  answer: "Seek senior/organizational management approval to finalize the contract award."
  explanation: "Complex, high-value, high-risk procurements generally require senior management sign-off before award (Process Groups: A Practice Guide (2022), page 238) — on top of, not instead of, the team's own scoring."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0133
  domain: process
  topic: contract type identification
  question: "A seller is awarded an 18-month building contract for one agreed total of $715,500. What contract type is this, and how would you tell it apart from a Time & Material contract?"
  answer: "Fixed-Price — one set total price for defined work, regardless of the seller's actual incurred costs. T&M instead quotes a rate (hourly, etc.) plus materials, without one fixed total."
  explanation: "The exam tell for Fixed-Price is a single agreed total tied to a defined scope; T&M's tell is a rate without a precise, complete statement of work."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0134
  domain: process
  topic: buyer vs seller procurement documents
  question: "Of these four procurement documents — proposals, source selection criteria, request for quotes, purchase order — which one is the PM (as buyer) NOT responsible for issuing, and who issues it instead?"
  answer: "Proposals — those are prepared by the seller, in response to the buyer's request for quotes."
  explanation: "Source selection criteria, the RFQ, and the purchase order are all buyer-side documents; the proposal is the seller's response to the RFQ, not something the buyer creates."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0135
  domain: process
  topic: contract and project closure sequencing
  question: "A PM has closed every contract on a project except one where the only remaining step is a quick expert inspection — and the equipment is already known to be working fine. Should the PM close the contract and project now to save time?"
  answer: "No — keep both the contract and the project open until the seller actually performs the inspection."
  explanation: "Closing a contract requires verifying the seller delivered exactly as specified in the contract, and closing a project requires all its contracts to be closed first — skipping the inspection isn't a valid shortcut even under time pressure."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0136
  domain: process
  topic: supplier conflict resolution sequencing
  question: "Escalating conflicts between the project team and a supplier's team are starting to hurt the project. What should the PM do first, and why is that better than an email or phone call?"
  answer: "Meet face-to-face with the supplier's team manager to discuss the issue — a face-to-face meeting is always the more effective first step for resolving conflict than email or phone."
  explanation: "If direct, in-person negotiation fails, the next step is Alternative Dispute Resolution (mediation, arbitration) — not jumping straight to ADR before trying direct discussion."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0137
  domain: process
  topic: implementing an approved change exactly as specified
  question: "A PM receives an approved change request to replace (not repair) a defective battery component near the end of a project. What should the PM do, and why not repair it instead to save time?"
  answer: "Replace the component, exactly as the approved change request specifies."
  explanation: "Once a change request is approved, the PM's job is faithful implementation as approved — substituting a different fix (repair instead of replace) isn't the PM's call to make unilaterally."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0138
  domain: process
  topic: sponsor-directed termination
  question: "A sponsor asks the PM to terminate a project midway through execution for a reason external to the contract (e.g. a nearby dam making the project's outcome unappealing). Should the PM push back, negotiate to continue, or proceed with claims administration?"
  answer: "None of those — the PM should simply follow the sponsor's instruction and start the close-project process."
  explanation: "There's no contract dispute in play here, so claims administration doesn't apply; when a sponsor decides to terminate for any reason, the PM's role is to execute that decision, not negotiate against it."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0139
  domain: process
  topic: Alternative Dispute Resolution (ADR)
  question: "What is Alternative Dispute Resolution (ADR), and which specific techniques does it cover?"
  answer: "ADR is the umbrella term for resolving disputes outside courtroom litigation — covering mediation, adjudication, expert determination, and arbitration."
  explanation: "ADR sits in the middle of the dispute resolution ladder: after negotiation has been tried and failed, but before resorting to litigation."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0140
  domain: process
  topic: cost-reimbursable contract subtypes
  question: "Name the three main Cost-Reimbursable contract subtypes and what distinguishes each one's fee structure."
  answer: "CPFF (Cost Plus Fixed Fee) — a flat fee regardless of performance. CPAF (Cost Plus Award Fee) — an extra fee based on satisfying the client's performance criteria. CPIF (Cost Plus Incentive Fee) — an extra fee based on meeting predefined performance targets."
  explanation: "All three reimburse the seller's legitimate costs; they differ only in how the profit fee on top of those costs is determined."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0141
  domain: process
  topic: Force Majeure
  question: "What is a Force Majeure (Acts of God) clause, and what kind of events does it cover?"
  answer: "It covers unforeseeable circumstances beyond either party's control — such as natural disasters or wars — that excuse contractual performance."
  explanation: "Force Majeure is distinct from a breach of contract, which requires a failure to perform without a legal excuse — an Act of God is exactly that legal excuse."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0142
  domain: process
  topic: Letter of Intent
  question: "What is a Letter of Intent, and how is it different from the signed contract itself?"
  answer: "A Letter of Intent confirms a contract award to a contractor while formal contract documents are still pending signature — it's a pre-cursor to the binding contract, not the contract itself."
  explanation: "Relying on a Letter of Intent instead of the final signed contract for terms like payment obligations would be a mistake, since it's issued before the formal terms are finalized."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0143
  domain: process
  topic: MOA vs MOU
  question: "What's the difference between a Memorandum of Agreement (MOA) and a Memorandum of Understanding (MOU)?"
  answer: "An MOA describes the background, assumptions, and agreements between two parties. An MOU describes an agreement for a cooperative effort between two parties — generally less formal/binding than an MOA or a full contract."
  explanation: "Both sit below a binding contract in formality, but an MOA is more detailed about the specific agreed terms than an MOU's broader statement of cooperative intent."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0144
  domain: process
  topic: Retainage
  question: "What is retainage (holdback) in a contract, and why would a buyer want it?"
  answer: "A portion of a contract payment held back until contract completion, to ensure the seller fully performs the contract terms."
  explanation: "It gives the buyer leverage: the seller has a financial incentive to finish and satisfy all requirements, since part of their payment is withheld until then."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0145
  domain: process
  topic: make-or-buy analysis timing
  question: "A PM has already received several supplier proposals for physical resources. Is it still appropriate to run a make-or-buy analysis at this point?"
  answer: "No — make-or-buy analysis should already have happened before proposals were solicited; at the proposal-comparison stage, the right tool is selection criteria."
  explanation: "Make-or-buy decides whether to build internally or purchase externally in the first place; once proposals are in hand, that decision has already been made and the task is now comparing sellers against selection criteria."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0146
  domain: process
  topic: RFP vs RFQ vs RFI
  question: "When would a PM issue an RFI instead of an RFQ or RFP?"
  answer: "An RFI is used when the PM needs more general information from sellers before deciding what to formally request — it comes before an RFQ (pricing on a well-defined item) or an RFP (a full proposed approach for less-defined, complex work)."
  explanation: "The three form a progression of specificity: RFI (learn) -> RFQ or RFP (formally solicit), chosen based on how well-defined the need already is."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0147
  domain: process
  topic: single source vs sole source
  question: "What's the difference between 'single source' and 'sole source' procurement?"
  answer: "Single source: the buyer chooses to use only one supplier even though other vendors are available. Sole source: only one provider in the market could actually fulfill the requirement at all."
  explanation: "Single source is a buyer's choice (e.g. for an existing relationship or standardization); sole source is a market fact the buyer has no alternative to."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0148
  domain: process
  topic: centralized vs decentralized procurement
  question: "What's the difference between centralized and decentralized procurement, and what's a tradeoff of each?"
  answer: "Centralized: one department manages purchasing for the whole organization (more consistency/control, less local flexibility). Decentralized: individual stakeholders/departments purchase for themselves (more flexibility/speed, less consistency)."
  explanation: "Neither is universally correct — the choice depends on the organization's need for standardization versus responsiveness."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0149
  domain: process
  topic: exit criteria (procurement)
  question: "In procurement screening, what are 'exit criteria,' and how are they different from a project's phase-exit or kill-point criteria?"
  answer: "Exit criteria are the conditions a seller's proposal must meet just to be considered at all — fail them, and the proposal is rejected outright before scoring even begins. This is a different concept from a project/phase's closure or kill-point review, which evaluates the project itself, not a vendor's proposal."
  explanation: "Mixing these two up is a common trap — procurement exit criteria are a pass/fail screening gate for sellers, not a project-governance milestone."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0150
  domain: process
  topic: tendering methods
  question: "What's the difference between open tendering, selective (restricted) tendering, and negotiated tendering?"
  answer: "Open tendering: a public announcement, anyone can bid. Selective tendering: only vendors personally invited by the buyer can bid. Negotiated tendering: the buyer approaches a single supplier directly, with no competitive bidding at all."
  explanation: "These three represent decreasing levels of competition, in that order — open has the most competitive pressure, negotiated has none."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0151
  domain: process
  topic: dispute resolution ladder order
  question: "List the six dispute resolution techniques in order from least to most formal/costly."
  answer: "Negotiation, Mediation, Adjudication, Expert determination, Arbitration, Litigation."
  explanation: "Parties should generally try each rung before escalating to the next — jumping straight to arbitration or litigation without attempting negotiation first is rarely the right exam answer."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0152
  domain: process
  topic: mediation vs arbitration
  question: "What's the key structural difference between mediation and arbitration?"
  answer: "In mediation, the neutral third party (mediator) only helps the parties reach their own agreement. In arbitration, the neutral third party (arbitrator) reviews both sides and imposes a binding decision."
  explanation: "Mediation preserves party control over the outcome; arbitration hands that control to a third party, which is why arbitration sits higher on the formality ladder."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0153
  domain: process
  topic: adjudication vs expert determination
  question: "How does adjudication differ from expert determination as a dispute resolution technique?"
  answer: "Adjudication uses an impartial third party who reviews evidence and arguments broadly to decide a dispute. Expert determination uses an independent expert chosen specifically for specialized subject-matter knowledge relevant to the dispute."
  explanation: "The distinguishing factor is the decision-maker's role: a general impartial adjudicator versus a subject-matter expert appointed for their specific expertise."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0154
  domain: process
  topic: litigation as last resort
  question: "Why is litigation described as the 'last resort' among dispute resolution techniques?"
  answer: "Because it's the most costly, slowest, and most adversarial option, and every less formal technique (negotiation, mediation, adjudication, expert determination, arbitration) should be attempted first."
  explanation: "This is also why many contracts include a dispute resolution clause specifically to keep disputes out of court where possible."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0155
  domain: process
  topic: risk-conflict-claim-dispute escalation
  question: "Trace how an unmanaged project risk can eventually turn into a full dispute, naming each intermediate stage."
  answer: "Risk (an uncertain event/condition) -> if not managed, becomes a Conflict (a disagreement between parties) -> if the conflict escalates and interests feel unaddressed, becomes a Claim (a formal request/demand) -> if the claim remains unresolved, becomes a Dispute requiring formal resolution."
  explanation: "Each stage is a missed opportunity for prevention — this is why claim prevention (managing risks early) is the first stage of the claims management process, not an afterthought."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0156
  domain: process
  topic: claims management process stages
  question: "Name the four stages of the claims management process and what each one involves."
  answer: "Claim Prevention (identifying risks and preventing them from escalating), Claim Mitigation (documentation, change-order processes, and a Dispute Resolution Board set up in advance), Pursuing Claims (claim identification/documentation and quantification of compensation or time sought), and Claim Resolution (resolving the claim and/or closing the contract)."
  explanation: "These stages overlap rather than run strictly sequentially — Claim Mitigation, for example, starts during Pre-award and continues well into Contract Execution."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0157
  domain: process
  topic: common causes of claims and disputes
  question: "Name three common factors that lead to claims and disputes on a project."
  answer: "Any three of: failure to understand or comply with a contractual obligation; errors or omissions in the contract document; an unrealistic contract duration or completion date."
  explanation: "Two of these three root causes trace back to problems baked into the contract itself at formation — which is why careful contract drafting is itself a claim-prevention technique."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0158
  domain: process
  topic: Dispute Resolution Board
  question: "What is a Dispute Resolution Board (DRB), and at which stage of claims management is it set up?"
  answer: "A standing panel established in advance to help resolve disputes as they arise, without resorting to arbitration or litigation — it's set up during the Claim Mitigation stage, not reactively after a dispute has already happened."
  explanation: "Setting up a DRB proactively (like a claims resolution guideline) is a claim-mitigation technique — a common exam trap is trying to set one up only after a dispute is already underway."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0159
  domain: process
  topic: liquidated damages clause
  question: "A contract needs a way to charge the contractor for delays without the buyer having to prove the actual dollar amount of harm caused. Which contract clause covers this, and how does it work?"
  answer: "The liquidated damages clause — a pre-defined amount payable for specific damages (like delays), substituting for having to prove actual damages in court."
  explanation: "This is different from a termination clause (which governs ending the contract) or an indemnity clause (which transfers risk for loss/damage more broadly)."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0160
  domain: process
  topic: time-barred clause
  question: "A contractor tries to file a claim for extra costs two years after the triggering event, but the contract sets a one-year deadline for claims. What clause governs this, and what's the outcome?"
  answer: "The time-barred clause — since the claim is filed past the contract's deadline for claims, it is not admissible."
  explanation: "A time-barred clause exists specifically to close off stale claims, protecting both parties from indefinite exposure to old issues."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0161
  domain: process
  topic: indemnity clause
  question: "What does an indemnity clause do, and how is it different from a liquidated damages clause?"
  answer: "An indemnity clause transfers risk — it secures one party against loss or damage and defines the events/process that trigger that protection. Liquidated damages instead pre-sets a specific dollar amount payable for a specific type of damage (like delay), without needing to prove actual loss."
  explanation: "Indemnity is about risk transfer/protection generally; liquidated damages is a narrower, pre-agreed payout mechanism for a specific breach type."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0162
  domain: process
  topic: change clause components
  question: "What three things does a contract's change clause typically define?"
  answer: "What can be changed, the change-order process to follow, and how a new price will be established once a change is made."
  explanation: "This is the contract-level counterpart to the project's integrated change control process — the change clause governs how changes get priced and processed under the contract itself."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0163
  domain: process
  topic: dispute resolution clause vs termination clause
  question: "A PM ending a difficult supplier relationship needs to check two different contract clauses. Which clause covers how to resolve outstanding claims without going to court, and which covers ending the relationship itself?"
  answer: "The dispute resolution clause covers the ADR process and when a dispute escalates to court; the termination clause defines when and how the contract itself can be ended."
  explanation: "A contract commonly includes both clauses together, since ending a relationship and resolving any outstanding disagreements often need to happen in tandem."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0164
  domain: process
  topic: Guaranteed Maximum Price and Unit Price contracts
  question: "How does a Guaranteed Maximum Price (GMP) contract differ from a Unit Price contract?"
  answer: "A GMP contract sets a ceiling on the total price for a construction project — the contractor absorbs any cost beyond that cap. A Unit Price contract instead quotes per-unit rates, with the final total price depending on how many units the work actually ends up needing."
  explanation: "Both are Fixed-Price-family contracts, but GMP fixes a ceiling on the total while Unit Price fixes the per-unit rate and lets the total float with quantity."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0165
  domain: process
  topic: accuracy vs precision
  question: "What's the difference between accuracy and precision as quality measurement terms, and can a measurement be one without the other?"
  answer: "Accuracy measures how close a measurement is to reality (correctness). Precision measures exactness — how tightly repeated measurements cluster together. Yes — a measurement can be precise (tightly clustered) but inaccurate (consistently off from the true value), or vice versa."
  explanation: "A common exam trap treats these as synonyms, but they measure different things: correctness vs. consistency."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0166
  domain: process
  topic: corrective vs preventive action
  question: "How does corrective action differ from preventive action?"
  answer: "Corrective action addresses the root cause of an issue that has already occurred, to prevent recurrence. Preventive action identifies and eliminates potential sources of problems before they occur at all."
  explanation: "The distinction is timing relative to the problem: corrective is reactive (after), preventive is proactive (before)."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0167
  domain: process
  topic: cost of conformance vs non-conformance
  question: "A project spends money on both employee training and post-release warranty claims. Which cost-of-quality bucket does each fall into?"
  answer: "Training is a Prevention cost, under Cost of Conformance (money spent during the project to avoid failures). Warranty claims are an External Failure cost, under Cost of Non-Conformance (money spent because failures already happened)."
  explanation: "Conformance costs are proactive/preventive; non-conformance costs are reactive, paid because quality expectations weren't met."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0168
  domain: process
  topic: de facto vs de jure regulations
  question: "What's the difference between de facto and de jure regulations, and which type, if updated mid-project, should trigger an update to the Quality Management Plan?"
  answer: "De facto regulations are widely accepted (market/industry-driven) but not officially sanctioned. De jure regulations are formally recognized and established by law or legal authority. Either type being updated mid-project (e.g. new building codes) should trigger updating the Quality Management Plan's standards and specifications."
  explanation: "The exam scenario usually names a legal/government body issuing the update, which signals de jure — but the QMP update logic applies to a newly-mandated standard either way."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0169
  domain: process
  topic: JIT vs Lean vs Kanban vs Kaizen
  question: "A PM wants to reduce wasted/expired office inventory by only acquiring supplies when needed. Which specific technique is this, and how does it differ from Lean, Kanban, and Kaizen?"
  answer: "Just In Time (JIT) — only using/acquiring resources when needed. Lean management is the broader philosophy (not a technique) of maximizing value while minimizing waste; Kanban is a lean method for managing and visualizing work; Kaizen is a philosophy of continuous, incremental improvement — a different concept from inventory timing."
  explanation: "JIT is the specific inventory technique; the other three are broader philosophies or different-purpose methods, even though all four relate to waste reduction."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0170
  domain: process
  topic: Pareto chart
  question: "When building a Pareto chart to prioritize defects, what specific value do you need to determine for each issue?"
  answer: "Each issue's frequency — a Pareto chart is a histogram ranking issues from highest to lowest frequency, based on the 80/20 rule (80% of problems come from 20% of causes)."
  explanation: "Not impact, urgency, or root cause — frequency is specifically what a Pareto analysis ranks."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0171
  domain: process
  topic: PDCA cycle
  question: "What does the Plan-Do-Check-Act (PDCA) cycle, aka the Deming Cycle, describe?"
  answer: "An iterative management method used to facilitate the continuous improvement of processes or products."
  explanation: "PDCA is a generic improvement loop, distinct from Kaizen (a philosophy) and Six Sigma (a data-driven defect-reduction philosophy) — though all three share a continuous-improvement spirit."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0172
  domain: process
  topic: quality audit vs quality inspection
  question: "What's the difference between a quality audit and a quality inspection, in terms of what each one examines?"
  answer: "A quality audit verifies adherence to quality standards and processes (usually done by an external auditor) — it examines the process. A quality inspection verifies whether deliverables conform to quality requirements — it examines the product."
  explanation: "Audits check compliance with procedures; inspections check the actual output."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0173
  domain: process
  topic: ISO 9000 series
  question: "What does the ISO 9000 series of standards define?"
  answer: "An effective Quality Assurance system for manufacturing and service industries."
  explanation: "ISO 9000 is a standard, not a regulation — voluntary best practice unless a contract or regulation specifically requires certification against it."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0174
  domain: process
  topic: Six Sigma vs TQM
  question: "How does Six Sigma differ from Total Quality Management (TQM) as a quality philosophy?"
  answer: "Six Sigma is a data-driven philosophy specifically aimed at reducing the probability of errors/defects occurring. TQM is a broader management philosophy focused on continuous improvement through the involvement of all employees in quality goals."
  explanation: "Six Sigma is narrower and statistically-driven; TQM is organization-wide and culture-driven."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0175
  domain: process
  topic: data vs information vs knowledge
  question: "Classify these three items: (1) 'Task X is not yet complete,' (2) 'Task X's delay is jeopardizing the release,' (3) a lesson recorded for future projects about why similar delays happen. Which is data, which is information, and which is knowledge?"
  answer: "(1) Data — a raw fact. (2) Information — processed data giving meaning/context. (3) Knowledge — information and experience applied to improve future outcomes."
  explanation: "This three-level hierarchy (data -> information -> knowledge) is a common classification exercise on the exam."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0176
  domain: process
  topic: explicit vs tacit knowledge
  question: "What's the difference between explicit and tacit knowledge, and why do lessons learned meetings specifically matter for one of them?"
  answer: "Explicit (codified) knowledge can be captured directly using words, pictures, or numbers. Tacit knowledge — beliefs, experience, insights — is difficult to articulate and share. Lessons learned meetings exist mainly to surface tacit knowledge before it's lost, since it doesn't get written down on its own."
  explanation: "Documentation captures explicit knowledge automatically; tacit knowledge needs a deliberate conversation to extract."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0177
  domain: process
  topic: lessons learned meeting vs register
  question: "What's the difference between a lessons learned meeting and a lessons learned register?"
  answer: "The meeting is the event used to identify and share knowledge gained during a project, phase, or iteration. The register is the document that actually records that knowledge for future reuse."
  explanation: "One is the process/event, the other is the artifact it produces."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0178
  domain: process
  topic: OPA for past project performance
  question: "A team recalls a similar past project that went over budget and behind schedule. Where should the PM look to find that past project's actual performance details, and why not EEF or the current issue log?"
  answer: "Organizational Process Assets (OPA) — OPAs bundle the organization's processes/procedures with its corporate knowledge base, including past projects' scope/schedule/cost/quality baselines, stakeholder registers, and issue logs."
  explanation: "EEF covers external conditions surrounding the company, not internal historical records; the current project's own issue log wouldn't contain a different, past project's data."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0179
  domain: process
  topic: information radiator
  question: "What is an information radiator (aka visual control or Big Visible Chart), and what problem does it solve?"
  answer: "A visible, physical display that provides instant information about the project without needing to ask or disturb the team."
  explanation: "A posted Kanban board is one common example, but the concept is broader than any single tool — any big, visible, always-current chart counts."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0180
  domain: process
  topic: access control vs information security
  question: "What's the difference between access control (authorization) and information security?"
  answer: "Access control specifically regulates who can access and interact with documents, for security and confidentiality. Information security is the broader process of identifying, assessing, and managing information security risks generally."
  explanation: "Access control is one specific technique/tool used within the broader information security process."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0181
  domain: process
  topic: version control
  question: "What does version control actually do, beyond just naming files v1, v2, v3?"
  answer: "It applies numerical identifiers to track changes to files or deliverables, letting team members manage and collaborate on different versions effectively without overwriting each other's work."
  explanation: "The value is in enabling parallel collaboration and change tracking, not just labeling."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0182
  domain: process
  topic: naming convention
  question: "Why does a naming convention matter for document/information management, even though it seems like a trivial detail?"
  answer: "It's a set of rules and guidelines for creating significant and consistent names for files or variables — without it, information retrieval and document management both become harder as a project scales."
  explanation: "This is a low-tech but frequently-tested piece of document-management hygiene."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0183
  domain: process
  topic: project librarian vs L&D manager
  question: "What's the difference between a Project Librarian (Project Data Administrator) and a Learning and Development (L&D) Manager?"
  answer: "A Project Librarian manages information and documents within a project. An L&D Manager designs and implements programs to enhance employees' knowledge, skills, and capabilities across the organization."
  explanation: "One is project-level and document-focused; the other is organization-level and people-development-focused."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0184
  domain: process
  topic: status report vs quality report vs project management plan
  question: "A sponsor asks broadly for an overview of work performance and where a high-risk, defect-prone project currently stands. Which document should the PM send, and why not a quality report or the project management plan?"
  answer: "A status report — a work performance report covering the project's progress and status (can include EV data, trend lines/forecasts, reserve burndown, and defect/risk summaries)."
  explanation: "The sponsor asked broadly for performance/standing, not a quality-specific deep-dive; the project management plan is a planning document, not a reporting one."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0185
  domain: process
  topic: inspect before pay or close
  question: "A supplier delivers materials on the agreed date under a firm-fixed contract. What should the PM do before paying the supplier or closing the contract?"
  answer: "Inspect the materials to ensure compliance with the requirements stipulated in the contract."
  explanation: "Inspection always comes before payment/closure and before using the materials — passing inspection is the trigger for payment and contract closure, not delivery alone."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0186
  domain: process
  topic: Validate Scope vs internal testing
  question: "A team internally tests a machine exhaustively, but the client calls asking whether it meets requirements. Is internal test confirmation enough to close the project?"
  answer: "No — the PM must collaborate with the client to get their formal approval that the product complies with requirements. This is the Validate Scope process: the customer, not the team, gives formal sign-off."
  explanation: "Internal verification alone can't substitute for the customer's own validation, even after exhaustive internal testing."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0187
  domain: process
  topic: technical debt to product backlog
  question: "An agile team member discovers code that violates coding standards while working on a new feature. What's the correct next step, and why not fix it immediately or ignore it?"
  answer: "Raise it with the Product Owner to add a new item to the product backlog for the technical debt, to be prioritized like any other work."
  explanation: "Ignoring it is low ownership (not 'gold plating'); fixing it unplanned mid-sprint by adding it straight to the sprint backlog compromises the current iteration's committed work."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0188
  domain: process
  topic: updating the Quality Management Plan for new regulations
  question: "A PM receives updated building codes and regulations from local authorities at project start. What should the PM update to ensure regulatory compliance?"
  answer: "The Quality Management Plan — to include the updated quality standards and specifications mandated by the revised codes."
  explanation: "This ensures deliverables align with the new requirements, rather than just adjusting the schedule, procurement plan, or communications plan around the change."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0189
  domain: process
  topic: acceptance sampling for destructive testing
  question: "A PM needs 1000 identical filters, but a tested filter can't be reused once tested. How should the PM handle inspection given this constraint?"
  answer: "Order more than 1000 filters, then perform acceptance sampling on the batch surplus."
  explanation: "When 100% inspection is impossible (here, because testing destroys the item), sampling a portion of the batch/lot is the standard workaround — ordering extra makes that sampling possible without shorting the actual requirement."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0190
  domain: process
  topic: root-cause facilitation for a stalled deliverable
  question: "A team member misses a deadline for a status report, explaining it feels pointless — inaccurate, too long, and unlikely to be read. What should the PM do?"
  answer: "Review the report's requirements with the team member to redefine its purpose, addressing the root cause of the frustration."
  explanation: "This beats forcing submission as-is, reassigning it, or escalating to a functional manager — none of which fix the underlying problem that the report itself may be poorly designed."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0191
  domain: process
  topic: inspection vs audit vs handover vs scope validation
  question: "Before announcing project execution complete, a construction PM reviews deliverables and does a site walkthrough. Which of these is this: inspection, audit, handover, or scope validation?"
  answer: "An inspection — reviewing deliverables and performing a site walkthrough if applicable."
  explanation: "Audits check process compliance (not product condition); this scenario involves neither a formal customer sign-off (scope validation) nor a handover of deliverables to the client."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0192
  domain: process
  topic: appraisal cost calculation
  question: "A cost-of-quality report lists: Training $10,000, Rework $10,000, Inspection $5,000, Scrap $3,000, Warranty charges $2,000. What is the appraisal cost, and how do you know?"
  answer: "$5,000 — the Inspection line. Appraisal costs are the testing/inspecting/auditing/evaluating costs under Cost of Conformance."
  explanation: "Training is a Prevention cost; Rework and Scrap are Internal Failure costs; Warranty charges is an External Failure cost — only Inspection maps to Appraisal."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0193
  domain: process
  topic: quality audit scope
  question: "An external auditor is about to conduct a quality audit on a project. What should the PM expect the audit to examine — budget/schedule status, scope-baseline conformance, product defects, or process compliance?"
  answer: "Process compliance — whether the project follows organizational and project policies, processes, and procedures."
  explanation: "Budget/schedule status is a performance review; product defects are Control Quality's job; scope-baseline nonconformance is Scope Control's job — none of those are what a quality audit checks."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0194
  domain: process
  topic: historical information for an innovative project
  question: "A PM is skeptical about a new, innovative project's business model, but has worked with similar organizations before. Should they still use historical information for resource planning?"
  answer: "Yes — historical information can still provide insight when comparing to resources used on previous similar projects, even if it won't produce a perfectly accurate estimate on its own."
  explanation: "Historical information supports analogous/parametric estimating, which is faster/cheaper than bottom-up but less accurate — useful insight, not the only valid input."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0195
  domain: process
  topic: Definition of Done and Quality Control together
  question: "A prospect requires 10 firewalls delivered incrementally, with final acceptance granted only after a penetration test confirms all simulated attacks are detected and prevented. What two things is this scenario defining?"
  answer: "Definition of Done (the checklist of criteria for the product to be considered ready for delivery) and Quality Control (the defect-identification process — here, via penetration testing)."
  explanation: "Quality Assurance would instead focus on defect prevention, and technical requirements would cover product specs like WiFi support or storage — neither fits this acceptance-condition scenario."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0196
  domain: process
  topic: defect breakdown visualization
  question: "A PM has defect data broken into five categories by percentage (UI issues, UX issues, bugs, missing features, other). What visualization tool fits this data?"
  answer: "A histogram — a vertical bar chart showing how often each category occurs, letting each bar represent one category's share of the total."
  explanation: "A scatter diagram would instead show correlation between two continuous variables, and a flowchart shows process steps — neither fits categorical frequency data like this."
  source: sources/guides/2026-09-16-quality-information-management-questions.md
