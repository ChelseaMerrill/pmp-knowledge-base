# Quiz question bank. Claude appends to this when processing sources — see CLAUDE.md for the schema
# and workflow. Seeded with a handful of examples so the format is clear from the start.

- id: q-0001
  domain: formula
  topic: earned value management
  question: "A project has PV = $50,000, EV = $45,000, and AC = $52,000. Is the project ahead or behind schedule, and over or under budget?"
  answer: "Behind schedule and over budget."
  explanation: "SV = EV - PV = 45,000 - 50,000 = -5,000 (behind schedule). CV = EV - AC = 45,000 - 52,000 = -7,000 (over budget). Negative SV/CV is unfavorable."
  source: seed

- id: q-0002
  domain: agile
  topic: scrum roles
  question: "Who is accountable for maximizing the value of the product resulting from the work of the Scrum Team?"
  answer: "The Product Owner."
  explanation: "The Scrum Master coaches the team and removes impediments; the Product Owner owns the backlog and value."
  source: seed

- id: q-0003
  domain: people
  topic: conflict resolution
  question: "A team member insists on their preferred technical approach even after being shown data favoring an alternative. Which conflict-resolution technique are they using, and what is generally the strongest long-term approach instead?"
  answer: "They are using force/direct. Collaborate/problem-solve is generally the strongest long-term technique."
  explanation: "Force/direct pushes one view through regardless of input; collaborate/problem-solve looks for a solution that actually addresses the underlying concern, so it holds up better over time."
  source: seed

- id: q-0004
  domain: business-environment
  topic: risk response
  question: "A risk owner decides to purchase insurance to cover the financial impact of a risk if it occurs. Which risk response strategy is this?"
  answer: "Transfer."
  explanation: "Transfer shifts the impact of a threat to a third party (like an insurer) without eliminating it, distinct from mitigate (reduce probability/impact) or avoid (eliminate the risk entirely)."
  source: seed

- id: q-0005
  domain: process
  topic: critical path method
  question: "On a network diagram, an activity has a total float of 3 days and a free float of 0 days. What does that tell you?"
  answer: "The activity can slip up to 3 days without delaying the project end date, but any slip at all will delay the very next activity."
  explanation: "Total float measures slack against the project finish date; free float measures slack against the next activity's early start. Zero free float with nonzero total float is common when several paths share downstream activities."
  source: seed

- id: q-0006
  domain: people
  topic: stakeholder identification
  question: "During a construction project, several neighboring homeowners complain about noise and site traffic, even though they have no contractual relationship to the project. Are they stakeholders?"
  answer: "Yes."
  explanation: "A stakeholder is anyone with an interest in the project or affected by its outcomes — that includes parties impacted by the project who aren't part of the team, sponsor chain, or contract, such as neighbors."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0007
  domain: people
  topic: stakeholder identification
  question: "Name three stakeholder categories besides the project team and project manager that a project manager should consider when identifying stakeholders on a construction project."
  answer: "Any three of: sponsor, users/end-users, suppliers, government, financial institutions, others (e.g. neighbors, family members)."
  explanation: "Stakeholder identification should go well beyond the immediate team — sponsors, end-users, suppliers, regulators/government, financial institutions, and other impacted parties are all legitimate categories."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0008
  domain: people
  topic: stakeholder engagement
  question: "What is the difference between 'align stakeholder expectations' and 'manage stakeholder expectations' as ECO tasks?"
  answer: "Aligning happens up front, setting realistic shared expectations before/as the project starts; managing is ongoing throughout the project as circumstances change."
  explanation: "These are two separate ECO tasks in the People domain — one is a point-in-time activity early in the project, the other is continuous communication and negotiation as the project runs."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0009
  domain: people
  topic: stakeholder analysis
  question: "A project manager wants to decide how much engagement effort to spend on each stakeholder. What tool classifies stakeholders by authority and level of concern to help make that call?"
  answer: "The power/interest grid."
  explanation: "The power/interest grid plots stakeholders on power (authority) vs. interest (concern), guiding engagement strategy (e.g. manage closely vs. monitor)."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0010
  domain: people
  topic: stakeholder identification
  question: "A bank financing a construction project and the local zoning authority reviewing permits — are these considered project stakeholders even though neither is the customer or the project team?"
  answer: "Yes — financial institutions and government/regulatory bodies are both recognized stakeholder categories."
  explanation: "Stakeholders extend beyond the team and sponsor to anyone with an interest in or affected by the project, including financial institutions (banks, VCs, business angels) and government (local authorities, regulators)."
  source: sources/guides/2026-09-10-project-stakeholders.md

- id: q-0011
  domain: people
  topic: stakeholder management plan
  question: "What is the purpose of a Stakeholder Management Plan, as distinct from the stakeholder register?"
  answer: "It's the formal framework/document that guides how stakeholders will be identified, analyzed, prioritized, engaged, and monitored throughout the project — the register is one input/output used to execute that plan, not the plan itself."
  explanation: "The Stakeholder Management Plan is the governing document; the stakeholder register captures the actual list and classification data that the plan's processes act on."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0012
  domain: people
  topic: communication planning
  question: "What is the difference between a communication strategy and a Communication Management Plan?"
  answer: "The communication strategy is the high-level, structured blueprint for the overall approach to engaging stakeholders; the Communication Management Plan is the detailed, tactical document specifying the actual methods, timelines, and tools."
  explanation: "Strategy sets direction and principles; the Communication Management Plan is the operational document a PM works from day to day."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0013
  domain: people
  topic: communication planning
  question: "The Communication Management Plan is organized around three core questions. What are they, and what does each cover?"
  answer: "Who (the target audience and their expectations/interests), What (the message types and formats), and How (delivery method/tools, formality level, and frequency)."
  explanation: "Who/What/How is the structuring framework the exam associates with building out a Communication Management Plan."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0014
  domain: formula
  topic: communication channels
  question: "A project team grows from 6 people to 10 people. How many additional communication channels does that add?"
  answer: "30 additional channels."
  explanation: "Channels = n(n-1)/2. At n=6: 6×5/2=15. At n=10: 10×9/2=45. Increase = 45−15 = 30."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0015
  domain: people
  topic: knowledge transfer
  question: "A senior engineer who is rolling off the project has years of hard-to-document troubleshooting intuition. What kind of knowledge is this, and what's the typical way to transfer it (vs. just writing a document)?"
  answer: "Tacit knowledge — typically transferred through mentoring, pairing, or direct conversation rather than documentation."
  explanation: "Explicit knowledge is easily codified in documents; tacit knowledge is experience-based and resists documentation, so it needs person-to-person transfer methods."
  source: sources/guides/2026-09-10-stakeholder-and-communication-management-plan.md

- id: q-0016
  domain: business-environment
  topic: exam content outline
  question: "What is the difference between the ECO (Examination Content Outline) and the PMBOK Guide?"
  answer: "The ECO defines the critical job tasks a practicing PM performs, validated by the Job Task Analysis, and is what the exam actually tests. The PMBOK Guide is a knowledge reference of principles and processes — the exam tests applied judgment on realistic scenarios, not memorization of the Guide."
  explanation: "This distinction matters because study effort should center on being able to apply judgment to scenario-based tasks, not on memorizing the Guide's contents."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0017
  domain: process
  topic: development approach
  question: "Roughly what share of exam items reflect predictive approaches versus adaptive/agile and hybrid approaches combined?"
  answer: "About 40% predictive, and about 60% split between adaptive/agile and hybrid."
  explanation: "This roughly 40/60 split is why heavy agile/hybrid preparation matters even though 'Process' (the largest domain) has historically skewed predictive in older materials — approach isn't confined to one domain."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0018
  domain: business-environment
  topic: eligibility experience
  question: "A candidate leads Project I from Jan 1–Mar 31 and Project II from Feb 1–May 31 (overlapping). How many months of PM experience do these two projects count as, toward PMP eligibility?"
  answer: "5 months (Jan 1–May 31), not 7."
  explanation: "PMI counts eligibility experience by calendar tenure, not by summing each project's duration — overlapping time leading multiple projects isn't double-counted."
  source: sources/guides/2026-09-08-pmp-exam-content-outline.md

- id: q-0019
  domain: business-environment
  topic: organizational structures
  question: "In a balanced matrix organization, who holds the primary managerial authority — the project manager or the functional manager?"
  answer: "The functional manager, though the PM has more authority than in a weak matrix."
  explanation: "Balanced matrix is a middle ground: the PM gains real influence, but the functional manager remains the primary authority until you reach a strong matrix or projectized structure."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0020
  domain: formula
  topic: financial selection
  question: "A project has a Benefit-Cost Ratio (BCR) of 0.8. Should the organization proceed, based on this number alone?"
  answer: "No — a BCR below 1.0 means costs outweigh benefits."
  explanation: "BCR = benefits ÷ costs. Above 1.0 is favorable (benefits exceed costs); below 1.0 means the project's costs outweigh its projected benefits."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0021
  domain: process
  topic: prioritization techniques
  question: "A product team wants to prioritize a long backlog into four tiers reflecting negotiable necessity. Which technique are they using: MoSCoW or the Kano model?"
  answer: "MoSCoW."
  explanation: "MoSCoW sorts items into Must Have / Should Have / Could Have / Won't Have. The Kano model instead weighs implementation cost against customer-satisfaction potential — a different axis, not a four-tier necessity sort."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0022
  domain: process
  topic: deliverable quality
  question: "A delivered product meets its original intended purpose and the client's expectations, but the client mentions they'd still like some UX polish later. Is this product 'fit for purpose,' 'fit for use,' both, or neither?"
  answer: "Both — fit for purpose and fit for use aren't mutually exclusive, and a fit-for-use product can still be improved further."
  explanation: "Fit for purpose means it satisfies its intended purpose and client expectations; fit for use means it's usable and meets goals in its current state. A product can be both and still have room for future improvement."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0023
  domain: formula
  topic: financial selection
  question: "A project manager is deciding whether to continue a troubled project. A team member argues to continue because '$200,000 has already been invested — we can't just abandon that.' What concept does this argument mischaracterize?"
  answer: "Sunk cost — money already spent is unrecoverable and irrelevant to the decision about what to do next."
  explanation: "The PM should evaluate the remaining costs and benefits of continuing vs. stopping, not the amount already spent. Letting sunk cost drive the decision is a classic bias the exam tests for."
  source: sources/guides/2026-09-08-pm-fundamentals-keywords.md

- id: q-0024
  domain: process
  topic: business value
  question: "A project finishes on time and under budget, but a stakeholder asks how the PM can be sure the customer will actually be satisfied. What actually ensures customer satisfaction?"
  answer: "Delivering value and conforming to project requirements."
  explanation: "On-time/under-budget delivery isn't sufficient by itself. Customer satisfaction depends on whether the deliverable conforms to requirements and is usable — that's what's actually measured."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0025
  domain: process
  topic: development approach
  question: "A complex AI platform project has cutting-edge tech, diverse stakeholder interests, and heavy regulatory compliance needs. What development approach fits best?"
  answer: "A hybrid approach."
  explanation: "Hybrid allows the structured planning/documentation regulatory compliance needs, while still enabling iterative development to handle evolving requirements and stakeholder needs — pure waterfall or pure agile each miss half of what's needed here."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0026
  domain: process
  topic: integration
  question: "What documents does a project manager need to develop the project charter? (Select the set.)"
  answer: "The business case, agreements, and the strategic/benefits plan."
  explanation: "These are the business documents feeding charter development. The project management plan is NOT one of them — it's developed after the charter is signed, not before."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0027
  domain: business-environment
  topic: organizational change
  question: "A company-wide Agile transformation faces resistance from stakeholders used to traditional PM, plus heavy regulatory compliance needs. What should the PM prioritize? (Select two.)"
  answer: "Establish a cross-functional Agile transformation team for alignment/inclusivity, and develop a tailored Agile training program for varying skill levels."
  explanation: "Dismissing resistance outright is wrong — the fix is inclusive structure (cross-functional team) plus meeting people where they are (tailored training), not ignoring concerns or skipping suitability groundwork."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0028
  domain: process
  topic: development approach
  question: "Some stakeholders don't support a digital marketing project; others want full up-front planning. The sponsor wants a quick win to build support. What approach should the PM take, and why?"
  answer: "An agile approach, because it produces functioning deliverables quickly."
  explanation: "The distinguishing reason matters on the exam: it's not 'agile would please the majority' (option A) — it's that agile's early, working deliverables are what create the quick win the sponsor actually needs."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0029
  domain: process
  topic: project life cycle
  question: "A team of five is building a mobile app. What project life cycle fits, and how is that different from a process group list or Tuckman's stages?"
  answer: "Wireframing, prototyping, designing, developing, testing, deploying — this is the project life cycle (the deliverable-specific phases), not process groups (initiating, planning, executing, M&C, closing) or team development stages (forming, storming, norming, performing, adjourning)."
  explanation: "The exam likes to mix these three phase-like lists together as distractors — know which kind of 'phases' a question is actually asking about."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0030
  domain: process
  topic: tailoring
  question: "Under PMBOK 7, what specifically does 'tailoring' mean?"
  answer: "The selection of the appropriate processes, inputs, tools, techniques, and life cycle phases for managing a project."
  explanation: "Distinguish this from 'project management' itself (applying knowledge/skills/tools/techniques to meet project requirements) and 'program management' (the same, but for a program) — tailoring is specifically about selecting the right subset for the specific project."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0031
  domain: business-environment
  topic: project selection
  question: "A PM presents to a committee of senior managers and SMEs who ask tough, critical questions aimed at finding reasons the project should NOT proceed. What's this technique called?"
  answer: "A murder board."
  explanation: "The murder board's job is to aggressively look for reasons to reject the proposal; the proposer's job is to answer every query and prove the project's worth."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0032
  domain: process
  topic: integration
  question: "A new project manager keeps hearing that work can't start until 'an official document is issued.' What document is this, and what does it do?"
  answer: "The project charter — it authorizes the project manager to launch project execution."
  explanation: "The charter also gives a brief description of the project and its requirements; the scope statement and project management plan both contain a more detailed version of the same, developed after the charter."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0033
  domain: process
  topic: project closure
  question: "At sprint review, the product owner is satisfied with the increment; a team member wants another iteration to fix bugs; the sponsor says funding for further work depends on next quarter's budget. What should the PM do?"
  answer: "Release all resources and close the project."
  explanation: "The client/sponsor is effectively requesting closure, even knowing about remaining bugs — continuing work to satisfy the client at this point is gold plating, and a project can't stay open pending uncertain future funding. If funding arrives, a new project addresses the remaining work."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0034
  domain: process
  topic: value delivery
  question: "A sponsor doubts the product will meet business demand and wants to minimize cost. What should the PM do?"
  answer: "Identify and implement the requirements for a Minimum Viable Product (MVP)."
  explanation: "MVP defines the smallest release that validates value against real demand — cheaper than a full incremental buildout, and it doesn't require excluding stakeholders or relying on a fixed-cost contract, neither of which addresses the actual concern (unproven demand)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0035
  domain: process
  topic: agile change management
  question: "During execution of an agile software project, the customer requests a requirement change. What should the PM do, and why is a CCB not the answer here?"
  answer: "Welcome the change request. Agile encourages responding to change; unlike predictive projects, agile doesn't route changes through a Change Control Board."
  explanation: "Flexibility is core to agile — regular stakeholder feedback is expected to reshape scope, which is the opposite of blocking or routing it through a formal board."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0036
  domain: process
  topic: business value
  question: "A make-or-buy analysis favored in-house development based on a developer rate that turns out to be half the current market rate. What should the PM do first?"
  answer: "Inform the sponsor about the findings."
  explanation: "This affects the project's business value/financial assumptions — the sponsor needs to know before anything else happens (submitting a change request, updating the analysis, or assuming SPI/CPI being on track covers it are all premature or insufficient)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0037
  domain: process
  topic: integration
  question: "A newly assigned PM is replacing one who recently left the project. What should they consult first?"
  answer: "The project charter — to understand the project's goals and business case."
  explanation: "Understanding why the project exists and what it's meant to achieve comes before diving into baselines (the PM plan), open issues (issues/lessons-learned logs), or stakeholder outreach (the register) — those all follow from understanding the charter first."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0038
  domain: process
  topic: development approach
  question: "An adaptive-approach project has a fixed budget, 3–5 previewed releases, and progressively detailed scope. What should the PM do as the project proceeds?"
  answer: "Work with stakeholders to prioritize work for each release until the budget runs out."
  explanation: "In adaptive approaches, cost and schedule are typically fixed while scope flexes — so the team prioritizes the highest-value work per release rather than pre-committing to a fixed scope or switching to predictive."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0039
  domain: business-environment
  topic: professional responsibility
  question: "A PM reviewing a predictive project discovers deliverables marked 'finished' are actually still in progress, and the project is really over budget and behind schedule (contrary to what the sponsor believes). What should the PM do next?"
  answer: "Notify the sponsor of the findings."
  explanation: "Per PMI's Code of Ethics and Professional Conduct, a PM who discovers errors or omissions caused by others must communicate them to the appropriate party promptly and accurately — not quietly try to fix it, decline the assignment, or jump straight to schedule compression."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0040
  domain: business-environment
  topic: compliance
  question: "While developing the project charter, a PM discovers missing regulatory requirements in the business case — compliance risks scope/budget overrun, non-compliance risks legal exposure. What should the PM do, and why can't they issue a change request yet?"
  answer: "Inform the project sponsor of the findings. A change request isn't possible yet because the project isn't authorized or baselined — it's still in charter development."
  explanation: "PMI's Code of Ethics requires compliance with laws/regulations and prohibits concealing such findings. Change requests operate against a baseline, which doesn't exist yet at this stage."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0041
  domain: people
  topic: agile roles
  question: "A PM worried about job security under an Agile transition believes Agile teams only have team members, a Scrum Master, and a Product Owner — no PM. Is that concern justified?"
  answer: "No — the PM can continue, typically as more of a facilitator (team facilitator/Scrum Master/coach are overlapping titles for that role)."
  explanation: "Agile's three common roles are cross-functional team members, the product owner, and a team facilitator — which can be titled Scrum Master, project team lead, project manager, or team coach. The role leans on servant leadership: removing impediments, facilitating, coaching."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0042
  domain: process
  topic: project vs operations
  question: "How do operations differ from projects, precisely?"
  answer: "Operations are ongoing endeavors that generate repetitive outputs — the continuous execution of activities per an organization's procedures to produce the same result or a recurring service. There's no such thing as an 'ongoing project.'"
  explanation: "A project is temporary with a unique result; an operation is permanent/ongoing with a repetitive result. Production, manufacturing, and accounting are examples of operations, not projects."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0043
  domain: business-environment
  topic: organizational structures
  question: "In a weak matrix organization, who's in charge of hiring when additional team members are needed?"
  answer: "The functional manager."
  explanation: "In a weak matrix, authority leans functional — the functional manager controls staffing decisions, not the PM."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0044
  domain: business-environment
  topic: organizational structures
  question: "In which organizational structure does the project manager have the most control?"
  answer: "Projectized."
  explanation: "Projectized gives the PM full authority over the project — more than strong matrix, balanced matrix, or weak matrix, in that order."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0045
  domain: process
  topic: project success
  question: "A senior engineer is newly assigned to manage an Agile project. What should they do first to set the project up for success?"
  answer: "Define the project success criteria."
  explanation: "Before identifying risks, planning sprint activities, or defining quality metrics, the project needs an agreed definition of what success actually looks like — everything else should trace back to that."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0046
  domain: process
  topic: business value
  question: "All requirements have been gathered for a new software build. What should the team focus on next?"
  answer: "Delivering value to the customer."
  explanation: "Cost reduction, teamwork, and hitting the schedule are all secondary to the actual point of the project — delivering value that satisfies the gathered requirements."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0047
  domain: business-environment
  topic: organizational change
  question: "A large organization adopted Agile based on industry trends, invested heavily, but the implementation failed within months. What should the PM have done differently?"
  answer: "Assessed the organization's culture, performed a suitability analysis, and determined the future state before implementing."
  explanation: "Training everyone, running a postmortem, or hiring a third-party team are all downstream fixes — the actual gap was skipping the upfront culture/suitability assessment that determines whether and how Agile should be adopted at all."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0048
  domain: process
  topic: development approach
  question: "A component was being built predictively per the scope management plan, but changing regulations lead the team to request switching to Agile. What should the PM do first?"
  answer: "Analyze the requirements that would need to be addressed under the requested (Agile) method."
  explanation: "Before escalating for money, routing to the PMO, or seeking sponsor approval, the PM needs to understand what the change in approach actually requires — that analysis is what any of those next steps would be based on."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0049
  domain: process
  topic: project closure
  question: "During closing, the PM learns a deliverable isn't meeting customer expectations. How should they proceed?"
  answer: "Review the deliverable requirements, check the customer's approval criteria, and proceed accordingly."
  explanation: "This grounds the next step in what was actually agreed to, rather than jumping to a new change request, an ad hoc scope negotiation, or looping in the sponsor before even confirming what the criteria said."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0050
  domain: business-environment
  topic: organizational process assets
  question: "During sprint zero, a team member recalls a similar past project that went over budget and behind schedule. Where should the PM look for that project's performance details?"
  answer: "In the Organizational Process Assets (OPAs)."
  explanation: "Historical project performance data is exactly what OPAs are for — not EEFs (external conditions), the issue log (current project's own issues), and it's not irrelevant just because the past project used a different development approach."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0051
  domain: people
  topic: stakeholder engagement
  question: "Two weeks after charter approval on a global project, the PM realizes it was approved based on a different understanding among international stakeholders than what was actually presented. What should the PM have done to prevent this?"
  answer: "Validated each stakeholder's understanding during the kickoff meeting."
  explanation: "Sending minutes afterward or reviewing approvals later are both after-the-fact fixes; actively validating understanding in the room (across cultures/time zones) is what prevents the misalignment in the first place."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0052
  domain: process
  topic: requirements
  question: "A PM receives a requirements document from the customer but finds several requirements, outputs, and the project's ultimate goal hard to understand. What should the PM do next?"
  answer: "Ask the customer for clarification."
  explanation: "Don't reject the project, start planning around assumptions, or acquire a separate team to reverse-engineer intent — go to the source and ask."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0053
  domain: people
  topic: stakeholder engagement
  question: "A project has dozens of stakeholders — most need only high-level updates, a few need detailed, frequent updates. What should the PM create to address this?"
  answer: "A stakeholder engagement plan."
  explanation: "The power/interest grid classifies stakeholders but doesn't itself define communication cadence and depth; the salience model and engagement assessment matrix are related but the engagement plan is the actual deliverable that operationalizes differentiated engagement."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0054
  domain: people
  topic: stakeholder engagement
  question: "Mid-project, stakeholder engagement seems to be fading and the PM wants to measure satisfaction. Which two tools/techniques help most directly?"
  answer: "Net Promoter Score (NPS) and mood charts."
  explanation: "The power/interest grid and engagement assessment matrix are classification/planning tools, not satisfaction-measurement tools — NPS and mood charts are the ones that actually gauge how stakeholders currently feel."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0055
  domain: business-environment
  topic: project closure
  question: "Halfway through a 3D modeling project, the sponsor requests termination because an unrelated external change (a nearby dam) will make the deliverable's location unappealing. What should the PM do?"
  answer: "Terminate the project as per the sponsor's request."
  explanation: "The sponsor has the authority to end the project, and the stated reason is legitimate (external change affecting value) — negotiating to continue or insisting the dam is irrelevant both override a decision that's the sponsor's to make."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0056
  domain: process
  topic: integrated change control
  question: "The PM proposed a plan to the CCB for a scope deviation; the CCB approved a different implementation method than the PM's own proposal. The PM disagrees with the approved method. What should they do?"
  answer: "Implement the change using the approved method."
  explanation: "Once the CCB decides, the PM implements the approved decision exactly as approved — not their own preferred alternative, and not by refusing, resigning, or trying to relitigate the decision with a new prototype."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0057
  domain: people
  topic: communication planning
  question: "A PM leads a project for a client; a representative verbally agreed by phone to an extra $8,000 in added scope, then later refused to pay when invoiced. What could the PM have done differently?"
  answer: "Chosen a more appropriate communication channel — i.e., gotten the agreement in writing rather than relying on a verbal phone agreement."
  explanation: "Cutting scope or negotiating a lower price after the fact don't address the actual root cause: an informal, undocumented commitment for a cost-impacting change."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0058
  domain: people
  topic: stakeholder engagement
  question: "A legal stakeholder skips meetings and shows no interest in the product design during planning. How should the PM handle this?"
  answer: "Review the stakeholder engagement plan and communication strategy."
  explanation: "Escalating immediately, chasing the stakeholder down personally, or just updating the register without a strategy change all skip the actual diagnostic step — check whether the current engagement approach even fits this stakeholder before doing anything else."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0059
  domain: process
  topic: earned value management
  question: "A project has BAC = $500,000 and a current EAC of $540,000. What's the Variance at Completion (VAC), and what does it mean?"
  answer: "VAC = BAC − EAC = 500,000 − 540,000 = −$40,000, meaning the project is forecast to finish $40,000 over its original budget."
  explanation: "VAC extends the EVM formula set: a negative VAC signals an unfavorable budget outcome at completion, the same direction convention as CV and SV."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0060
  domain: process
  topic: schedule control
  question: "A resource is over-allocated across two activities. The PM has schedule slack available and doesn't want to push out the project end date. Should they use resource leveling or resource smoothing?"
  answer: "Resource smoothing — it resolves the conflict using existing slack without expanding the schedule."
  explanation: "Resource leveling would also fix the over-allocation but does so by expanding the schedule, which isn't what the PM wants here."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0061
  domain: people
  topic: active listening
  question: "A stakeholder is explaining a concern. Before responding with a solution, what should the PM do to confirm they actually understood the concern correctly?"
  answer: "Paraphrase — reword what the stakeholder said back to them, giving them a chance to correct any misunderstanding."
  explanation: "Paraphrasing closes the loop on understanding before acting; jumping straight to a solution risks solving the wrong problem."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0062
  domain: people
  topic: active listening
  question: "During a heated conversation with a team member, the PM catches themselves already forming a rebuttal while the team member is still talking. Which active listening principle are they violating?"
  answer: "Allowing time to speak (and, relatedly, avoiding judgment) — rushing to reply before fully listening hinders actual understanding."
  explanation: "The first active listening principle is patience: let the other person finish before responding, rather than half-listening while preparing a reply."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0063
  domain: people
  topic: active listening
  question: "A productive conversation with a stakeholder just ended without anyone stating what happens next. What active listening step was skipped, and why does it matter?"
  answer: "Summarizing and moving forward — without it, there's no confirmed alignment on key points or agreed next steps, so the discussion doesn't reliably lead to a tangible outcome."
  explanation: "Summarizing is the closing step that converts a conversation into action — skipping it is a common way agreements quietly fail to happen."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0064
  domain: business-environment
  topic: project governance
  question: "What is project governance, in one sentence?"
  answer: "The framework of policies, processes, and practices that guide project decision-making, ensuring alignment with organizational objectives, accountability, and successful delivery."
  explanation: "Governance is a framework, not a single document — it's the overall structure of oversight, decision rights, and controls a project operates inside."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0065
  domain: business-environment
  topic: project governance
  question: "Name the five pillars of effective project governance."
  answer: "Clear Roles and Accountability; a Decision-Making Framework; Effective Risk Management; Performance Monitoring and Control (Oversight); and Stakeholder Engagement & Transparency."
  explanation: "These five together are what makes a governance framework actually function, not just exist on paper."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0066
  domain: business-environment
  topic: project governance
  question: "On a large construction project, the project organigram shows a Project Board (finance, design authority, regulatory authority, government, community stakeholders, procurement) sitting above a Project Team (design/engineering and construction teams). What does this two-level split represent?"
  answer: "The general governance pattern of an oversight/decision-making layer structurally above the delivery layer, with clear accountability running between them."
  explanation: "This is the standard shape of project governance: a board that holds decision-making authority and approves direction, distinct from the teams executing the work."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0067
  domain: process
  topic: PMIS
  question: "A stakeholder asks whether the Communication Management Plan and the PMIS are the same thing. How would you explain the difference?"
  answer: "No — the Communication Management Plan defines who needs what information, in what format, and how often; the PMIS is the software/tooling that actually stores, moves, and gives centralized access to that information."
  explanation: "PMIS is a tool/technique, not a plan. The plan drives what should happen; the PMIS is (one of) the means by which it happens."
  source: sources/guides/2026-09-10-pmis.md

- id: q-0068
  domain: process
  topic: interface management
  question: "The architectural team and structural engineering team coordinate to make sure the building design aligns with load-bearing requirements. What interface type is this, along the scope axis and the nature axis?"
  answer: "Internal (a single scope of work — design) and Soft (an exchange of information between teams, not a physical connection)."
  explanation: "Internal/External and Soft/Hard are two independent classification axes — this example is internal because both teams work within the same overall scope, and soft because it's information exchange, not a physical fit."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0069
  domain: process
  topic: interface management
  question: "Pre-fabricated steel beams from an external supplier must fit precisely with the foundation and load-bearing columns built by the project team. What interface type is this?"
  answer: "A Hard interface (a physical connection between components) — and External, since it spans two separate scopes of work (the supplier's fabrication scope and the project's construction scope)."
  explanation: "Hard interfaces are about physical fit, not communication — but they still get classified as internal or external depending on whether the connected parties share a scope of work."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0070
  domain: process
  topic: interface management
  question: "Name at least three advantages of actively managing interfaces between project stakeholders, rather than leaving coordination to chance."
  answer: "Any three of: increased alignment, improved visibility and oversight, facilitated communication, mitigated risk."
  explanation: "Interface Management exists because leaving multi-party coordination unmanaged is itself a risk — these are the direct benefits of managing it deliberately."
  source: sources/guides/2026-09-10-interface-management.md
