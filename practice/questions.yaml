- id: q-0033
  domain: process
  topic: project closure
  question: "At sprint review, the product owner is satisfied with the increment; a team member wants another iteration to fix bugs; the sponsor says funding for further work depends on next quarter's budget. What should the PM do?"
  answer: "Release all resources and close the project."
  choices:
    - "Run another iteration to fix the bugs before closing."
    - "Keep the project open until next quarter's budget is confirmed."
    - "Submit a change request to add bug fixes to the scope."
    - "Release all resources and close the project."
  correct: D
  explanation: "The client/sponsor is effectively requesting closure, even knowing about remaining bugs — continuing work to satisfy the client at this point is gold plating, and a project can't stay open pending uncertain future funding. If funding arrives, a new project addresses the remaining work."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0034
  domain: process
  topic: value delivery
  question: "A sponsor doubts the product will meet business demand and wants to minimize cost. What should the PM do?"
  answer: "Identify and implement the requirements for a Minimum Viable Product (MVP)."
  choices:
    - "Plan a full incremental buildout of all requirements across several releases."
    - "Identify and implement the requirements for a Minimum Viable Product (MVP)."
    - "Exclude the doubtful stakeholders from requirements decisions to cut cost."
    - "Negotiate a fixed-cost contract with a vendor to build the full product."
  correct: B
  explanation: "MVP defines the smallest release that validates value against real demand — cheaper than a full incremental buildout, and it doesn't require excluding stakeholders or relying on a fixed-cost contract, neither of which addresses the actual concern (unproven demand)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0035
  domain: process
  topic: agile change management
  question: "During execution of an agile software project, the customer requests a requirement change. What should the PM do, and why is a CCB not the answer here?"
  answer: "Welcome the change request. Agile encourages responding to change; unlike predictive projects, agile doesn't route changes through a Change Control Board."
  choices:
    - "Submit the change to the CCB; agile still requires formal board approval for any scope change."
    - "Welcome the change; agile encourages responding to change and doesn't route changes through a CCB."
    - "Reject the change; agile locks the backlog once execution begins to protect the sprint goal."
    - "Defer the change to project closing; agile handles new requirements only after final delivery."
  correct: B
  explanation: "Flexibility is core to agile — regular stakeholder feedback is expected to reshape scope, which is the opposite of blocking or routing it through a formal board."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0036
  domain: process
  topic: business value
  question: "A make-or-buy analysis favored in-house development based on a developer rate that turns out to be half the current market rate. What should the PM do first?"
  answer: "Inform the sponsor about the findings."
  choices:
    - "Submit a change request to switch to buying the solution."
    - "Inform the sponsor about the findings."
    - "Update the make-or-buy analysis and continue as planned."
    - "Take no action as long as SPI and CPI remain on track."
  correct: B
  explanation: "This affects the project's business value/financial assumptions — the sponsor needs to know before anything else happens (submitting a change request, updating the analysis, or assuming SPI/CPI being on track covers it are all premature or insufficient)."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0037
  domain: process
  topic: integration
  question: "A newly assigned PM is replacing one who recently left the project. What should they consult first?"
  answer: "The project charter — to understand the project's goals and business case."
  choices:
    - "The project management plan, to understand the approved baselines first."
    - "The issue log, to understand the open problems the prior PM left behind."
    - "The project charter, to understand the project's goals and business case."
    - "The stakeholder register, to begin stakeholder outreach and introductions."
  correct: C
  explanation: "Understanding why the project exists and what it's meant to achieve comes before diving into baselines (the PM plan), open issues (issues/lessons-learned logs), or stakeholder outreach (the register) — those all follow from understanding the charter first."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0038
  domain: process
  topic: development approach
  question: "An adaptive-approach project has a fixed budget, 3–5 previewed releases, and progressively detailed scope. What should the PM do as the project proceeds?"
  answer: "Work with stakeholders to prioritize work for each release until the budget runs out."
  choices:
    - "Work with stakeholders to prioritize work for each release until the budget runs out."
    - "Fix the full scope for all releases up front and request more budget if needed."
    - "Switch to a predictive approach so the scope can be baselined against the budget."
    - "Complete every previewed release in full, then reconcile any overrun at closing."
  correct: A
  explanation: "In adaptive approaches, cost and schedule are typically fixed while scope flexes — so the team prioritizes the highest-value work per release rather than pre-committing to a fixed scope or switching to predictive."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0039
  domain: business-environment
  topic: professional responsibility
  question: "A PM reviewing a predictive project discovers deliverables marked 'finished' are actually still in progress, and the project is really over budget and behind schedule (contrary to what the sponsor believes). What should the PM do next?"
  answer: "Notify the sponsor of the findings."
  choices:
    - "Quietly correct the status reports and fix the issues first."
    - "Notify the sponsor of the findings."
    - "Decline the assignment since the problems were caused by others."
    - "Apply crashing or fast tracking to recover the schedule."
  correct: B
  explanation: "Per PMI's Code of Ethics and Professional Conduct, a PM who discovers errors or omissions caused by others must communicate them to the appropriate party promptly and accurately — not quietly try to fix it, decline the assignment, or jump straight to schedule compression."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0040
  domain: business-environment
  topic: compliance
  question: "While developing the project charter, a PM discovers missing regulatory requirements in the business case — compliance risks scope/budget overrun, non-compliance risks legal exposure. What should the PM do, and why can't they issue a change request yet?"
  answer: "Inform the project sponsor of the findings. A change request isn't possible yet because the project isn't authorized or baselined — it's still in charter development."
  choices:
    - "Submit a change request to add the requirements; the business case is already part of the approved project baseline."
    - "Inform the sponsor of the findings; a change request isn't possible because the project isn't authorized or baselined yet."
    - "Proceed without the requirements to protect the agreed scope; compliance can be handled through a change request later."
    - "Add the requirements to the charter quietly; a change request is unnecessary because regulatory items are mandatory anyway."
  correct: B
  explanation: "PMI's Code of Ethics requires compliance with laws/regulations and prohibits concealing such findings. Change requests operate against a baseline, which doesn't exist yet at this stage."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0041
  domain: people
  topic: agile roles
  question: "A PM worried about job security under an Agile transition believes Agile teams only have team members, a Scrum Master, and a Product Owner — no PM. Is that concern justified?"
  answer: "No — the PM can continue, typically as more of a facilitator (team facilitator/Scrum Master/coach are overlapping titles for that role)."
  choices:
    - "Yes — agile frameworks have no role for a project manager, so the PM must move to operations."
    - "No — the PM simply becomes the Product Owner, taking over ownership of the backlog and value."
    - "Yes — the PM's duties are split between the sponsor and the team, so the position is removed."
    - "No — the PM can continue, typically as more of a facilitator (team facilitator/Scrum Master/coach)."
  correct: D
  explanation: "Agile's three common roles are cross-functional team members, the product owner, and a team facilitator — which can be titled Scrum Master, project team lead, project manager, or team coach. The role leans on servant leadership: removing impediments, facilitating, coaching."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0042
  domain: process
  topic: project vs operations
  question: "How do operations differ from projects, precisely?"
  answer: "Operations are ongoing endeavors that generate repetitive outputs — the continuous execution of activities per an organization's procedures to produce the same result or a recurring service. There's no such thing as an 'ongoing project.'"
  choices:
    - "Operations are temporary endeavors producing unique outputs; projects are ongoing endeavors that produce repetitive outputs."
    - "Operations are ongoing endeavors producing repetitive outputs; an 'ongoing project' is an operation that has a sponsor."
    - "Operations are projects that have exceeded their original schedule and are now funded from the ongoing operating budget."
    - "Operations are ongoing endeavors producing repetitive outputs per organizational procedures; there is no such thing as an 'ongoing project.'"
  correct: D
  explanation: "A project is temporary with a unique result; an operation is permanent/ongoing with a repetitive result. Production, manufacturing, and accounting are examples of operations, not projects."
  source: sources/guides/2026-09-08-pm-fundamentals-questions.md

- id: q-0043
  domain: business-environment
  topic: organizational structures
  question: "In a weak matrix organization, who's in charge of hiring when additional team members are needed?"
  answer: "The functional manager."
  choices:
    - "The project manager."
    - "The project sponsor."
    - "The functional manager."
    - "The PMO director."
  correct: C
  explanation: "In a weak matrix, authority leans functional — the functional manager controls staffing decisions, not the PM."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0044
  domain: business-environment
  topic: organizational structures
  question: "In which organizational structure does the project manager have the most control?"
  answer: "Projectized."
  choices:
    - "Projectized."
    - "Strong matrix."
    - "Balanced matrix."
    - "Functional."
  correct: A
  explanation: "Projectized gives the PM full authority over the project — more than strong matrix, balanced matrix, or weak matrix, in that order."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0045
  domain: process
  topic: project success
  question: "A senior engineer is newly assigned to manage an Agile project. What should they do first to set the project up for success?"
  answer: "Define the project success criteria."
  choices:
    - "Identify the project risks."
    - "Define the project success criteria."
    - "Plan the first sprint's activities."
    - "Define the quality metrics."
  correct: B
  explanation: "Before identifying risks, planning sprint activities, or defining quality metrics, the project needs an agreed definition of what success actually looks like — everything else should trace back to that."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0046
  domain: process
  topic: business value
  question: "All requirements have been gathered for a new software build. What should the team focus on next?"
  answer: "Delivering value to the customer."
  choices:
    - "Reducing project costs."
    - "Building teamwork and morale."
    - "Delivering value to the customer."
    - "Hitting the schedule milestones."
  correct: C
  explanation: "Cost reduction, teamwork, and hitting the schedule are all secondary to the actual point of the project — delivering value that satisfies the gathered requirements."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0047
  domain: business-environment
  topic: organizational change
  question: "A large organization adopted Agile based on industry trends, invested heavily, but the implementation failed within months. What should the PM have done differently?"
  answer: "Assessed the organization's culture, performed a suitability analysis, and determined the future state before implementing."
  choices:
    - "Trained every employee on Agile practices, ran a postmortem on the failure, and then restarted the implementation."
    - "Hired an experienced third-party Agile team to run the rollout, and then trained the remaining internal staff."
    - "Assessed the culture, performed a suitability analysis, and determined the future state before implementing."
    - "Adopted the most popular industry framework, piloted it on one team, and then scaled it across the company."
  correct: C
  explanation: "Training everyone, running a postmortem, or hiring a third-party team are all downstream fixes — the actual gap was skipping the upfront culture/suitability assessment that determines whether and how Agile should be adopted at all."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0048
  domain: process
  topic: development approach
  question: "A component was being built predictively per the scope management plan, but changing regulations lead the team to request switching to Agile. What should the PM do first?"
  answer: "Analyze the requirements that would need to be addressed under the requested (Agile) method."
  choices:
    - "Analyze the requirements that would need to be addressed under the requested Agile method."
    - "Escalate to the sponsor for additional funding to cover the switch to Agile."
    - "Refer the request to the PMO so it can decide on the development approach."
    - "Deny the request because the scope management plan specifies a predictive approach."
  correct: A
  explanation: "Before escalating for money, routing to the PMO, or seeking sponsor approval, the PM needs to understand what the change in approach actually requires — that analysis is what any of those next steps would be based on."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0049
  domain: process
  topic: project closure
  question: "During closing, the PM learns a deliverable isn't meeting customer expectations. How should they proceed?"
  answer: "Review the deliverable requirements, check the customer's approval criteria, and proceed accordingly."
  choices:
    - "Submit a new change request to rework the deliverable so it meets expectations before closing the project."
    - "Negotiate an ad hoc scope adjustment directly with the customer to secure their acceptance of the deliverable."
    - "Escalate to the sponsor immediately, and pause closing activities until the sponsor decides how to proceed."
    - "Review the deliverable requirements, check the customer's approval criteria, and proceed accordingly."
  correct: D
  explanation: "This grounds the next step in what was actually agreed to, rather than jumping to a new change request, an ad hoc scope negotiation, or looping in the sponsor before even confirming what the criteria said."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0050
  domain: business-environment
  topic: organizational process assets
  question: "During sprint zero, a team member recalls a similar past project that went over budget and behind schedule. Where should the PM look for that project's performance details?"
  answer: "In the Organizational Process Assets (OPAs)."
  choices:
    - "In the Organizational Process Assets (OPAs)."
    - "In the Enterprise Environmental Factors (EEFs)."
    - "In the current project's issue log."
    - "Nowhere — data from a different development approach doesn't apply."
  correct: A
  explanation: "Historical project performance data is exactly what OPAs are for — not EEFs (external conditions), the issue log (current project's own issues), and it's not irrelevant just because the past project used a different development approach."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0051
  domain: people
  topic: stakeholder engagement
  question: "Two weeks after charter approval on a global project, the PM realizes it was approved based on a different understanding among international stakeholders than what was actually presented. What should the PM have done to prevent this?"
  answer: "Validated each stakeholder's understanding during the kickoff meeting."
  choices:
    - "Sent detailed meeting minutes to all stakeholders after the kickoff."
    - "Reviewed each stakeholder's approval again a month after sign-off."
    - "Asked the sponsor to approve the charter on behalf of all stakeholders."
    - "Validated each stakeholder's understanding during the kickoff meeting."
  correct: D
  explanation: "Sending minutes afterward or reviewing approvals later are both after-the-fact fixes; actively validating understanding in the room (across cultures/time zones) is what prevents the misalignment in the first place."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0052
  domain: process
  topic: requirements
  question: "A PM receives a requirements document from the customer but finds several requirements, outputs, and the project's ultimate goal hard to understand. What should the PM do next?"
  answer: "Ask the customer for clarification."
  choices:
    - "Reject the project until the customer issues a new document."
    - "Ask the customer for clarification."
    - "Begin planning and document assumptions about the unclear items."
    - "Acquire a separate team to analyze and interpret the requirements."
  correct: B
  explanation: "Don't reject the project, start planning around assumptions, or acquire a separate team to reverse-engineer intent — go to the source and ask."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0053
  domain: people
  topic: stakeholder engagement
  question: "A project has dozens of stakeholders — most need only high-level updates, a few need detailed, frequent updates. What should the PM create to address this?"
  answer: "A stakeholder engagement plan."
  choices:
    - "A stakeholder engagement plan."
    - "A power/interest grid."
    - "A salience model."
    - "A stakeholder engagement assessment matrix."
  correct: A
  explanation: "The power/interest grid classifies stakeholders but doesn't itself define communication cadence and depth; the salience model and engagement assessment matrix are related but the engagement plan is the actual deliverable that operationalizes differentiated engagement."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0054
  domain: people
  topic: stakeholder engagement
  question: "Mid-project, stakeholder engagement seems to be fading and the PM wants to measure satisfaction. Which two tools/techniques help most directly?"
  answer: "Net Promoter Score (NPS) and mood charts."
  choices:
    - "The power/interest grid and the engagement assessment matrix."
    - "Net Promoter Score (NPS) and the power/interest grid."
    - "Net Promoter Score (NPS) and mood charts."
    - "Mood charts and the stakeholder engagement assessment matrix."
  correct: C
  explanation: "The power/interest grid and engagement assessment matrix are classification/planning tools, not satisfaction-measurement tools — NPS and mood charts are the ones that actually gauge how stakeholders currently feel."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0055
  domain: business-environment
  topic: project closure
  question: "Halfway through a 3D modeling project, the sponsor requests termination because an unrelated external change (a nearby dam) will make the deliverable's location unappealing. What should the PM do?"
  answer: "Terminate the project as per the sponsor's request."
  choices:
    - "Terminate the project as per the sponsor's request."
    - "Negotiate with the sponsor to continue since half the work is done."
    - "Continue the project because the dam is unrelated to the deliverable."
    - "Submit a change request to relocate the deliverable and continue."
  correct: A
  explanation: "The sponsor has the authority to end the project, and the stated reason is legitimate (external change affecting value) — negotiating to continue or insisting the dam is irrelevant both override a decision that's the sponsor's to make."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0056
  domain: process
  topic: integrated change control
  question: "The PM proposed a plan to the CCB for a scope deviation; the CCB approved a different implementation method than the PM's own proposal. The PM disagrees with the approved method. What should they do?"
  answer: "Implement the change using the approved method."
  choices:
    - "Implement the change using the PM's original proposed method."
    - "Build a prototype of the PM's method and resubmit it to the CCB."
    - "Refuse to implement the change and escalate to the sponsor."
    - "Implement the change using the approved method."
  correct: D
  explanation: "Once the CCB decides, the PM implements the approved decision exactly as approved — not their own preferred alternative, and not by refusing, resigning, or trying to relitigate the decision with a new prototype."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0057
  domain: people
  topic: communication planning
  question: "A PM leads a project for a client; a representative verbally agreed by phone to an extra $8,000 in added scope, then later refused to pay when invoiced. What could the PM have done differently?"
  answer: "Chosen a more appropriate communication channel — i.e., gotten the agreement in writing rather than relying on a verbal phone agreement."
  choices:
    - "Cut the added scope as soon as the representative refused to pay, to protect the project's budget baseline."
    - "Chosen a more appropriate communication channel, getting the agreement in writing rather than verbally."
    - "Negotiated a lower price for the added scope after the invoice was disputed, to preserve the client relationship."
    - "Called the representative more frequently by phone to reconfirm the verbal agreement before sending the invoice."
  correct: B
  explanation: "Cutting scope or negotiating a lower price after the fact don't address the actual root cause: an informal, undocumented commitment for a cost-impacting change."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0058
  domain: people
  topic: stakeholder engagement
  question: "A legal stakeholder skips meetings and shows no interest in the product design during planning. How should the PM handle this?"
  answer: "Review the stakeholder engagement plan and communication strategy."
  choices:
    - "Review the stakeholder engagement plan and communication strategy."
    - "Escalate the stakeholder's lack of participation to the sponsor."
    - "Visit the stakeholder personally to insist on meeting attendance."
    - "Update the stakeholder register to classify them as low interest."
  correct: A
  explanation: "Escalating immediately, chasing the stakeholder down personally, or just updating the register without a strategy change all skip the actual diagnostic step — check whether the current engagement approach even fits this stakeholder before doing anything else."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0059
  domain: process
  topic: earned value management
  question: "A project has BAC = $500,000 and a current EAC of $540,000. What's the Variance at Completion (VAC), and what does it mean?"
  answer: "VAC = BAC − EAC = 500,000 − 540,000 = −$40,000, meaning the project is forecast to finish $40,000 over its original budget."
  choices:
    - "VAC = +$40,000; the project is forecast to finish $40,000 under its original budget."
    - "VAC = +$40,000; the project is forecast to finish $40,000 over its original budget."
    - "VAC = −$40,000; the project is forecast to finish $40,000 over its original budget."
    - "VAC = −$40,000; the project is forecast to finish $40,000 under its original budget."
  correct: C
  explanation: "VAC extends the EVM formula set: a negative VAC signals an unfavorable budget outcome at completion, the same direction convention as CV and SV."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0060
  domain: process
  topic: schedule control
  question: "A resource is over-allocated across two activities. The PM has schedule slack available and doesn't want to push out the project end date. Should they use resource leveling or resource smoothing?"
  answer: "Resource smoothing — it resolves the conflict using existing slack without expanding the schedule."
  choices:
    - "Resource leveling — it resolves the conflict using existing slack without expanding the schedule."
    - "Resource smoothing — it resolves the conflict by extending the schedule beyond the end date."
    - "Fast tracking — it resolves the conflict by running the two activities in parallel."
    - "Resource smoothing — it resolves the conflict using existing slack without expanding the schedule."
  correct: D
  explanation: "Resource leveling would also fix the over-allocation but does so by expanding the schedule, which isn't what the PM wants here."
  source: sources/guides/2026-09-08-pmp-tips-and-tricks.md

- id: q-0061
  domain: people
  topic: active listening
  question: "A stakeholder is explaining a concern. Before responding with a solution, what should the PM do to confirm they actually understood the concern correctly?"
  answer: "Paraphrase — reword what the stakeholder said back to them, giving them a chance to correct any misunderstanding."
  choices:
    - "Propose a solution right away so the stakeholder can see that the concern is being taken seriously and acted on quickly."
    - "Escalate the concern to the sponsor so a decision-maker can confirm what the stakeholder meant."
    - "Paraphrase — restate the concern in your own words back to the stakeholder so they can correct any misunderstanding."
    - "Log the concern verbatim in the issue log, then review it with the team at the next status meeting to agree on a response."
  correct: C
  explanation: "Paraphrasing closes the loop on understanding before acting; jumping straight to a solution risks solving the wrong problem."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0062
  domain: people
  topic: active listening
  question: "During a heated conversation with a team member, the PM catches themselves already forming a rebuttal while the team member is still talking. Which active listening principle are they violating?"
  answer: "Allowing time to speak (and, relatedly, avoiding judgment) — rushing to reply before fully listening hinders actual understanding."
  choices:
    - "Allowing time to speak (and avoiding judgment) — preparing a reply before the person finishes hinders real understanding."
    - "Paraphrasing — the PM should restate the team member's points back to them word for word before forming any rebuttal."
    - "Summarizing and moving forward — the PM should close with agreed next steps before responding at all."
    - "Asking clarifying questions — the PM should interrupt to probe for specific details instead of silently forming a rebuttal."
  correct: A
  explanation: "The first active listening principle is patience: let the other person finish before responding, rather than half-listening while preparing a reply."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0063
  domain: people
  topic: active listening
  question: "A productive conversation with a stakeholder just ended without anyone stating what happens next. What active listening step was skipped, and why does it matter?"
  answer: "Summarizing and moving forward — without it, there's no confirmed alignment on key points or agreed next steps, so the discussion doesn't reliably lead to a tangible outcome."
  choices:
    - "Paraphrasing — without it, the stakeholder's concern was never restated and confirmed, so the discussion can't reliably produce a decision anyone acts on."
    - "Allowing time to speak — without it, the stakeholder never got to finish their key points, so no outcome or next step could reliably be agreed."
    - "Asking open-ended questions — without them, the stakeholder's underlying interests stayed hidden, so the discussion stalled before reaching any outcome."
    - "Summarizing and moving forward — without it, there's no confirmed alignment on key points or agreed next steps, so the discussion doesn't reliably lead to an outcome."
  correct: D
  explanation: "Summarizing is the closing step that converts a conversation into action — skipping it is a common way agreements quietly fail to happen."
  source: sources/guides/2026-09-10-active-listening-skills.md

- id: q-0064
  domain: business-environment
  topic: project governance
  question: "What is project governance, in one sentence?"
  answer: "The framework of policies, processes, and practices that guide project decision-making, ensuring alignment with organizational objectives, accountability, and successful delivery."
  choices:
    - "The project charter that formally authorizes the project, names the sponsor, and gives the PM authority to apply organizational resources to project activities."
    - "The framework of policies, processes, and practices that guides project decision-making, ensuring alignment with organizational objectives, accountability, and successful delivery."
    - "The project management plan that integrates all subsidiary plans and baselines, defining how the project's work is executed, monitored, controlled, and closed."
    - "The PMO's set of templates, reporting tools, and dashboards that the project team uses to track schedule, cost, and scope performance over the project's life."
  correct: B
  explanation: "Governance is a framework, not a single document — it's the overall structure of oversight, decision rights, and controls a project operates inside."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0065
  domain: business-environment
  topic: project governance
  question: "Name the five pillars of effective project governance."
  answer: "Clear Roles and Accountability; a Decision-Making Framework; Effective Risk Management; Performance Monitoring and Control (Oversight); and Stakeholder Engagement & Transparency."
  choices:
    - "Clear Roles and Accountability; a Change Control Board; Effective Risk Management; Earned Value Reporting; Stakeholder Engagement & Transparency."
    - "Clear Roles and Accountability; a Decision-Making Framework; Effective Risk Management; Performance Monitoring and Control; Stakeholder Engagement & Transparency."
    - "A Signed Project Charter; a Decision-Making Framework; Effective Quality Assurance; Performance Monitoring and Control; Stakeholder Engagement & Transparency."
    - "Clear Roles and Accountability; a Decision-Making Framework; Effective Risk Management; Performance Monitoring and Control; Benefits Realization Tracking."
  correct: B
  explanation: "These five together are what makes a governance framework actually function, not just exist on paper."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0066
  domain: business-environment
  topic: project governance
  question: "On a large construction project, the project organigram shows a Project Board (finance, design authority, regulatory authority, government, community stakeholders, procurement) sitting above a Project Team (design/engineering and construction teams). What does this two-level split represent?"
  answer: "The general governance pattern of an oversight/decision-making layer structurally above the delivery layer, with clear accountability running between them."
  choices:
    - "A matrix organization: board members act as functional managers who assign, prioritize, and release staff to the delivery teams sitting below them."
    - "A supportive PMO structure: the board provides templates, training, and lessons learned to the delivery teams below it, with little direct control."
    - "A stakeholder register layout: stakeholders are grouped by their power and interest levels rather than by any decision-making authority they hold."
    - "The general governance pattern: an oversight/decision-making layer structurally above the delivery layer, with clear accountability running between them."
  correct: D
  explanation: "This is the standard shape of project governance: a board that holds decision-making authority and approves direction, distinct from the teams executing the work."
  source: sources/guides/2026-09-10-project-governance.md

- id: q-0067
  domain: process
  topic: PMIS
  question: "A stakeholder asks whether the Communication Management Plan and the PMIS are the same thing. How would you explain the difference?"
  answer: "No — the Communication Management Plan defines who needs what information, in what format, and how often; the PMIS is the software/tooling that actually stores, moves, and gives centralized access to that information."
  choices:
    - "No — the Communication Management Plan defines who needs what information, in what format, and how often; the PMIS is the software/tooling that stores, moves, and gives centralized access to it."
    - "Yes — the PMIS is simply the formal name for the Communication Management Plan once it has been approved, baselined, and incorporated into the project management plan."
    - "No — the PMIS defines who needs what information, in what format, and how often; the Communication Management Plan is the tooling that stores, moves, and distributes that information."
    - "No — the Communication Management Plan covers internal team communication only, such as standups and status meetings; the PMIS is the plan for communicating with external stakeholders."
  correct: A
  explanation: "PMIS is a tool/technique, not a plan. The plan drives what should happen; the PMIS is (one of) the means by which it happens."
  source: sources/guides/2026-09-10-pmis.md

- id: q-0068
  domain: process
  topic: interface management
  question: "The architectural team and structural engineering team coordinate to make sure the building design aligns with load-bearing requirements. What interface type is this, along the scope axis and the nature axis?"
  answer: "Internal (a single scope of work — design) and Soft (an exchange of information between teams, not a physical connection)."
  choices:
    - "External (two separate disciplines are involved) and Soft (an exchange of information between teams, not a physical connection)."
    - "Internal (a single scope of work — design) and Hard (a physical connection between the load-bearing components)."
    - "Internal (a single scope of work — design) and Soft (an exchange of information between teams, not a physical connection)."
    - "External (two separate disciplines are involved) and Hard (a physical connection between the load-bearing components)."
  correct: C
  explanation: "Internal/External and Soft/Hard are two independent classification axes — this example is internal because both teams work within the same overall scope, and soft because it's information exchange, not a physical fit."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0069
  domain: process
  topic: interface management
  question: "Pre-fabricated steel beams from an external supplier must fit precisely with the foundation and load-bearing columns built by the project team. What interface type is this?"
  answer: "A Hard interface (a physical connection between components) — and External, since it spans two separate scopes of work (the supplier's fabrication scope and the project's construction scope)."
  choices:
    - "Soft (an exchange of specifications between parties) and External, since it spans two scopes of work — the supplier's fabrication and the project's construction."
    - "Hard (a physical connection between components) and Internal, since the beams end up inside the project's single construction scope of work."
    - "Soft (an exchange of specifications between parties) and Internal, since the project team coordinates and owns all of the connected work."
    - "Hard (a physical connection between components) and External, since it spans two scopes of work — the supplier's fabrication and the project's construction."
  correct: D
  explanation: "Hard interfaces are about physical fit, not communication — but they still get classified as internal or external depending on whether the connected parties share a scope of work."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0070
  domain: process
  topic: interface management
  question: "Name at least three advantages of actively managing interfaces between project stakeholders, rather than leaving coordination to chance."
  answer: "Any three of: increased alignment, improved visibility and oversight, facilitated communication, mitigated risk."
  choices:
    - "Any three of: increased alignment, improved visibility and oversight, facilitated communication, mitigated risk."
    - "Any three of: reduced headcount, eliminated change requests, fixed-price contracts, shorter procurement cycles."
    - "Any three of: risk transferred to suppliers, no need for a CCB, guaranteed schedule compression, lower contingency reserves."
    - "Any three of: fewer stakeholders to engage, a simpler WBS, no quality audits, reduced need for status reporting."
  correct: A
  explanation: "Interface Management exists because leaving multi-party coordination unmanaged is itself a risk — these are the direct benefits of managing it deliberately."
  source: sources/guides/2026-09-10-interface-management.md

- id: q-0071
  domain: people
  topic: stakeholder engagement
  question: "A construction project for an electricity factory in a forested area triggers environmentalist protests, widely covered in the media, that disrupt the project. What should the PM have done earlier to avoid this?"
  answer: "Engage in open dialogue with the environmentalists early to understand their concerns and perspectives on the project's environmental impact."
  choices:
    - "Purchase insurance early to cover the financial losses from protest-related delays and any negative media coverage of the project."
    - "Offer the environmentalist groups financial incentives early so they would agree not to publicly oppose the project's construction."
    - "Engage in open dialogue with the environmentalists early to understand their concerns and perspectives on the project's environmental impact."
    - "Develop an internal environmental mitigation plan early and publish it to the public once construction is already underway."
  correct: C
  explanation: "Open dialogue builds trust and goodwill and surfaces concerns before they escalate — insurance, financial incentives, or purely internal mitigation planning don't address the actual relationship with this stakeholder group."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0072
  domain: people
  topic: cross-cultural communication
  question: "A PM working with foreign stakeholders learns their email tone has been read as harsh and abrasive. What should the PM do?"
  answer: "Apologize for any unintended offense and adjust future emails to be more culturally sensitive and diplomatic."
  choices:
    - "Explain that the emails are intentionally clear and direct, and ask the stakeholders to adapt to that style."
    - "Apologize for any unintended offense and adjust future emails to be more culturally sensitive and diplomatic."
    - "Switch to phone calls for future communication so that tone in written messages is no longer an issue."
    - "Escalate to the sponsor so the stakeholders' organization can address their sensitivity to the emails."
  correct: B
  explanation: "Defending the style as 'clear and direct,' or just switching medium without addressing tone, both dodge the actual feedback — acknowledging impact and adjusting is the right response."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0073
  domain: people
  topic: stakeholder engagement
  question: "A key stakeholder (the Mayor's Chief of Staff) has high influence but a notoriously packed schedule, making regular face-to-face meetings impossible. What communication approach fits best?"
  answer: "Concise, targeted channels — weekly email updates, bi-weekly status reports, and regular calls — to keep him informed and solicit feedback without requiring dedicated meeting time."
  choices:
    - "Use concise, targeted channels — weekly email updates, bi-weekly status reports, and regular calls — to keep him informed and get feedback without dedicated meetings."
    - "Keep requesting face-to-face meetings until a recurring slot opens up, since high-influence stakeholders need regular in-person engagement to stay supportive."
    - "Delegate communication with him to a team member so the PM can focus on stakeholders who have more availability for regular meetings."
    - "Hold quarterly in-person briefing sessions so the meetings are infrequent enough to fit into his packed schedule while still being face-to-face."
  correct: A
  explanation: "Persistently pushing for face-to-face meetings ignores the schedule constraint; delegating communication away from the PM risks losing a high-influence relationship; quarterly sessions are too infrequent for someone this influential."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0074
  domain: people
  topic: stakeholder analysis
  question: "A significant shareholder shows little interest in a project, missing most meetings despite repeated engagement attempts. What should the PM do?"
  answer: "Initiate a stakeholder analysis to tailor communication strategies and engagement approaches to this stakeholder's actual preferences and priorities."
  choices:
    - "Stop the engagement attempts and redirect that effort toward the stakeholders who are responsive and regularly attending the meetings."
    - "Formally require the shareholder's attendance at meetings and escalate to the sponsor if they continue to miss the scheduled sessions."
    - "Reassign the shareholder to the Monitor quadrant and send them only the standard project newsletter for the rest of the project."
    - "Initiate a stakeholder analysis to tailor communication strategies and engagement approaches to this stakeholder's actual preferences and priorities."
  correct: D
  explanation: "Giving up and focusing only on responsive stakeholders, or demanding participation, both skip the diagnostic step — understanding why they're disengaged should come before deciding how to re-engage them."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0075
  domain: process
  topic: agile roles
  question: "At a sprint review, the product owner approves release of the increment, but a key stakeholder in attendance disapproves. What should the PM/facilitator do first?"
  answer: "Align the product owner and the key stakeholder on a common decision. If that fails, support the product owner's decision, since the PO is accountable for approving deliverables."
  choices:
    - "Support the key stakeholder's objection and hold the release, since satisfying key stakeholders outranks the PO's approval of the increment at a sprint review."
    - "Have the cross-functional team vote on whether to release, so that the final decision reflects the whole team's view of the increment's readiness and value."
    - "First try to align the PO and the key stakeholder on a common decision; if that fails, support the PO's decision, since the PO is accountable for approving deliverables."
    - "Release immediately on the PO's approval and log the stakeholder's objection in the issue log so it can be discussed later at the sprint retrospective."
  correct: C
  explanation: "It's not up to the cross-functional team to vote on release decisions — that authority sits with the PO, and the facilitator's first move is trying to reconcile the disagreement, not immediately defaulting to either party."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0076
  domain: people
  topic: stakeholder engagement
  question: "A key, high-power stakeholder refuses to sign off the acceptance document during product validation, claiming functionalities don't meet expectations. What should the PM have done to avoid this?"
  answer: "Involve the key stakeholder during all project phases, not just planning or quality control alone."
  choices:
    - "Involved the key stakeholder intensively during planning, when the requirements and acceptance criteria were defined."
    - "Involved the key stakeholder during all project phases, not just during planning or quality control."
    - "Had the quality control team verify all functionalities against the specifications before product validation began."
    - "Arranged for the sponsor to sign the acceptance document on the stakeholder's behalf to avoid validation delays."
  correct: B
  explanation: "High-power stakeholders (per the power/interest grid) need to be managed closely and/or kept satisfied throughout — waiting until validation to involve them is what creates last-minute surprises like this."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0077
  domain: people
  topic: stakeholder identification
  question: "A project installing 120 air conditioners has a huge number of stakeholders — nearly one per office. What's the best way for the PM to handle this scale?"
  answer: "Set up an effective, systematic way to define the needs of each individual stakeholder."
  choices:
    - "Ask the sponsor to represent the office stakeholders and communicate their needs collectively."
    - "Engage only the high-power, high-interest stakeholders and simply monitor all of the rest."
    - "Split the work into a program of smaller projects so that each has fewer stakeholders."
    - "Set up an effective, systematic way to define the needs of each individual stakeholder."
  correct: D
  explanation: "Delegating representation to the sponsor, only engaging high power/interest stakeholders, or splitting the work into a program purely to dodge the stakeholder count are all shortcuts that skip identifying real needs — scale is a process problem, not a reason to exclude people."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0078
  domain: people
  topic: stakeholder analysis
  question: "The head of investments claims they never receive the PM's emails and can't help; the head of customer relations is too busy to reply to emails but responds fine in person. How should the PM classify each in the stakeholder engagement assessment matrix?"
  answer: "The head of investments is resistant (unwilling to help); the head of customer relations is neutral (too busy/indifferent, not opposed)."
  choices:
    - "Head of investments: unaware (not receiving the emails). Head of customer relations: resistant (refuses to reply to emails)."
    - "Head of investments: neutral (not opposed, just missing emails). Head of customer relations: supportive (responds well in person)."
    - "Head of investments: resistant (unwilling to help). Head of customer relations: neutral (too busy/indifferent, not opposed)."
    - "Head of investments: unaware (not receiving the emails). Head of customer relations: neutral (too busy/indifferent, not opposed)."
  correct: C
  explanation: "Resistant means aware but unsupportive; neutral means aware but neither supportive nor resistant. Claiming to never get emails is a passive-resistance pattern, not genuine unawareness."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0079
  domain: people
  topic: stakeholder resistance
  question: "A project manager presents a stadium project the community supports in principle, but encounters strong stakeholder resistance from the start. What should the PM do to resolve this — and what should they NOT do?"
  answer: "Schedule a meeting to thoroughly explain the project, establish ground rules, ensure involvement, and surface any underlying personal/organizational issues. They should NOT create a 'fait accompli' to pressure acceptance."
  choices:
    - "Schedule a meeting to explain the project thoroughly, set ground rules, ensure involvement, and surface underlying personal/organizational issues; do NOT create a fait accompli to pressure acceptance."
    - "Create a fait accompli by starting visible construction work to demonstrate momentum and commitment; do NOT reopen debate on decisions the sponsor and board have already made."
    - "Escalate to the sponsor to secure executive backing and a public endorsement for the project; do NOT hold meetings that would give the resisting stakeholders a public platform."
    - "Proceed with the approved plan, since the community supports the project in principle; do NOT spend limited project time on individual stakeholders' personal concerns or complaints."
  correct: A
  explanation: "Overcoming resistance starts with listening and understanding what drives it — a fait accompli tries to bypass that understanding entirely, and is a reliable wrong answer on the exam."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0080
  domain: process
  topic: development approach
  question: "Starting the second phase of a hybrid project after requirements challenges in phase one, the PM wants stakeholders to find common ground before differences widen. What should they do?"
  answer: "Invite all concerned stakeholders to a requirements workshop to develop user stories together."
  choices:
    - "Send all concerned stakeholders a questionnaire to capture each one's requirements individually."
    - "Invite all concerned stakeholders to a requirements workshop to develop user stories together."
    - "Hold one-on-one meetings with each concerned stakeholder to gather and reconcile their requirements."
    - "Run a user survey across all concerned stakeholders to rank the remaining requirements by priority."
  correct: B
  explanation: "A facilitated workshop's shared interaction helps a group reach consensus in a way that individual questionnaires, one-on-one meetings, or user surveys don't."
  source: sources/guides/2026-09-10-communication-stakeholder-questions.md

- id: q-0081
  domain: people
  topic: power/interest grid
  question: "A stakeholder has high power but low interest in the project. Which power/interest grid engagement strategy fits, and how does that differ from a stakeholder with high power AND high interest?"
  answer: "Keep Satisfied (high power, low interest) — don't overwhelm them with detail, but don't neglect them either, since they can still impact the project. High power + high interest is Manage Closely, requiring active engagement."
  choices:
    - "Keep Informed — send them regular, detailed updates since they can still impact the project; high power + high interest is Manage Closely, with active engagement."
    - "Monitor — check in occasionally with minimal effort since their interest is low; high power + high interest is Keep Satisfied, with active engagement."
    - "Keep Satisfied — don't overwhelm them with detail, but don't neglect them since they can still impact the project; high power + high interest is Manage Closely, with active engagement."
    - "Manage Closely — engage them actively since they can still impact the project; high power + high interest is Keep Satisfied, with detailed reporting."
  correct: C
  explanation: "The four quadrant labels are Manage Closely (high/high), Keep Satisfied (high power/low interest), Keep Informed (low power/high interest), and Monitor (low/low)."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0082
  domain: people
  topic: conflict resolution
  question: "What are the 5 levels of conflict escalation, in order?"
  answer: "Problem to solve, Disagreement, Contest, Crusade, World War."
  choices:
    - "Disagreement, Problem to solve, Contest, World War, Crusade."
    - "Problem to solve, Contest, Disagreement, Crusade, World War."
    - "Disagreement, Contest, Problem to solve, Crusade, World War."
    - "Problem to solve, Disagreement, Contest, Crusade, World War."
  correct: D
  explanation: "Each level needs a more deliberate response than the last — the goal of resolving conflict early and well is to stop it from escalating to the next level."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0083
  domain: people
  topic: communication methods
  question: "A PM gives a demanding sponsor access to the project management software so they can check real-time status themselves. Is this sufficient communication for a high-power, high-interest stakeholder on a complex project?"
  answer: "Not on its own — this is pull communication, which shifts the effort onto the sponsor to seek information, and may not be sufficient for a high-power, demanding stakeholder who expects information pushed to them plus regular interactive touchpoints."
  choices:
    - "Yes — it's push communication, since the software delivers real-time status directly to the sponsor without any further effort from the PM or the team, so no other touchpoints are needed."
    - "Not on its own — it's pull communication, which shifts the effort onto the sponsor; a demanding high-power sponsor likely expects information pushed to them plus regular interactive touchpoints."
    - "Yes — pull communication is the preferred method for high-power stakeholders, because it respects their limited time, avoids meeting overload, and gives them full autonomy."
    - "Not on its own — it's interactive communication, so it should simply be supplemented with a monthly pull-based report posted to the project repository for the sponsor."
  correct: B
  explanation: "For complex projects with demanding sponsors, frequent push/interactive communication (regular meetings, standup access) generally beats pull-only or infrequent push-only approaches."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0084
  domain: people
  topic: communication model
  question: "During a status meeting, a team member uses heavy industry jargon that confuses the rest of the group. What type of communication noise is this?"
  answer: "Semantic noise."
  choices:
    - "Semantic noise."
    - "Physical noise."
    - "Psychological noise."
    - "Physiological noise."
  correct: A
  explanation: "Semantic noise is caused by word choice/jargon the receiver doesn't understand — distinct from physiological (speaker-side delivery), psychological (judgment/bias), or physical (environmental) noise."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0085
  domain: people
  topic: stakeholder engagement
  question: "What's the difference between the Stakeholder Engagement Assessment Matrix and the Stakeholder Engagement Plan?"
  answer: "The assessment matrix compares each stakeholder's current engagement state against their desired state — a diagnostic snapshot. The engagement plan specifies the actual strategies and actions to close that gap."
  choices:
    - "The matrix compares each stakeholder's current vs. desired engagement state as a diagnostic snapshot; the plan specifies the strategies and actions to close that gap."
    - "The matrix specifies the strategies and actions to engage each stakeholder; the plan compares each stakeholder's current vs. desired engagement state as a snapshot."
    - "The matrix plots stakeholders by their power and interest levels; the plan lists each stakeholder's contact details, role, and organizational position on the project."
    - "The matrix records each stakeholder's preferred communication frequency and format; the plan tracks issues raised by stakeholders and how they were resolved."
  correct: A
  explanation: "Analysis tools (power/interest grid, engagement assessment matrix, Salience Model) tell you where stakeholders stand; the engagement plan is the actionable document built from that analysis."
  source: sources/guides/2026-09-10-communication-stakeholder-keywords.md

- id: q-0086
  domain: people
  topic: team development
  question: "A PM is starting a new project with an experienced team. At which Tuckman stage should the team charter be created, and why?"
  answer: "At the Forming stage — creating it at the outset establishes clear goals, roles, and expectations from the start, giving the team a foundation to work from through Storming, Norming, and Performing."
  choices:
    - "Norming — once the team has worked through its conflicts and built trust, the norms and working agreements it has settled on can be captured in the charter."
    - "Storming — conflict reveals exactly where ground rules are needed, so the charter should be written in response to it rather than guessed at before work begins."
    - "Forming — creating it at the outset sets clear goals, roles, and expectations from the start, giving a foundation through Storming, Norming, and Performing."
    - "Performing — an experienced team can document its working agreements once it is already operating effectively, so the charter reflects how it really works."
  correct: C
  explanation: "This corrects an earlier note in this knowledge base that placed the team charter at Norming — the team-management source material is explicit that it belongs at Forming, not left to emerge organically later."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0087
  domain: people
  topic: power types
  question: "A stakeholder tells a team member they're 'not living up to what was promised' in order to get them to comply. Which type of power is this, and how does it differ from pressure-based power?"
  answer: "Guilt-based power — inducing guilt to motivate compliance. Pressure-based power is different: it works by limiting someone's freedom of choice, not by making them feel guilty."
  choices:
    - "Pressure-based power — limiting the person's freedom of choice; guilt-based power instead works through the threat of formal penalties."
    - "Penalty (coercive) power — threatening negative consequences; pressure-based power instead works by making someone feel guilty."
    - "Referent power — appealing to the personal relationship to gain compliance; pressure-based power instead works through formal authority."
    - "Guilt-based power — inducing guilt to motivate compliance; pressure-based power instead works by limiting someone's freedom of choice."
  correct: D
  explanation: "Both are less-common power types beyond the core five (legitimate, reward, penalty, referent, expert) — the exam distinguishes them by mechanism: guilt-based plays on emotion, pressure-based constrains options."
  source: sources/guides/2026-09-11-team-management-keywords.md

- id: q-0088
  domain: people
  topic: personality assessment
  question: "A team member with deep expertise actively volunteers to coach and mentor newer members, but in meetings pushes his own solutions assertively without weighing alternative perspectives. Which two MBTI traits does this describe?"
  answer: "Extrovert and Judging."
  choices:
    - "Introvert and Judging."
    - "Extrovert and Judging."
    - "Extrovert and Perceiving."
    - "Introvert and Perceiving."
  correct: B
  explanation: "Volunteering to actively engage with others indicates Extrovert (vs. Introvert); being assertive/decisive and not fully considering alternatives aligns with Judging (vs. Perceiving, which stays open and flexible)."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0089
  domain: people
  topic: motivation
  question: "A senior team member on a multi-year project starts losing motivation, saying their work could easily be done by a junior. What's the right fix, and why not just give them a raise?"
  answer: "Find them more challenging work. The demotivation is intrinsic — they want challenge and growth, not just compensation — so a raise or team-building activity doesn't address the actual cause."
  choices:
    - "Give them a raise — the demotivation is extrinsic (they feel underpaid for their seniority), so more challenging work wouldn't address the cause."
    - "Organize a team-building activity — the demotivation is social (they feel isolated on a long project), so a raise wouldn't address the cause."
    - "Reduce their workload temporarily — the demotivation is burnout (from years on the same project), so a raise wouldn't address the cause."
    - "Find them more challenging work — the demotivation is intrinsic (they want challenge and growth), so a raise or team-building activity doesn't address the cause."
  correct: D
  explanation: "Per PMBOK 7th edition (p. 25), team members respond well to stretch goals and problem-solving when the underlying issue is intrinsic motivation, not extrinsic (hygiene) factors like pay."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0090
  domain: people
  topic: self-organizing teams
  question: "After an org-wide move to Agile, team members still wait for the PM to hand them work instead of self-organizing. What should the PM actually do?"
  answer: "Mentor the team on how to make their own decisions."
  choices:
    - "Mentor the team on how to make their own decisions."
    - "Ensure the team has diverse functional expertise."
    - "Keep assigning work until the team asks for autonomy."
    - "Ask the sponsor to mandate self-organization."
  correct: A
  explanation: "Self-organization is a capability the team has to build, not just a structural condition — ensuring diverse functional expertise or removing impediments helps, but doesn't teach the team how to decide for itself."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0091
  domain: people
  topic: resource management
  question: "A construction PM needs to know whether the electricity team is free in the next two weeks to resolve a dependency. Should they check the RACI/RAM, or the resource calendar — and why?"
  answer: "The resource calendar — it shows when resources (team members and equipment) are actually available. The RACI/RAM shows who is responsible for what, not when they're free."
  choices:
    - "The RACI/RAM — it shows each team's assignments and therefore when they're free; the resource calendar only tracks equipment availability, not people."
    - "The resource calendar — it shows when resources (team members and equipment) are available; the RACI/RAM shows who is responsible for what, not when they're free."
    - "The RACI/RAM — it shows who is accountable for resolving the dependency; the resource calendar only shows the project's milestone dates."
    - "The resource calendar — it shows who is responsible for each activity; the RACI/RAM shows when team members and equipment are free."
  correct: B
  explanation: "A common exam trap: RAM/RACI and resource calendars both look like 'team management documents,' but they answer different questions — responsibility vs. availability."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0092
  domain: people
  topic: remote team communication
  question: "A PM leads a hybrid team spread across four continents and communication is suffering. What two techniques specifically help, and what do they each involve?"
  answer: "Remote pairing (two or more people join an online event at a set time to discuss and share screens) and fishbowl windows (a long-lived video feed team members join at the start of the workday and leave at the end, so the team feels co-located)."
  choices:
    - "Colocation (relocating all members to one site for the project's duration) and fishbowl windows (a long-lived video feed joined at the start of the workday and left at the end, so the team feels co-located)."
    - "Remote pairing (two or more people join an online session at a set time to discuss and share screens) and a communication matrix (a document defining who receives which reports, in what format, and how often)."
    - "Remote pairing (two or more people join an online session at a set time to discuss and share screens) and fishbowl windows (a long-lived video feed joined at the start of the workday and left at the end, so the team feels co-located)."
    - "Daily standups (a 15-minute synchronization meeting held at the same time every day for the whole team) and osmotic communication (overhearing useful conversations in a shared physical workspace)."
  correct: C
  explanation: "Both come from the Agile Practice Guide (p. 46) — colocating a globally distributed team isn't realistic, and 'use an agile approach' on its own doesn't address the communication mechanics."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0093
  domain: people
  topic: conflict resolution
  question: "Before a client demo, the team spends 15 minutes stuck debating repair-vs-replace for a defective component — both options are negligible in cost, risk-free, and take under an hour. What should the PM do?"
  answer: "Call for a vote to reach a decision."
  choices:
    - "Let the debate continue until the team reaches full consensus."
    - "Schedule a formal meeting to analyze both options in depth."
    - "Call for a vote to reach a decision."
    - "Escalate the decision to the sponsor."
  correct: C
  explanation: "Voting is the right tool for a quick, low-stakes decision the team can't converge on — it's simple and efficient. Letting the debate continue, calling a formal meeting, or escalating to the sponsor would all be disproportionate to the stakes involved."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0094
  domain: people
  topic: conflict resolution
  question: "A frustrated team member tells the PM a coworker's mistakes put him behind schedule. The PM reassures him she's aware of the situation and that his hard work is noticed and appreciated. Which conflict resolution technique is this, and what's its limitation?"
  answer: "Smoothing — giving more consideration to one side to defuse the situation. It builds harmony for a non-critical issue, but unlike collaborating/problem-solving, it doesn't actually address the root cause (the coworker's mistakes)."
  choices:
    - "Smoothing — giving more consideration to one side to defuse the situation; it builds harmony on a non-critical issue but doesn't address the root cause (the coworker's mistakes)."
    - "Collaborating — working with both parties toward a shared solution; it resolves the root cause (the coworker's mistakes) but takes more time than other techniques."
    - "Compromising — giving each side part of what it wants; it settles the issue quickly but leaves both parties partly dissatisfied with the outcome."
    - "Withdrawing — postponing the issue until a later time; it avoids the conflict in the moment but lets the coworker's mistakes continue unchecked."
  correct: A
  explanation: "Smoothing sits in the middle of the technique ranking (below collaborating and compromising) precisely because it prioritizes short-term harmony over resolving the underlying issue."
  source: sources/guides/2026-09-11-team-management-questions.md

- id: q-0095
  domain: process
  topic: schedule behavioral traps
  question: "A project team is stuck behind schedule because activities that finished early sat idle since the next team wasn't ready to start. Which schedule/resource behavioral trap is this, and how does it differ from Student Syndrome?"
  answer: "Dropped Baton — the preceding activity finishes early but the successor isn't ready, so the time gained is lost. Student Syndrome is different: it's procrastination eating into an activity's own slack, not a handoff failure between two activities."
  choices:
    - "Student Syndrome — the successor team waits until the last moment to start, so the gain is lost; Dropped Baton is procrastination eating into an activity's own slack."
    - "Parkinson's Law — work expands to fill all of the time available; Student Syndrome is a handoff failure where the successor activity isn't ready to start."
    - "Dropped Baton — the preceding activity finishes late, so the successor is delayed; Student Syndrome is a handoff failure between two separate activities."
    - "Dropped Baton — the preceding activity finishes early but the successor isn't ready, so the gain is lost; Student Syndrome is procrastination eating into an activity's own slack."
  correct: D
  explanation: "Both traps waste schedule buffer, but Dropped Baton is a coordination/handoff problem between activities, while Student Syndrome is a within-activity timing problem."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0096
  domain: process
  topic: estimating
  question: "A sponsor asks the PM for an approximate cost estimate by end of day, very early in the project, with almost no information available yet. What estimating technique should the PM use, and why?"
  answer: "Analogous (top-down) estimating — using the known costs of a similar completed project, combined with expert judgment and historical data. Building a WBS and summing work-package costs, or creating the cost management plan, are both too involved for a same-day, early-stage estimate."
  choices:
    - "Bottom-up estimating — building a WBS and summing the work-package costs; analogous estimating is too inaccurate to give to a sponsor this early, even as a rough order of magnitude figure."
    - "Analogous (top-down) estimating — using a similar completed project's known costs plus expert judgment and historical data; a WBS roll-up or cost management plan is too involved for a same-day, early estimate."
    - "Parametric estimating — multiplying unit rates by quantities taken from the detailed scope baseline; analogous estimating is reserved for later phases, once similar-project data has been validated."
    - "Three-point estimating — averaging optimistic, most likely, and pessimistic costs from the cost management plan, which must be created and approved before any estimate can be given to the sponsor."
  correct: B
  explanation: "Analogous estimating trades accuracy for speed, which is exactly the tradeoff this scenario calls for — it fits the ROM/preliminary estimate range (−25%/+75%), appropriate this early."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0097
  domain: process
  topic: EVM interpretation
  question: "Over four months, a project's SPI trends from 1.00 up to 1.25 while its CPI trends from 1.00 down to 0.70. What should the PM do?"
  answer: "Take corrective action on cost specifically — the project is increasingly over budget (CPI < 1) even though it's increasingly ahead of schedule (SPI > 1). Schedule doesn't need fixing; cost does."
  choices:
    - "Take corrective action on cost — the project is increasingly over budget (CPI < 1) though increasingly ahead of schedule (SPI > 1); schedule doesn't need fixing."
    - "Take corrective action on schedule — the project is increasingly behind schedule (SPI > 1) though increasingly under budget (CPI < 1); cost doesn't need fixing."
    - "Take corrective action on both — SPI and CPI have each drifted away from 1.00, so the schedule and the cost baselines both need corrective action."
    - "Take no action — the SPI improvement offsets the CPI decline, so overall project performance is still on track and nothing needs fixing."
  correct: A
  explanation: "Reading CPI and SPI together (not just individually) is what tells you which lever to pull — treating both as broken, or doing nothing because schedule looks fine, both misread the data."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0098
  domain: process
  topic: scope statement
  question: "A PM and business analyst are about to develop the scope statement from gathered requirements on a waterfall project. What four things does the scope statement itself contain?"
  answer: "Scope description, deliverables, acceptance criteria, and exclusions (PMBOK 7th edition, page 246)."
  choices:
    - "WBS, WBS dictionary, work packages, and control accounts."
    - "Requirements documentation, SOW, RTM, and scope management approach."
    - "Project purpose, high-level risks, summary milestones, and assigned PM."
    - "Scope description, deliverables, acceptance criteria, and exclusions."
  correct: D
  explanation: "This is distinct from the WBS/WBS dictionary (built after the scope statement), the Scope Management Plan/SOW/RTM, and the project charter/PM plan — each is a separate document in the planning sequence."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0099
  domain: process
  topic: resource management
  question: "Team members allocated to a project at 50% availability are actually spending less than half their time on it, and the PM didn't personally assign them. Who should the PM negotiate with to fix this, and why?"
  answer: "The functional managers — negotiating clear, written assignments with reliable scheduling priorities. Since the PM didn't assign the team directly, the organization is functional, and staff assignment is the functional managers' responsibility, not the sponsor's."
  choices:
    - "The sponsor — requesting additional resources to make up the shortfall; since the sponsor funds the project, the sponsor controls staffing levels and individual assignments in a functional organization."
    - "The functional managers — negotiating clear, written assignments with reliable scheduling priorities; since the PM didn't assign the team, the organization is functional and staffing is their responsibility, not the sponsor's."
    - "The team members — negotiating directly with each person to commit more hours; since the PM didn't assign them, each member individually controls how they split their time across competing projects and duties."
    - "The PMO — requesting a revised resource management plan; since the PM didn't assign the team, the PMO is solely responsible for assigning and prioritizing staff across all projects in the organization."
  correct: B
  explanation: "Asking the sponsor for more resources, adjusting deadlines, or crashing the project all skip past the actual root cause: competing priorities set by the functional managers who control the staff."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0100
  domain: process
  topic: requirements traceability
  question: "A predictive project team discovers many implemented features differ from what's in the scope statement. Which document should the PM check, and where does it sit in the planning flow?"
  answer: "The Requirements Traceability Matrix (RTM) — it maps requirements to the deliverables that satisfy them, along with issues and test results. Flow: Requirements → Scope Statement → WBS/WBS Dictionary → Execution."
  choices:
    - "The WBS dictionary — it maps requirements to the deliverables that satisfy them, plus issues and test results. Flow: Scope Statement → Requirements → WBS/WBS Dictionary → Execution."
    - "The project charter — it lists the requirements each deliverable must satisfy, plus acceptance criteria. Flow: Project Charter → Requirements → Scope Statement → Execution."
    - "The Requirements Traceability Matrix — it maps requirements to the deliverables that satisfy them, plus issues and test results. Flow: Requirements → Scope Statement → WBS/WBS Dictionary → Execution."
    - "The Requirements Traceability Matrix — it decomposes the work into work packages and control accounts. Flow: WBS/WBS Dictionary → Requirements → Scope Statement → Execution."
  correct: C
  explanation: "The RTM is the evidence trail confirming requirements were actually fulfilled (PMBOK 7th edition, page 189) — not the WBS/WBS dictionary (which organize the work) or the project charter (which authorizes the project)."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0101
  domain: process
  topic: change control
  question: "A conference sponsor requests two more attendees one day before the event, requiring PM to rearrange lodging, catering, and gift packages, even though the room technically has capacity. What should the PM do first?"
  answer: "Issue a change request to the Change Control Board (CCB), even though it came from the sponsor and even though it's last-minute."
  choices:
    - "Accept the request directly, since it came from the sponsor and the room technically has capacity."
    - "Issue a change request to the Change Control Board, even though it came from the sponsor and is last-minute."
    - "Decline the request, since last-minute changes can't be accommodated one day before the event."
    - "Make the arrangements now and submit a change request to the Change Control Board after the event."
  correct: B
  explanation: "A critical key stakeholder's request still has to go through the formal change process — auto-accepting it because it's the sponsor, or refusing it because it's late notice, both skip the CCB (PMBOK 7th edition, page 77)."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0102
  domain: process
  topic: EVM corrective action
  question: "A project's SPI is 1.10 (ahead of schedule) and CPI is 0.80 (over budget). What technique should the PM use to balance the two, and what's the tradeoff?"
  answer: "Resource leveling — spreading out resource usage (and therefore costs) over time to reduce spending spikes. The tradeoff is that it may lengthen the schedule, which is acceptable here since the project has schedule cushion to spend."
  choices:
    - "Crashing — adding resources to critical path activities to recover the cost variance; it raises short-term spending, which is acceptable given the schedule cushion."
    - "Fast-tracking — running sequential activities in parallel to bring costs down; it adds rework risk, which is acceptable given the schedule cushion available."
    - "Resource leveling — spreading resource usage (and costs) over time to reduce spending spikes; it may lengthen the schedule, which is acceptable given the schedule cushion."
    - "Management reserve — releasing reserve funds to cover the cost overrun; it doesn't affect the schedule at all, so the cushion is preserved for later use."
  correct: C
  explanation: "Crashing or fast-tracking would only make the budget problem worse (both cost more or add risk); leveling is the technique that specifically trades schedule slack for cost control."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0103
  domain: process
  topic: work authorization
  question: "Tasks on a project keep happening out of the right order at the wrong times, causing rework and hurting morale. Which PM tool addresses this directly, and why not a RACI matrix?"
  answer: "A Work Authorization System — formal documented procedures for authorizing work, ensuring it happens at the right time and in the correct sequence. A RACI matrix defines who's responsible for what, not when work is allowed to start."
  choices:
    - "A Work Authorization System — formal documented procedures ensuring work happens at the right time and in the correct sequence; a RACI defines who's responsible, not when work may start."
    - "A RACI matrix — it defines exactly when each person may start their assigned tasks; a work authorization system only records who approved each activity's budget, not its timing."
    - "An organizational chart — it clarifies reporting lines so that tasks happen in the right order; a RACI only lists stakeholders' power and interest levels on the project."
    - "A resource histogram — it shows when work should happen and in what sequence; a RACI defines who's responsible for each task, not how many hours each task will take."
  correct: A
  explanation: "Org charts and RACI matrices are responsibility/reporting tools; the work authorization system is specifically a sequencing/timing control."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0104
  domain: process
  topic: schedule compression
  question: "A sponsor tells the PM the project must finish one week earlier than agreed. Between crashing and fast-tracking, which should the PM try first, and why?"
  answer: "Fast-tracking — running originally sequential activities in parallel. It's the less costly option; crashing (adding resources) costs more, so the cheaper compression technique should be tried first when possible (PMBOK 7th edition, page 59)."
  choices:
    - "Crashing — adding resources to critical path activities; it's less costly than fast-tracking (running activities in parallel), so it should be tried first."
    - "Crashing — adding resources to critical path activities; unlike fast-tracking it adds no risk at all, so it should be tried first regardless of cost."
    - "Resource leveling — spreading resource usage evenly across the schedule; it's less costly than both crashing and fast-tracking, so it should be tried first."
    - "Fast-tracking — running originally sequential activities in parallel; it's less costly than crashing (adding resources), so it should be tried first."
  correct: D
  explanation: "Adding duration buffers or leveling resources wouldn't shorten the schedule at all, so they don't answer the sponsor's request."
  source: sources/guides/2026-09-11-predictive-pm-questions.md

- id: q-0105
  domain: people
  topic: agile vision vs sprint goal
  question: "A self-organizing team is reviewing an important Epic and members surface fundamentally different interpretations of how it should be broken down — revealing they don't share a common understanding of why the project exists. What should the PM do, and why isn't reminding them of the sprint goal enough?"
  answer: "Remind the team of the project/product vision. The sprint goal only frames the current iteration's purpose, not the overall project purpose — it can't fix a gap in understanding that sits above the sprint level."
  choices:
    - "Remind the team of the sprint goal — it states the project's overall purpose, so it is enough to resolve the team's differing interpretations of the Epic."
    - "Review the release plan with the team — it defines the project's overall purpose, which the sprint goal doesn't cover because it only frames one iteration."
    - "Revisit the Epic's acceptance criteria — they define why the project exists, which the sprint goal doesn't cover because it only frames one iteration."
    - "Remind the team of the project/product vision — the sprint goal only frames the current iteration's purpose, so it can't fix an understanding gap above the sprint level."
  correct: D
  explanation: "The release plan and the Epic's acceptance criteria have the same problem: they clarify a narrower scope (a release, or the Epic's approval conditions) but don't establish the project's overall purpose."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0106
  domain: process
  topic: sprint backlog renegotiation
  question: "Mid-sprint, a team hits unexpected technical complexity (e.g. integrating a third-party payment gateway) and realizes it won't finish all committed user stories. What should happen to the sprint backlog, and why not just cancel the sprint?"
  answer: "The team collaborates with the product owner to re-negotiate the remaining items on the sprint backlog. The sprint backlog can be clarified and adjusted mid-sprint as more is learned, keeping the sprint goal achievable without a full cancellation."
  choices:
    - "The team cancels the sprint and replans from scratch; any committed story that can't be finished invalidates the sprint, so cancellation is required to reset the team's commitments."
    - "The team collaborates with the PO to re-negotiate the remaining sprint backlog items; the sprint backlog can be adjusted mid-sprint as more is learned, keeping the goal achievable without cancelling."
    - "The scrum master removes the unfinished stories from the sprint backlog; the team keeps working on the rest without involving the PO until the sprint review, where gaps are explained."
    - "The team works overtime to finish every committed story; the sprint backlog is locked once the sprint starts, so its scope cannot change in any way before the sprint review."
  correct: B
  explanation: "Cancelling the sprint is reserved for when the sprint goal itself becomes obsolete, and only the PO can do it — a capacity/complexity surprise doesn't rise to that level."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0107
  domain: people
  topic: servant leadership and impediments
  question: "A designer hired to keep the agile team cross-functional reports that his software subscription plan is missing functionality he needs, and asks for an upgrade. What should the PM do, and what leadership style does this illustrate?"
  answer: "Reach out to the appropriate stakeholder to get the subscription upgraded. This illustrates servant leadership — the PM's job is to listen for impediments raised by team members and act to remove them, not defer the issue to a future ceremony or tell the member to work around it."
  choices:
    - "Tell the designer to find a workaround with his current plan — self-organizing leadership: team members are expected to resolve their own tool issues."
    - "Add the request to the agenda for the next retrospective — facilitative leadership: the whole team decides together on any changes to tools."
    - "Reach out to the appropriate stakeholder to get the subscription upgraded — servant leadership: listen for impediments raised by team members and act to remove them."
    - "Ask the designer to submit a change request to the CCB — directive leadership: all tool purchases must follow the formal approval process."
  correct: C
  explanation: "Telling the designer to be self-reliant, or waiting for the next retrospective, both leave a known impediment blocking the team's work instead of removing it."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0108
  domain: process
  topic: risk-value backlog prioritization
  question: "Using a risk-value matrix to prioritize a product backlog, in what order (highest to lowest priority) should these four categories of items be worked: high value/high risk, high value/low risk, low value/low risk, low value/high risk?"
  answer: "High value/low risk first, then high value/high risk, then low value/low risk, then low value/high risk last."
  choices:
    - "High value/low risk → high value/high risk → low value/low risk → low value/high risk."
    - "High value/low risk → low value/low risk → high value/high risk → low value/high risk."
    - "Low value/low risk → high value/low risk → high value/high risk → low value/high risk."
    - "High value/low risk → high value/high risk → low value/high risk → low value/low risk."
  correct: A
  explanation: "Value is weighted more heavily than risk-avoidance: the matrix pulls high-value work forward regardless of risk level, and pushes low-value work back — with low-value/high-risk items deprioritized hardest since they offer the least return for the most exposure."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0109
  domain: process
  topic: Hawthorne effect and success metrics
  question: "A team measured only by number of features shipped delivers a record volume of features, but customers start complaining about bugs. What should the product owner do, and what behavioral principle explains why measuring only feature count backfired?"
  answer: "Include customer-satisfaction and quality KPIs as product success metrics, alongside feature count. This is the Hawthorne effect (PMBOK 7th edition, page 112) — the act of measuring one thing (feature volume) shapes behavior toward that thing, at the expense of anything left unmeasured, like quality."
  choices:
    - "Add a tech-debt item to the sprint backlog to fix the reported bugs — the Pareto principle: most of the defects come from a small number of the shipped features, so fix those first."
    - "Discuss the customer complaints at the next sprint demo — Parkinson's Law: work expands to fill the time available, so the team rushed extra features in to fill each sprint."
    - "Include customer-satisfaction and quality KPIs as success metrics alongside feature count — the Hawthorne effect: measuring one thing shapes behavior toward it at the expense of what's unmeasured."
    - "Replace feature count with velocity as the sole success metric — the halo effect: strong output in one area hides weaknesses in others, such as quality, from the product owner."
  correct: C
  explanation: "Adding a tech-debt item to the sprint backlog or discussing feedback at the demo treat symptoms; they don't fix the underlying measurement system that's rewarding volume over quality."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0110
  domain: people
  topic: self-organization and buy-in
  question: "A PM carefully sequenced and assigned all the work himself to hit the iteration goal, but the team is off track halfway through — and the PM is surprised. What should he have done differently?"
  answer: "Empowered the team to self-organize — letting them handle their own task selection and prioritization — instead of sequencing and assigning the work top-down."
  choices:
    - "Empowered the team to self-organize — letting them handle their own task selection and prioritization — instead of sequencing and assigning the work top-down."
    - "Provided the team with additional technical training so they could execute his carefully planned task sequence more effectively and on time."
    - "Increased the frequency of status reporting so he could spot any deviations from his planned task sequence earlier in the iteration."
    - "Added a contingency reserve to the iteration so the team could absorb unexpected deviations from his planned task sequence and assignments."
  correct: A
  explanation: "Self-organization produces higher buy-in and motivation because it gives the team autonomy over how they accomplish their work (PMBOK 7th edition, page 249); training, better reporting, and contingency reserves don't address the root cause here, which is a lack of ownership."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0111
  domain: process
  topic: story point estimation
  question: "A team assigns a task 8 total story points by adding the developers' estimate (5) to the testers' estimate (3) separately. What's wrong with this approach?"
  answer: "Story points should be estimated for the story as a whole, not built up from separate per-role/per-segment sub-estimates."
  choices:
    - "Story points should reflect only the developers' estimate, since testing effort is excluded from relative sizing."
    - "Story points should average the per-role estimates (giving 4) rather than add them, to avoid inflating the size."
    - "Story points should be converted to hours for each role first and then summed, so they reflect real capacity."
    - "Story points should be estimated for the story as a whole, not built up from separate per-role sub-estimates."
  correct: D
  explanation: "Story points measure the total effort to deliver the whole feature; splitting the estimate by role undercuts the point of relative, whole-story estimation and makes velocity tracking inconsistent across stories."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0112
  domain: people
  topic: scaling scrum team size
  question: "A Scrum team has grown from 6 to 12 members, collaboration has gotten complicated, and standups keep running long. What should the scrum master do, and why not just tighten standup facilitation or extend its timebox?"
  answer: "Split the team into two Scrum teams and apply Scrum of Scrums to coordinate between them."
  choices:
    - "Tighten standup facilitation so each member gives a shorter update within 15 minutes."
    - "Split it into two Scrum teams and use a Scrum of Scrums to coordinate between them."
    - "Extend the standup timebox to 30 minutes so the larger team can fit in all its updates."
    - "Replace the daily standup with written status updates to save the team's meeting time."
  correct: B
  explanation: "12 members exceeds the practical maximum (~9) for a single Scrum team; tightening or extending the standup timebox treats a symptom of the team being too large rather than the underlying structural problem."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0113
  domain: process
  topic: rejected feature at sprint review
  question: "At sprint review, the product owner rejects a feature the development team demonstrated. What happens to that user story next?"
  answer: "It gets updated to address the reasons it was rejected, and is then moved back to the product backlog for reprioritization."
  choices:
    - "It's updated to address the reasons it was rejected, then moved back to the product backlog for reprioritization."
    - "It's deleted from the product backlog, since the product owner has formally rejected the feature at review."
    - "It's moved directly into the next sprint backlog so the team can fix the issues there right away."
    - "It's marked done with a defect logged against it, since the team already built and demonstrated it."
  correct: A
  explanation: "Deleting it isn't rational — the feature was already built, implying it has value; auto-moving it straight into the next sprint backlog skips the PO's reprioritization step against everything else in the backlog."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0114
  domain: process
  topic: Definition of Ready
  question: "A team member insists a user story about a rewards policy shouldn't enter the next sprint because it doesn't specify how rewards vary by employee role or position. What's the most likely reason, and what checklist does it fail?"
  answer: "The story fails the Definition of Ready (DoR) — the checklist of criteria a story must meet before it's ready to be pulled into a sprint for execution (Agile Practice Guide, page 151)."
  choices:
    - "It fails the Definition of Done — the checklist of criteria a story must meet before it can be pulled into a sprint for execution."
    - "It fails the Definition of Ready — the checklist of criteria a story must meet before it can be pulled into a sprint for execution."
    - "It fails the Definition of Done — the checklist of criteria a completed increment must meet before it is accepted at sprint review."
    - "It fails the release plan — the checklist of features and dates a story must be mapped to before it can be pulled into a sprint."
  correct: B
  explanation: "This isn't a Definition of Done issue (DoD applies at review, to a completed increment) — the story never even entered the sprint yet, so the gap is in its readiness for planning, not its completeness at delivery."
  source: sources/guides/2026-09-14-agile-pm-questions.md

- id: q-0115
  domain: process
  topic: user story quality criteria
  question: "What do the 3 C's of a user story stand for, and what does INVEST add on top of that?"
  answer: "The 3 C's are Card (the story is written down), Conversation (discussed to build shared understanding), and Confirmation (completion confirmed via acceptance criteria). INVEST is a separate quality checklist for the story itself: Independent, Negotiable, Valuable, Estimable, Small, Testable."
  choices:
    - "3 C's: Card (written down), Collaboration (built jointly by the team), Completion (meets the DoD). INVEST, a separate story-quality checklist: Independent, Negotiable, Valuable, Estimable, Small, Testable."
    - "3 C's: Card (written down), Conversation (discussed for shared understanding), Confirmation (acceptance criteria). INVEST, a separate story-quality checklist: Iterative, Necessary, Visible, Emergent, Sized, Timeboxed."
    - "3 C's: Customer (who it's for), Capability (what it does), Criteria (how it's accepted). INVEST, a separate story-quality checklist: Independent, Negotiable, Valuable, Estimable, Small, Testable."
    - "3 C's: Card (written down), Conversation (discussed for shared understanding), Confirmation (acceptance criteria). INVEST, a separate story-quality checklist: Independent, Negotiable, Valuable, Estimable, Small, Testable."
  correct: D
  explanation: "The 3 C's describe the process of creating and confirming a story; INVEST describes the qualities a well-formed story should have once written."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0116
  domain: process
  topic: backlog quality (DEEP)
  question: "What does the DEEP acronym check for when assessing whether a product backlog is healthy?"
  answer: "Detailed (appropriately — nearer-term items more so than distant ones), Emergent, Estimated, and Prioritized."
  choices:
    - "Defined completely (every item fully specified upfront), Emergent, Estimated, Prioritized."
    - "Detailed appropriately (nearer-term items more so than distant ones), Estimable, Essential, Planned."
    - "Detailed appropriately (nearer-term items more so than distant ones), Emergent, Estimated, Prioritized."
    - "Documented (each item has a written specification), Evaluated, Estimated, Predictable."
  correct: C
  explanation: "DEEP is a backlog-level quality checklist, distinct from INVEST, which checks an individual story's quality."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0117
  domain: people
  topic: Scrum values and pillars
  question: "Name Scrum's 3 pillars and its 5 values — and explain the difference between the two groupings."
  answer: "Pillars (the empirical process foundation): Transparency, Inspection, Adaptation. Values (team behavioral commitments): Commitment, Courage, Focus, Openness, Respect."
  choices:
    - "Pillars (empirical process foundation): Commitment, Courage, Focus. Values (team behavioral commitments): Transparency, Inspection, Adaptation, Openness, Respect."
    - "Pillars (empirical process foundation): Transparency, Inspection, Adaptation. Values (team behavioral commitments): Commitment, Courage, Focus, Openness, Respect."
    - "Pillars (empirical process foundation): Transparency, Inspection, Adaptation. Values (team behavioral commitments): Collaboration, Courage, Focus, Openness, Trust."
    - "Pillars (team behavioral commitments): Transparency, Inspection, Adaptation. Values (empirical process foundation): Commitment, Courage, Focus, Openness, Respect."
  correct: B
  explanation: "The pillars describe how Scrum's empirical process works; the values describe how the team is expected to behave within that process."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0118
  domain: people
  topic: T-shaped vs I-shaped team members
  question: "What's the difference between a T-shaped and an I-shaped team member, and which is generally more valuable to a cross-functional agile team?"
  answer: "T-shaped: deep expertise in one area plus workable skills in others, and more willingness to collaborate outside their specialty. I-shaped: deep expertise in only one domain, with no interest in work outside it. T-shaped members are generally more valuable to a cross-functional team."
  choices:
    - "T-shaped: broad but shallow skills across many areas, with no deep specialty of their own; I-shaped: deep expertise in only one domain. I-shaped is generally more valuable to a cross-functional team."
    - "T-shaped: deep expertise in one area plus workable skills in others; I-shaped: deep in only one domain, no interest beyond it. I-shaped is generally more valuable, since specialists reduce rework."
    - "T-shaped: deep expertise in two separate domains at once; I-shaped: deep expertise in one area plus workable skills in others, and willing to collaborate. I-shaped is generally more valuable."
    - "T-shaped: deep expertise in one area plus workable skills in others, and more willing to collaborate outside their specialty; I-shaped: deep in only one domain, no interest beyond it. T-shaped is generally more valuable."
  correct: D
  explanation: "Cross-functional teams depend on members being able to flex across work types when needed — I-shaped specialists create more single points of failure."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0119
  domain: people
  topic: servant leadership
  question: "How does servant leadership, as practiced by a Scrum Master, differ from a traditional command-and-control leadership style?"
  answer: "A servant leader's primary focus is serving and empowering team members — removing impediments and enabling the team's own decision-making — rather than directing and controlling their work."
  choices:
    - "A servant leader focuses primarily on serving and empowering team members — removing impediments and enabling the team's own decision-making — rather than directing and controlling their work."
    - "A servant leader focuses primarily on directing the team's daily tasks — assigning work and workarounds to each member — while delegating stakeholder management to the product owner."
    - "A servant leader focuses primarily on meeting the sponsor's demands — escalating every issue and reporting status upward — rather than shaping how the team does its work."
    - "A servant leader focuses primarily on staying hands-off — leaving the team to resolve all impediments on its own — rather than intervening in any way in their work."
  correct: A
  explanation: "This is why a Scrum Master resolves a blocking impediment on a team member's behalf (e.g. escalating a tool/license issue) instead of assigning them a workaround to execute."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0120
  domain: process
  topic: product vision, roadmap, and release plan
  question: "Rank product vision, product roadmap, and release plan from broadest/most strategic to narrowest/most detailed, and say who typically owns them."
  answer: "Product vision (broadest — the overall future-state 'why') → product roadmap (sequences milestones across the product's life) → release plan (narrowest — maps a specific near-term release's features and timing). The product owner owns all three."
  choices:
    - "Product roadmap (broadest — sequences milestones across the product's life) → product vision (the future-state 'why') → release plan (narrowest — a near-term release's features and timing). The PO owns all three."
    - "Product vision (broadest — the overall future-state 'why') → release plan (sequences releases across the product's life) → product roadmap (narrowest — sprint-level task detail). The scrum master owns all three."
    - "Product vision (broadest — the overall future-state 'why') → product roadmap (sequences milestones across the product's life) → release plan (narrowest — a near-term release's features and timing). The PO owns all three."
    - "Product vision (broadest — the overall future-state 'why') → product roadmap (sequences milestones across the product's life) → release plan (narrowest — a near-term release). The sponsor owns all three."
  correct: C
  explanation: "Exam scenarios often test whether you can tell these apart when a team's confusion is at the vision level (project purpose) vs. the roadmap or release level (delivery sequencing)."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0121
  domain: process
  topic: scaled agile frameworks
  question: "Name three scaled agile frameworks (beyond plain Scrum of Scrums) and what each is best suited for."
  answer: "SAFe (Scaled Agile Framework) — structured, enterprise-level agile adoption across many teams. LeSS (Large Scale Scrum) — scaling Scrum to multiple teams working on one product. Disciplined Agile (DA/DAD) — lightweight, individuals-first guidance letting each team tailor its own process."
  choices:
    - "SAFe for scaling Scrum to multiple teams on one product; LeSS for structured enterprise-wide agile across many teams; Disciplined Agile for lightweight guidance letting each team tailor its process"
    - "SAFe for structured enterprise-wide agile across many teams; Kanban for scaling Scrum to multiple teams on one product; XP for lightweight guidance letting each team tailor its process"
    - "SAFe for structured enterprise-wide agile across many teams; LeSS for scaling Scrum to multiple teams on one product; Disciplined Agile for lightweight guidance letting each team tailor its process"
    - "SAFe for structured enterprise-wide agile across many teams; LeSS for scaling Scrum to multiple teams on one product; Disciplined Agile for strict, centrally mandated processes all teams must follow"
  correct: C
  explanation: "Scrum of Scrums itself is the lightest-weight scaling technique — just coordinating multiple Scrum teams — while SAFe, LeSS, and DA are more comprehensive frameworks for scaling agile across an organization."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0122
  domain: process
  topic: estimation techniques
  question: "What's the difference between relative estimation and absolute estimation, and which one does planning poker use?"
  answer: "Relative estimation sizes an item by comparing it to other similar items (e.g. story points); absolute estimation assigns a specific time/cost/effort unit without that comparison. Planning poker is a relative-estimation technique, typically using Fibonacci-sequence cards (0, 1, 2, 3, 5, 8, 13, 21…)."
  choices:
    - "Relative estimation assigns specific hours to each item; absolute compares items against a reference story; planning poker is absolute, using Fibonacci cards"
    - "Relative estimation compares items to similar items (e.g., story points); absolute assigns specific time/cost units; planning poker is absolute, using ideal-hour cards"
    - "Relative estimation uses historical data from past projects; absolute uses expert judgment alone; planning poker is a parametric technique using Fibonacci cards"
    - "Relative estimation compares items to similar items (e.g., story points); absolute assigns specific time/cost units; planning poker is relative, using Fibonacci cards"
  correct: D
  explanation: "The growing gaps between Fibonacci numbers deliberately reflect growing uncertainty as estimates get larger, discouraging false precision on big items."
  source: sources/guides/2026-09-14-agile-pm-keywords.md

- id: q-0123
  domain: process
  topic: burndown vs burnup charts
  question: "What's the difference between a burndown chart and a burnup chart, and which direction is 'good' on each?"
  answer: "A burndown chart tracks remaining work with a downward-trending line — trending below the ideal line is good. A burnup chart tracks completed work with an upward-trending line — trending above the ideal line is good."
  choices:
    - "Burndown tracks remaining work and trending below the ideal line is good; burnup tracks completed work and trending above the ideal line is good"
    - "Burndown tracks remaining work and trending above the ideal line is good; burnup tracks completed work and trending below the ideal line is good"
    - "Burndown tracks completed work and trending below the ideal line is good; burnup tracks remaining work and trending above the ideal line is good"
    - "Both charts track remaining work, and on both charts trending above the ideal line means the team is ahead of plan"
  correct: A
  explanation: "Because the two charts plot opposite quantities (remaining vs. completed), 'ahead of plan' looks like below-the-line on one and above-the-line on the other — a common source of exam confusion."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0124
  domain: process
  topic: cumulative flow diagram
  question: "On a Cumulative Flow Diagram (CFD), how do you visually spot a work-in-progress (WIP) problem, and what two time metrics can you also read off the same chart?"
  answer: "A widening 'In Progress' band (increasing vertical thickness at a point in time) signals rising WIP. Cycle time and lead time can both be read as horizontal distances on the chart: cycle time from 'In Progress' to 'Done', lead time from 'Backlog' all the way to 'Done'."
  choices:
    - "A narrowing 'Done' band signals rising WIP; cycle time (Backlog to Done) and lead time (In Progress to Done) are read as vertical distances"
    - "A widening 'In Progress' band signals rising WIP; cycle time (In Progress to Done) and lead time (Backlog to Done) are read as horizontal distances"
    - "A widening 'In Progress' band signals rising WIP; velocity and planned value are read from the slope of the 'Done' band"
    - "A flattening 'Backlog' band signals rising WIP; cycle time (In Progress to Done) and lead time (Backlog to Done) are read as vertical distances"
  correct: B
  explanation: "The CFD's three headline metrics are throughput, WIP, and cycle time — but lead time is also directly readable as the full horizontal span."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0125
  domain: process
  topic: lead time vs cycle time
  question: "Define lead time and cycle time, and say which one is always the larger (or equal) value."
  answer: "Lead time is the duration from a task's creation to its completion (Task Created → Work Completed). Cycle time is the duration from when work starts to when it's completed (Work Started → Work Completed). Lead time is always greater than or equal to cycle time, since cycle time is the portion of lead time after work actually begins."
  choices:
    - "Lead time runs from work start to completion; cycle time runs from task creation to completion; cycle time is always greater than or equal to lead time"
    - "Lead time runs from task creation to work start; cycle time runs from work start to completion; the two always add up to takt time"
    - "Lead time runs from task creation to completion; cycle time runs from work start to completion; lead time is always greater than or equal to cycle time"
    - "Lead time runs from task creation to completion; cycle time runs from work start to completion; cycle time is always greater than or equal to lead time"
  correct: C
  explanation: "A task can sit in a backlog for a long time (adding to lead time) before work on it ever starts (which is when the cycle time clock begins)."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0126
  domain: process
  topic: throughput chart
  question: "What does a throughput chart typically compare per sprint, and what does a persistent gap between the two bars tell you?"
  answer: "It typically compares story points committed vs. story points of work completed, per sprint (as a bar or scatter chart). A persistent gap where completed is well below committed signals the team is over-committing relative to its actual delivery capacity."
  choices:
    - "Story points committed vs. completed per sprint; a persistent shortfall in completed points means the team is over-committing relative to its capacity"
    - "Planned value vs. earned value per sprint; a persistent shortfall in earned value means the project is running over its approved budget"
    - "Story points committed vs. completed per sprint; a persistent shortfall in completed points means more team members must be added"
    - "Defects found vs. defects fixed per sprint; a persistent gap means the team is accumulating technical debt faster than it repays it"
  correct: A
  explanation: "This is the agile-project analog of comparing planned vs. actual — but tracked per-sprint rather than cumulatively like EVM's PV/EV."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0127
  domain: process
  topic: escaped defects
  question: "What are escaped defects, and what does a rising escaped-defects trend over several months most likely indicate?"
  answer: "Escaped defects are defects the agile team missed — or didn't find — during development, which end-users then discover after the product releases. A rising trend most likely indicates a growing testing/quality gap upstream of release, not just increased support volume."
  choices:
    - "Defects the team found during sprint testing before release; a rising trend means testing is improving and catching more issues earlier"
    - "Defects the team missed during development that end-users find after release; a rising trend mainly reflects higher support volume from more users"
    - "Defects deferred to the backlog instead of fixed in the sprint; a rising trend means the product owner is deprioritizing quality work"
    - "Defects the team missed during development that end-users find after release; a rising trend points to a growing testing/quality gap upstream of release"
  correct: D
  explanation: "Because escaped defects are counted per unit of time (or per sprint/release), a sustained rise points to a systemic quality issue rather than one bad sprint."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0128
  domain: process
  topic: empirical measurement
  question: "What does 'empirical measurement' mean in an agile context, and how does it contrast with how traditional/predictive projects typically measure performance?"
  answer: "Empirical measurement means making decisions based on direct observation and experimentation — a realistic, current view of actual project progress. Traditional/predictive measurement instead focuses mainly on predictions and outputs (e.g. planned-value baselines)."
  choices:
    - "Decisions based on forecasts and baselines set during planning; predictive measurement instead focuses on direct observation and experimentation with the actual work as it is completed"
    - "Decisions based on direct observation and experimentation, giving a realistic current view of progress; predictive measurement focuses mainly on predictions and outputs like planned-value baselines"
    - "Decisions based on statistical sampling of completed deliverables against acceptance criteria; predictive measurement instead focuses on team self-assessment during sprint retrospectives"
    - "Decisions based on stakeholder satisfaction surveys collected at the end of each sprint; predictive measurement instead focuses on periodic audits of process compliance"
  correct: B
  explanation: "This is why agile KPIs (burn charts, CFDs, throughput, escaped defects) are all built from actually-observed work, rather than from a pre-set baseline like EVM's PV curve."
  source: sources/guides/2026-09-14-agile-performance-measurement.md

- id: q-0129
  domain: process
  topic: procurement issue triage
  question: "A supplier tells the PM a steel-bar order may be delayed 3 days. What should the PM do first, and why not immediately renegotiate with the vendor or find a new one?"
  answer: "Evaluate the impact of the delay first — a delayed activity doesn't automatically delay the whole project."
  choices:
    - "Evaluate the impact of the delay first, since a delayed activity doesn't automatically delay the whole project"
    - "Renegotiate delivery terms with the supplier first, since the contract obligates them to deliver on time"
    - "Escalate to the sponsor first, since any supplier delay puts the project's finish date at risk"
    - "Start sourcing an alternate supplier first, since a three-day delay signals an unreliable vendor"
  correct: A
  explanation: "If the activity isn't on the critical path, or has more lag than the delay itself, the project finish date may not move at all — jumping straight to negotiation or vendor replacement skips the impact analysis that should drive the decision."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0130
  domain: process
  topic: contract as source of truth for payment
  question: "A vendor calls a newly assigned PM claiming 50% completion and requesting payment. Which document should the PM check to verify how much (if anything) is owed, and why not the RFP or the vendor's bid response?"
  answer: "The contract — a mutually binding agreement obligating the seller to deliver and the buyer to pay a predetermined amount on an agreed schedule (PMBOK 7th edition, page 191)."
  choices:
    - "The RFP, because it defines the buyer's original requirements and the payment terms offered to all bidders"
    - "The contract, because it is the mutually binding agreement that sets the predetermined payment amount and schedule"
    - "The vendor's bid response, because it contains the seller's quoted pricing and proposed payment milestones"
    - "The vendor's progress report, because it documents the completed work that the payment request is based on"
  correct: B
  explanation: "The RFP is just the buyer's original request; the seller's bid/proposal may have changed during negotiation before the contract was signed — only the signed contract reflects the final, binding payment terms."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0131
  domain: process
  topic: bidder conference scope
  question: "During a bidder conference, which two things does the PM actually do, and which two things does the PM NOT do there?"
  answer: "Does: clarify doubts, and explain the bid terms and conditions. Does NOT: shortlist prospective sellers, or award the contract."
  choices:
    - "Does: clarify doubts and explain bid terms and conditions. Does not: shortlist sellers or award the contract"
    - "Does: clarify doubts and shortlist sellers. Does not: explain bid terms and conditions or award the contract"
    - "Does: explain bid terms and conditions and award the contract. Does not: clarify doubts or shortlist sellers"
    - "Does: shortlist sellers and award the contract. Does not: clarify doubts or explain bid terms and conditions"
  correct: A
  explanation: "A bidder conference (PMBOK 7th edition, page 70) exists purely to give all potential sellers a common, equal understanding of requirements before they bid — shortlisting and awarding happen later, as separate steps."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0132
  domain: process
  topic: high-value procurement approval
  question: "After scoring vendor proposals and selecting a winner for a complex, high-value, high-risk bridge-repair contract, what should the PM do next, before finalizing the award?"
  answer: "Seek senior/organizational management approval to finalize the contract award."
  choices:
    - "Issue the contract award immediately, since the team's scoring already picked the winner"
    - "Hold a bidder conference with the winning seller to finalize the contract terms"
    - "Send the winner a Letter of Intent and authorize them to begin the work"
    - "Seek senior/organizational management approval to finalize the contract award"
  correct: D
  explanation: "Complex, high-value, high-risk procurements generally require senior management sign-off before award (Process Groups: A Practice Guide (2022), page 238) — on top of, not instead of, the team's own scoring."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0133
  domain: process
  topic: contract type identification
  question: "A seller is awarded an 18-month building contract for one agreed total of $715,500. What contract type is this, and how would you tell it apart from a Time & Material contract?"
  answer: "Fixed-Price — one set total price for defined work, regardless of the seller's actual incurred costs. T&M instead quotes a rate (hourly, etc.) plus materials, without one fixed total."
  choices:
    - "Fixed-Price: one set total for defined work regardless of the seller's costs; T&M instead quotes a rate plus materials with no fixed total"
    - "Time & Material: an agreed rate over 18 months; Fixed-Price instead quotes a rate plus materials capped by a ceiling price"
    - "Cost-Plus-Fixed-Fee: costs reimbursed plus a set fee; T&M instead quotes one fixed total for clearly defined work"
    - "Fixed-Price: one set total adjusted for the seller's actual costs; T&M instead quotes one fixed total for undefined work"
  correct: A
  explanation: "The exam tell for Fixed-Price is a single agreed total tied to a defined scope; T&M's tell is a rate without a precise, complete statement of work."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0134
  domain: process
  topic: buyer vs seller procurement documents
  question: "Of these four procurement documents — proposals, source selection criteria, request for quotes, purchase order — which one is the PM (as buyer) NOT responsible for issuing, and who issues it instead?"
  answer: "Proposals — those are prepared by the seller, in response to the buyer's request for quotes."
  choices:
    - "Source selection criteria, which are prepared by the seller to show how it meets the buyer's needs"
    - "Proposals, which are prepared by the seller in response to the buyer's request for quotes"
    - "The purchase order, which is issued by the seller to confirm acceptance of the buyer's terms"
    - "The request for quotes, which is issued by the seller to advertise its pricing to potential buyers"
  correct: B
  explanation: "Source selection criteria, the RFQ, and the purchase order are all buyer-side documents; the proposal is the seller's response to the RFQ, not something the buyer creates."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0135
  domain: process
  topic: contract and project closure sequencing
  question: "A PM has closed every contract on a project except one where the only remaining step is a quick expert inspection — and the equipment is already known to be working fine. Should the PM close the contract and project now to save time?"
  answer: "No — keep both the contract and the project open until the seller actually performs the inspection."
  choices:
    - "Yes: close both now, since the equipment is already known to be working fine and time is short"
    - "No: keep both the contract and the project open until the seller actually performs the inspection"
    - "Partly: close the project now and leave only that one contract open until the inspection happens"
    - "Partly: close the contract now and record the waived inspection in the lessons learned register"
  correct: B
  explanation: "Closing a contract requires verifying the seller delivered exactly as specified in the contract, and closing a project requires all its contracts to be closed first — skipping the inspection isn't a valid shortcut even under time pressure."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0136
  domain: process
  topic: supplier conflict resolution sequencing
  question: "Escalating conflicts between the project team and a supplier's team are starting to hurt the project. What should the PM do first, and why is that better than an email or phone call?"
  answer: "Meet face-to-face with the supplier's team manager to discuss the issue — a face-to-face meeting is always the more effective first step for resolving conflict than email or phone."
  choices:
    - "Meet face-to-face with the supplier's team manager, since in-person discussion resolves conflict better than email or phone"
    - "Start mediation under ADR right away, since a neutral third party resolves conflict better than email or phone"
    - "Escalate to the sponsor to step in, since senior authority resolves conflict better than email or phone"
    - "Send the supplier a formal written notice, since documented communication resolves conflict better than a phone call"
  correct: A
  explanation: "If direct, in-person negotiation fails, the next step is Alternative Dispute Resolution (mediation, arbitration) — not jumping straight to ADR before trying direct discussion."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0137
  domain: process
  topic: implementing an approved change exactly as specified
  question: "A PM receives an approved change request to replace (not repair) a defective battery component near the end of a project. What should the PM do, and why not repair it instead to save time?"
  answer: "Replace the component, exactly as the approved change request specifies."
  choices:
    - "Repair the component to save time, then note the deviation in the change log"
    - "Defer the replacement to a follow-on project, since this one is nearly complete"
    - "Replace the component exactly as the approved change request specifies"
    - "Repair the component now and schedule the full replacement after project closure"
  correct: C
  explanation: "Once a change request is approved, the PM's job is faithful implementation as approved — substituting a different fix (repair instead of replace) isn't the PM's call to make unilaterally."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0138
  domain: process
  topic: sponsor-directed termination
  question: "A sponsor asks the PM to terminate a project midway through execution for a reason external to the contract (e.g. a nearby dam making the project's outcome unappealing). Should the PM push back, negotiate to continue, or proceed with claims administration?"
  answer: "None of those — the PM should simply follow the sponsor's instruction and start the close-project process."
  choices:
    - "Follow the sponsor's instruction and start the close-project process"
    - "Initiate claims administration to recover costs from the early termination"
    - "Negotiate with the sponsor to continue, since execution is already midway"
    - "Push back and ask the sponsor to reconsider until the deliverables are done"
  correct: A
  explanation: "There's no contract dispute in play here, so claims administration doesn't apply; when a sponsor decides to terminate for any reason, the PM's role is to execute that decision, not negotiate against it."
  source: sources/guides/2026-09-15-procurement-contract-questions.md

- id: q-0139
  domain: process
  topic: Alternative Dispute Resolution (ADR)
  question: "What is Alternative Dispute Resolution (ADR), and which specific techniques does it cover?"
  answer: "ADR is the umbrella term for resolving disputes outside courtroom litigation — covering mediation, adjudication, expert determination, and arbitration."
  choices:
    - "Resolving disputes through the court system, covering litigation, injunctions, adjudication, and arbitration"
    - "Resolving disputes outside courtroom litigation, covering negotiation, escalation, claims administration, and audits"
    - "Resolving disputes within the project team, covering smoothing, forcing, compromising, and collaborating"
    - "Resolving disputes outside courtroom litigation, covering mediation, adjudication, expert determination, and arbitration"
  correct: D
  explanation: "ADR sits in the middle of the dispute resolution ladder: after negotiation has been tried and failed, but before resorting to litigation."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0140
  domain: process
  topic: cost-reimbursable contract subtypes
  question: "Name the three main Cost-Reimbursable contract subtypes and what distinguishes each one's fee structure."
  answer: "CPFF (Cost Plus Fixed Fee) — a flat fee regardless of performance. CPAF (Cost Plus Award Fee) — an extra fee based on satisfying the client's performance criteria. CPIF (Cost Plus Incentive Fee) — an extra fee based on meeting predefined performance targets."
  choices:
    - "CPFF: a fee that varies with performance targets. CPAF: a flat fee regardless of performance. CPIF: an extra fee for satisfying the client's subjective criteria"
    - "CPFF: a flat fee regardless of performance. CPAF: a fee calculated as a percentage of actual costs. CPIF: an extra fee for meeting predefined performance targets"
    - "CPFF: a fixed total price that includes all costs. CPAF: an extra fee for satisfying the client's performance criteria. CPIF: an hourly rate plus materials"
    - "CPFF: a flat fee regardless of performance. CPAF: an extra fee for satisfying the client's performance criteria. CPIF: an extra fee for meeting predefined performance targets"
  correct: D
  explanation: "All three reimburse the seller's legitimate costs; they differ only in how the profit fee on top of those costs is determined."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0141
  domain: process
  topic: Force Majeure
  question: "What is a Force Majeure (Acts of God) clause, and what kind of events does it cover?"
  answer: "It covers unforeseeable circumstances beyond either party's control — such as natural disasters or wars — that excuse contractual performance."
  choices:
    - "A seller's failure to perform without a legal excuse, such as missed deadlines, that entitles the buyer to damages"
    - "Foreseeable risks identified in the risk register, such as supply shortages, that are transferred to the seller"
    - "Delays caused by the buyer, such as late approvals or design changes, that extend the seller's schedule"
    - "Unforeseeable circumstances beyond either party's control, such as natural disasters or wars, that excuse contractual performance"
  correct: D
  explanation: "Force Majeure is distinct from a breach of contract, which requires a failure to perform without a legal excuse — an Act of God is exactly that legal excuse."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0142
  domain: process
  topic: Letter of Intent
  question: "What is a Letter of Intent, and how is it different from the signed contract itself?"
  answer: "A Letter of Intent confirms a contract award to a contractor while formal contract documents are still pending signature — it's a pre-cursor to the binding contract, not the contract itself."
  choices:
    - "It is the signed, binding contract itself, issued once all formal terms, deliverables, and payment obligations have been finalized"
    - "It invites potential sellers to submit proposals for the work; it precedes the bidder conference and is not the contract itself"
    - "It confirms a contract award while formal contract documents await signature; it precedes the binding contract and is not the contract itself"
    - "It confirms a contract award and is fully binding on its own, replacing the need for formal contract documents and signatures"
  correct: C
  explanation: "Relying on a Letter of Intent instead of the final signed contract for terms like payment obligations would be a mistake, since it's issued before the formal terms are finalized."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0143
  domain: process
  topic: MOA vs MOU
  question: "What's the difference between a Memorandum of Agreement (MOA) and a Memorandum of Understanding (MOU)?"
  answer: "An MOA describes the background, assumptions, and agreements between two parties. An MOU describes an agreement for a cooperative effort between two parties — generally less formal/binding than an MOA or a full contract."
  choices:
    - "An MOU describes the background, assumptions, and agreements between two parties; an MOA describes a cooperative effort and is generally less formal than an MOU"
    - "An MOA is a fully binding contract with payment terms enforceable in court; an MOU is the seller's formal proposal submitted in response to an RFP"
    - "An MOA describes the background, assumptions, and agreements between two parties; an MOU describes a cooperative effort and is generally less formal than an MOA"
    - "An MOA and an MOU are interchangeable names for the same document, and both are fully binding in the same way as a signed contract"
  correct: C
  explanation: "Both sit below a binding contract in formality, but an MOA is more detailed about the specific agreed terms than an MOU's broader statement of cooperative intent."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0144
  domain: process
  topic: Retainage
  question: "What is retainage (holdback) in a contract, and why would a buyer want it?"
  answer: "A portion of a contract payment held back until contract completion, to ensure the seller fully performs the contract terms."
  choices:
    - "A pre-defined amount the seller pays for delays, so the buyer avoids having to prove actual damages in court"
    - "A portion of each payment held back until contract completion, to ensure the seller fully performs the contract terms"
    - "An advance payment made before work begins, to help the seller mobilize the resources needed for the work"
    - "A bonus fee paid for early completion, to give the seller an incentive to finish ahead of the schedule"
  correct: B
  explanation: "It gives the buyer leverage: the seller has a financial incentive to finish and satisfy all requirements, since part of their payment is withheld until then."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0145
  domain: process
  topic: make-or-buy analysis timing
  question: "A PM has already received several supplier proposals for physical resources. Is it still appropriate to run a make-or-buy analysis at this point?"
  answer: "No — make-or-buy analysis should already have happened before proposals were solicited; at the proposal-comparison stage, the right tool is selection criteria."
  choices:
    - "Yes: make-or-buy belongs after proposals arrive, since vendor prices are needed to compare against internal costs"
    - "No: make-or-buy should have happened before proposals were solicited; at this stage the right tool is a bidder conference"
    - "Yes: make-or-buy is repeated at every procurement stage and is used alongside the selection criteria"
    - "No: make-or-buy should have happened before proposals were solicited; at this stage the right tool is selection criteria"
  correct: D
  explanation: "Make-or-buy decides whether to build internally or purchase externally in the first place; once proposals are in hand, that decision has already been made and the task is now comparing sellers against selection criteria."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0146
  domain: process
  topic: RFP vs RFQ vs RFI
  question: "When would a PM issue an RFI instead of an RFQ or RFP?"
  answer: "An RFI is used when the PM needs more general information from sellers before deciding what to formally request — it comes before an RFQ (pricing on a well-defined item) or an RFP (a full proposed approach for less-defined, complex work)."
  choices:
    - "When pricing is needed on a well-defined item with fixed specifications; it follows an RFQ (general information) or RFP (approach for complex work)"
    - "When a full proposed approach is needed for complex, less-defined work; it replaces an RFQ (pricing on well-defined items) or RFP (general information)"
    - "When general information is needed before deciding what to formally request; it precedes an RFQ (pricing on well-defined items) or RFP (approach for complex work)"
    - "When the contract is ready to award and final terms must be confirmed with the winning seller; it follows an RFQ (pricing) or RFP (approach for complex work)"
  correct: C
  explanation: "The three form a progression of specificity: RFI (learn) -> RFQ or RFP (formally solicit), chosen based on how well-defined the need already is."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0147
  domain: process
  topic: single source vs sole source
  question: "What's the difference between 'single source' and 'sole source' procurement?"
  answer: "Single source: the buyer chooses to use only one supplier even though other vendors are available. Sole source: only one provider in the market could actually fulfill the requirement at all."
  choices:
    - "Single source: the buyer chooses one supplier though others exist. Sole source: only one provider in the market can fulfill the need"
    - "Single source: only one provider in the market can fulfill the need. Sole source: the buyer chooses one supplier though others exist"
    - "Single source: one supplier provides every item on the project. Sole source: one supplier is chosen through open competitive bidding"
    - "Single source: the buyer chooses one supplier though others exist. Sole source: the seller subcontracts all work to only one vendor"
  correct: A
  explanation: "Single source is a buyer's choice (e.g. for an existing relationship or standardization); sole source is a market fact the buyer has no alternative to."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0148
  domain: process
  topic: centralized vs decentralized procurement
  question: "What's the difference between centralized and decentralized procurement, and what's a tradeoff of each?"
  answer: "Centralized: one department manages purchasing for the whole organization (more consistency/control, less local flexibility). Decentralized: individual stakeholders/departments purchase for themselves (more flexibility/speed, less consistency)."
  choices:
    - "Centralized: departments buy for themselves (more consistency, less flexibility). Decentralized: one department buys for the whole organization (more flexibility, less consistency)"
    - "Centralized: one department buys for the whole organization (more flexibility, less consistency). Decentralized: departments buy for themselves (more consistency, less flexibility)"
    - "Centralized: the PM buys everything for the project (more speed, less oversight). Decentralized: the sponsor selects every vendor (more oversight, less speed)"
    - "Centralized: one department buys for the whole organization (more consistency, less flexibility). Decentralized: departments buy for themselves (more flexibility, less consistency)"
  correct: D
  explanation: "Neither is universally correct — the choice depends on the organization's need for standardization versus responsiveness."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0149
  domain: process
  topic: exit criteria (procurement)
  question: "In procurement screening, what are 'exit criteria,' and how are they different from a project's phase-exit or kill-point criteria?"
  answer: "Exit criteria are the conditions a seller's proposal must meet just to be considered at all — fail them, and the proposal is rejected outright before scoring even begins. This is a different concept from a project/phase's closure or kill-point review, which evaluates the project itself, not a vendor's proposal."
  choices:
    - "Pass/fail conditions a seller's proposal must meet to be considered at all; unlike phase-exit or kill-point criteria, they evaluate a vendor's proposal, not the project"
    - "Conditions a seller must meet to exit the contract early; unlike phase-exit or kill-point criteria, they evaluate the seller's delivery performance, not the project"
    - "Weighted scoring criteria used to rank proposals after screening; they are the same concept as a project's phase-exit or kill-point criteria"
    - "Conditions the project must meet to close out a procurement phase; they are the same concept as a project's phase-exit or kill-point criteria"
  correct: A
  explanation: "Mixing these two up is a common trap — procurement exit criteria are a pass/fail screening gate for sellers, not a project-governance milestone."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0150
  domain: process
  topic: tendering methods
  question: "What's the difference between open tendering, selective (restricted) tendering, and negotiated tendering?"
  answer: "Open tendering: a public announcement, anyone can bid. Selective tendering: only vendors personally invited by the buyer can bid. Negotiated tendering: the buyer approaches a single supplier directly, with no competitive bidding at all."
  choices:
    - "Open: only vendors invited by the buyer can bid. Selective: public announcement, anyone can bid. Negotiated: the buyer approaches one supplier directly, with no competitive bidding"
    - "Open: public announcement, anyone can bid. Selective: only vendors invited by the buyer can bid. Negotiated: shortlisted bidders revise their prices in competitive rounds"
    - "Open: public announcement, anyone can bid. Selective: the buyer approaches one supplier directly. Negotiated: only vendors invited by the buyer can bid"
    - "Open: public announcement, anyone can bid. Selective: only vendors invited by the buyer can bid. Negotiated: the buyer approaches one supplier directly, with no competitive bidding"
  correct: D
  explanation: "These three represent decreasing levels of competition, in that order — open has the most competitive pressure, negotiated has none."
  source: sources/guides/2026-09-15-procurement-management-keywords.md

- id: q-0151
  domain: process
  topic: dispute resolution ladder order
  question: "List the six dispute resolution techniques in order from least to most formal/costly."
  answer: "Negotiation, Mediation, Adjudication, Expert determination, Arbitration, Litigation."
  choices:
    - "Negotiation, Arbitration, Mediation, Adjudication, Expert determination, Litigation"
    - "Negotiation, Mediation, Adjudication, Expert determination, Arbitration, Litigation"
    - "Mediation, Negotiation, Expert determination, Adjudication, Litigation, Arbitration"
    - "Negotiation, Mediation, Arbitration, Expert determination, Adjudication, Litigation"
  correct: B
  explanation: "Parties should generally try each rung before escalating to the next — jumping straight to arbitration or litigation without attempting negotiation first is rarely the right exam answer."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0152
  domain: process
  topic: mediation vs arbitration
  question: "What's the key structural difference between mediation and arbitration?"
  answer: "In mediation, the neutral third party (mediator) only helps the parties reach their own agreement. In arbitration, the neutral third party (arbitrator) reviews both sides and imposes a binding decision."
  choices:
    - "A mediator reviews both sides and imposes a binding decision; an arbitrator only helps the parties reach their own agreement"
    - "A mediator only helps the parties reach their own agreement; an arbitrator reviews both sides and imposes a binding decision"
    - "A mediator is a court-appointed judge who issues a ruling; an arbitrator is a project team member who facilitates discussion"
    - "A mediator and an arbitrator both impose binding decisions; mediation is simply the version used for smaller disputes"
  correct: B
  explanation: "Mediation preserves party control over the outcome; arbitration hands that control to a third party, which is why arbitration sits higher on the formality ladder."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0153
  domain: process
  topic: adjudication vs expert determination
  question: "How does adjudication differ from expert determination as a dispute resolution technique?"
  answer: "Adjudication uses an impartial third party who reviews evidence and arguments broadly to decide a dispute. Expert determination uses an independent expert chosen specifically for specialized subject-matter knowledge relevant to the dispute."
  choices:
    - "Adjudication uses an independent expert chosen for specialized subject-matter knowledge; expert determination uses an impartial third party who reviews evidence and arguments broadly"
    - "Adjudication only helps the parties reach their own agreement without a decision; expert determination imposes a ruling through a court of law"
    - "Adjudication uses an impartial third party who reviews evidence and arguments broadly; expert determination uses an independent expert chosen for specialized subject-matter knowledge"
    - "Adjudication is decided by the project sponsor after hearing both parties; expert determination is decided by a vote of the project's subject-matter experts"
  correct: C
  explanation: "The distinguishing factor is the decision-maker's role: a general impartial adjudicator versus a subject-matter expert appointed for their specific expertise."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0154
  domain: process
  topic: litigation as last resort
  question: "Why is litigation described as the 'last resort' among dispute resolution techniques?"
  answer: "Because it's the most costly, slowest, and most adversarial option, and every less formal technique (negotiation, mediation, adjudication, expert determination, arbitration) should be attempted first."
  choices:
    - "It is the least binding option, so its rulings can be appealed indefinitely and rarely settle the dispute"
    - "It can only be used after the contract has been formally closed and the final payment has been made"
    - "It is the most costly, slowest, and most adversarial option, so all less formal techniques should be tried first"
    - "It is reserved for disputes above a set dollar value, so smaller claims must always go to arbitration"
  correct: C
  explanation: "This is also why many contracts include a dispute resolution clause specifically to keep disputes out of court where possible."
  source: sources/guides/2026-09-15-dispute-resolution-techniques.md

- id: q-0155
  domain: process
  topic: risk-conflict-claim-dispute escalation
  question: "Trace how an unmanaged project risk can eventually turn into a full dispute, naming each intermediate stage."
  answer: "Risk (an uncertain event/condition) -> if not managed, becomes a Conflict (a disagreement between parties) -> if the conflict escalates and interests feel unaddressed, becomes a Claim (a formal request/demand) -> if the claim remains unresolved, becomes a Dispute requiring formal resolution."
  choices:
    - "Risk -> Claim (formal request or demand) -> Conflict (disagreement between parties) -> Dispute requiring formal resolution"
    - "Risk -> Issue (realized risk) -> Change Request (formal demand) -> Dispute requiring formal resolution"
    - "Conflict -> Risk (uncertain event) -> Dispute (disagreement between parties) -> Claim requiring formal resolution"
    - "Risk -> Conflict (disagreement between parties) -> Claim (formal request or demand) -> Dispute requiring formal resolution"
  correct: D
  explanation: "Each stage is a missed opportunity for prevention — this is why claim prevention (managing risks early) is the first stage of the claims management process, not an afterthought."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0156
  domain: process
  topic: claims management process stages
  question: "Name the four stages of the claims management process and what each one involves."
  answer: "Claim Prevention (identifying risks and preventing them from escalating), Claim Mitigation (documentation, change-order processes, and a Dispute Resolution Board set up in advance), Pursuing Claims (claim identification/documentation and quantification of compensation or time sought), and Claim Resolution (resolving the claim and/or closing the contract)."
  choices:
    - "Claim Identification (log claims as they arise), Claim Mitigation (documentation, change orders, DRB set up in advance), Claim Arbitration (binding decision), Claim Litigation (court ruling)"
    - "Claim Prevention (manage risks early), Claim Escalation (notify the sponsor and legal team), Pursuing Claims (identify, document, quantify), Claim Resolution (resolve and/or close contract)"
    - "Claim Prevention (manage risks early), Claim Mitigation (documentation, change orders, DRB set up in advance), Pursuing Claims (identify, document, quantify), Claim Resolution (resolve and/or close contract)"
    - "Claim Prevention (manage risks early), Claim Mitigation (DRB set up only after a dispute arises), Pursuing Claims (identify, document, quantify), Claim Audit (verify all payments made)"
  correct: C
  explanation: "These stages overlap rather than run strictly sequentially — Claim Mitigation, for example, starts during Pre-award and continues well into Contract Execution."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0157
  domain: process
  topic: common causes of claims and disputes
  question: "Name three common factors that lead to claims and disputes on a project."
  answer: "Any three of: failure to understand or comply with a contractual obligation; errors or omissions in the contract document; an unrealistic contract duration or completion date."
  choices:
    - "Failure to understand or comply with a contractual obligation; errors or omissions in the contract document; an unrealistic contract duration or completion date"
    - "Choosing a fixed-price contract type; including a liquidated damages clause for late delivery; adding a retainage provision to the contract's payment terms"
    - "Holding a bidder conference before bidding opens; issuing an RFI before the RFP; scoring seller proposals with weighted source selection criteria"
    - "Setting up a Dispute Resolution Board in advance; including a time-barred notice clause; documenting every change order in writing as it is approved"
  correct: A
  explanation: "Two of these three root causes trace back to problems baked into the contract itself at formation — which is why careful contract drafting is itself a claim-prevention technique."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0158
  domain: process
  topic: Dispute Resolution Board
  question: "What is a Dispute Resolution Board (DRB), and at which stage of claims management is it set up?"
  answer: "A standing panel established in advance to help resolve disputes as they arise, without resorting to arbitration or litigation — it's set up during the Claim Mitigation stage, not reactively after a dispute has already happened."
  choices:
    - "A court-appointed panel convened after a dispute fails in arbitration; established during Claim Resolution"
    - "A standing panel set up in advance to resolve disputes as they arise without arbitration or litigation; established during Claim Mitigation"
    - "A standing panel set up in advance to resolve disputes as they arise without arbitration or litigation; established during Claim Resolution"
    - "A change control board that reviews and approves contract change orders; established during Claim Prevention"
  correct: B
  explanation: "Setting up a DRB proactively (like a claims resolution guideline) is a claim-mitigation technique — a common exam trap is trying to set one up only after a dispute is already underway."
  source: sources/guides/2026-09-15-claims-management.md

- id: q-0159
  domain: process
  topic: liquidated damages clause
  question: "A contract needs a way to charge the contractor for delays without the buyer having to prove the actual dollar amount of harm caused. Which contract clause covers this, and how does it work?"
  answer: "The liquidated damages clause — a pre-defined amount payable for specific damages (like delays), substituting for having to prove actual damages in court."
  choices:
    - "Indemnity clause: a pre-defined amount payable for specific damages like delays, substituting for proving actual damages"
    - "Liquidated damages clause: a pre-defined amount payable for specific damages like delays, substituting for proving actual damages"
    - "Termination clause: lets the buyer end the contract over delays and recover actual damages once proven in court"
    - "Retainage clause: holds back part of each payment until the buyer proves the actual dollar cost of the delays"
  correct: B
  explanation: "This is different from a termination clause (which governs ending the contract) or an indemnity clause (which transfers risk for loss/damage more broadly)."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0160
  domain: process
  topic: time-barred clause
  question: "A contractor tries to file a claim for extra costs two years after the triggering event, but the contract sets a one-year deadline for claims. What clause governs this, and what's the outcome?"
  answer: "The time-barred clause — since the claim is filed past the contract's deadline for claims, it is not admissible."
  choices:
    - "The time-barred clause; the claim is still admissible because the extra costs were actually incurred"
    - "The Force Majeure clause; the claim is admissible because the late filing was beyond the contractor's control"
    - "The time-barred clause; because the claim was filed past the contract's one-year deadline, it is not admissible"
    - "The liquidated damages clause; the claim is reduced to a pre-defined amount because it was filed late"
  correct: C
  explanation: "A time-barred clause exists specifically to close off stale claims, protecting both parties from indefinite exposure to old issues."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0161
  domain: process
  topic: indemnity clause
  question: "What does an indemnity clause do, and how is it different from a liquidated damages clause?"
  answer: "An indemnity clause transfers risk — it secures one party against loss or damage and defines the events/process that trigger that protection. Liquidated damages instead pre-sets a specific dollar amount payable for a specific type of damage (like delay), without needing to prove actual loss."
  choices:
    - "Indemnity transfers risk, securing one party against loss or damage under defined triggers; liquidated damages pre-sets an amount for a specific damage like delay, without proving actual loss"
    - "Indemnity pre-sets an amount for a specific damage like delay, without proving actual loss; liquidated damages transfers risk, securing one party against loss or damage under defined triggers"
    - "Indemnity defines when and how the contract itself may be ended; liquidated damages pre-sets an amount for a specific damage like delay, without proving actual loss"
    - "Indemnity excuses performance for events beyond either party's control; liquidated damages requires proving the actual loss in court before any payment"
  correct: A
  explanation: "Indemnity is about risk transfer/protection generally; liquidated damages is a narrower, pre-agreed payout mechanism for a specific breach type."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0162
  domain: process
  topic: change clause components
  question: "What three things does a contract's change clause typically define?"
  answer: "What can be changed, the change-order process to follow, and how a new price will be established once a change is made."
  choices:
    - "What can be changed, the change-order process to follow, and how a new price will be established"
    - "Who sits on the change control board, how changes are logged, and when the baseline is re-approved"
    - "What can be changed, the change-order process to follow, and how disputes over changes go to court"
    - "What can be changed, the deadline for filing claims, and how the contract itself can be terminated"
  correct: A
  explanation: "This is the contract-level counterpart to the project's integrated change control process — the change clause governs how changes get priced and processed under the contract itself."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0163
  domain: process
  topic: dispute resolution clause vs termination clause
  question: "A PM ending a difficult supplier relationship needs to check two different contract clauses. Which clause covers how to resolve outstanding claims without going to court, and which covers ending the relationship itself?"
  answer: "The dispute resolution clause covers the ADR process and when a dispute escalates to court; the termination clause defines when and how the contract itself can be ended."
  choices:
    - "Termination clause covers the ADR process and escalation to court; dispute resolution clause defines when and how the contract can be ended"
    - "Change clause covers the ADR process and escalation to court; Force Majeure clause defines when and how the contract can be ended"
    - "Dispute resolution clause covers the ADR process and escalation to court; termination clause defines when and how the contract can be ended"
    - "Indemnity clause covers the ADR process and escalation to court; time-barred clause defines when and how the contract can be ended"
  correct: C
  explanation: "A contract commonly includes both clauses together, since ending a relationship and resolving any outstanding disagreements often need to happen in tandem."
  source: sources/guides/2026-09-15-key-contract-clauses.md

- id: q-0164
  domain: process
  topic: Guaranteed Maximum Price and Unit Price contracts
  question: "How does a Guaranteed Maximum Price (GMP) contract differ from a Unit Price contract?"
  answer: "A GMP contract sets a ceiling on the total price for a construction project — the contractor absorbs any cost beyond that cap. A Unit Price contract instead quotes per-unit rates, with the final total price depending on how many units the work actually ends up needing."
  choices:
    - "GMP fixes per-unit rates and the total depends on actual quantities; Unit Price caps the total price and the contractor absorbs costs beyond the cap"
    - "GMP caps the total price and the buyer reimburses all costs beyond the cap; Unit Price fixes per-unit rates and the total depends on actual quantities"
    - "GMP caps the total price and the contractor absorbs costs beyond the cap; Unit Price fixes one total price regardless of the quantities needed"
    - "GMP caps the total price and the contractor absorbs costs beyond the cap; Unit Price fixes per-unit rates and the total depends on actual quantities"
  correct: D
  explanation: "Both are Fixed-Price-family contracts, but GMP fixes a ceiling on the total while Unit Price fixes the per-unit rate and lets the total float with quantity."
  source: sources/guides/2026-09-15-contract-management-keywords.md

- id: q-0165
  domain: process
  topic: accuracy vs precision
  question: "What's the difference between accuracy and precision as quality measurement terms, and can a measurement be one without the other?"
  answer: "Accuracy measures how close a measurement is to reality (correctness). Precision measures exactness — how tightly repeated measurements cluster together. Yes — a measurement can be precise (tightly clustered) but inaccurate (consistently off from the true value), or vice versa."
  choices:
    - "Accuracy is closeness to the true value; precision is how tightly repeated measurements cluster; yes, a measurement can be one without the other"
    - "Accuracy is how tightly repeated measurements cluster; precision is closeness to the true value; yes, a measurement can be one without the other"
    - "Accuracy is closeness to the true value; precision is how tightly repeated measurements cluster; no, precise measurements are always accurate"
    - "Accuracy and precision both mean closeness to the true value; they are synonyms, so a measurement can't be one without the other"
  correct: A
  explanation: "A common exam trap treats these as synonyms, but they measure different things: correctness vs. consistency."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0166
  domain: process
  topic: corrective vs preventive action
  question: "How does corrective action differ from preventive action?"
  answer: "Corrective action addresses the root cause of an issue that has already occurred, to prevent recurrence. Preventive action identifies and eliminates potential sources of problems before they occur at all."
  choices:
    - "Corrective action eliminates potential problem sources before they occur; preventive action addresses the root cause of an issue that already occurred"
    - "Corrective action repairs one defective deliverable; preventive action is the change request that formally approves that repair"
    - "Corrective action addresses the root cause of an issue that already occurred; preventive action eliminates potential problem sources before they occur"
    - "Corrective action is taken only by an external quality auditor; preventive action is taken only by the team during inspections"
  correct: C
  explanation: "The distinction is timing relative to the problem: corrective is reactive (after), preventive is proactive (before)."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0167
  domain: process
  topic: cost of conformance vs non-conformance
  question: "A project spends money on both employee training and post-release warranty claims. Which cost-of-quality bucket does each fall into?"
  answer: "Training is a Prevention cost, under Cost of Conformance (money spent during the project to avoid failures). Warranty claims are an External Failure cost, under Cost of Non-Conformance (money spent because failures already happened)."
  choices:
    - "Training is an Appraisal cost under Cost of Conformance; warranty claims are an Internal Failure cost under Cost of Non-Conformance"
    - "Training is a Prevention cost under Cost of Conformance; warranty claims are an External Failure cost under Cost of Non-Conformance"
    - "Training is a Prevention cost under Cost of Non-Conformance; warranty claims are an External Failure cost under Cost of Conformance"
    - "Training is a Prevention cost under Cost of Conformance; warranty claims are an Appraisal cost under Cost of Conformance"
  correct: B
  explanation: "Conformance costs are proactive/preventive; non-conformance costs are reactive, paid because quality expectations weren't met."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0168
  domain: process
  topic: de facto vs de jure regulations
  question: "What's the difference between de facto and de jure regulations, and which type, if updated mid-project, should trigger an update to the Quality Management Plan?"
  answer: "De facto regulations are widely accepted (market/industry-driven) but not officially sanctioned. De jure regulations are formally recognized and established by law or legal authority. Either type being updated mid-project (e.g. new building codes) should trigger updating the Quality Management Plan's standards and specifications."
  choices:
    - "De facto: widely accepted but not officially sanctioned; de jure: established by law. An update to either type should trigger updating the Quality Management Plan"
    - "De facto: established by law; de jure: widely accepted but not officially sanctioned. Only a de jure update should trigger updating the Quality Management Plan"
    - "De facto: widely accepted but not officially sanctioned; de jure: established by law. Neither type should trigger a Quality Management Plan update mid-project"
    - "De facto: widely accepted but not officially sanctioned; de jure: established by law. Only a de facto update should trigger updating the Quality Management Plan"
  correct: A
  explanation: "The exam scenario usually names a legal/government body issuing the update, which signals de jure — but the QMP update logic applies to a newly-mandated standard either way."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0169
  domain: process
  topic: JIT vs Lean vs Kanban vs Kaizen
  question: "A PM wants to reduce wasted/expired office inventory by only acquiring supplies when needed. Which specific technique is this, and how does it differ from Lean, Kanban, and Kaizen?"
  answer: "Just In Time (JIT) — only using/acquiring resources when needed. Lean management is the broader philosophy (not a technique) of maximizing value while minimizing waste; Kanban is a lean method for managing and visualizing work; Kaizen is a philosophy of continuous, incremental improvement — a different concept from inventory timing."
  choices:
    - "Kanban; Lean is the broader value/waste philosophy, JIT is a lean method for visualizing work, and Kaizen is continuous incremental improvement"
    - "Kaizen; Lean is the broader value/waste philosophy, Kanban is a lean method for visualizing work, and JIT is continuous incremental improvement"
    - "Lean; JIT is the broader value/waste philosophy, Kanban is a lean method for visualizing work, and Kaizen is a statistical defect-reduction method"
    - "Just In Time; Lean is the broader value/waste philosophy, Kanban is a lean method for visualizing work, and Kaizen is continuous incremental improvement"
  correct: D
  explanation: "JIT is the specific inventory technique; the other three are broader philosophies or different-purpose methods, even though all four relate to waste reduction."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0170
  domain: process
  topic: Pareto chart
  question: "When building a Pareto chart to prioritize defects, what specific value do you need to determine for each issue?"
  answer: "Each issue's frequency — a Pareto chart is a histogram ranking issues from highest to lowest frequency, based on the 80/20 rule (80% of problems come from 20% of causes)."
  choices:
    - "Each issue's impact, ranked from highest to lowest per the 80/20 rule"
    - "Each issue's frequency, ranked from highest to lowest per the 80/20 rule"
    - "Each issue's root cause, grouped by category per the 80/20 rule"
    - "Each issue's urgency, ranked from highest to lowest per the 80/20 rule"
  correct: B
  explanation: "Not impact, urgency, or root cause — frequency is specifically what a Pareto analysis ranks."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0171
  domain: process
  topic: PDCA cycle
  question: "What does the Plan-Do-Check-Act (PDCA) cycle, aka the Deming Cycle, describe?"
  answer: "An iterative management method used to facilitate the continuous improvement of processes or products."
  choices:
    - "An iterative management method used to facilitate continuous improvement of processes or products"
    - "A one-time inspection method used to verify that deliverables meet their quality requirements"
    - "A statistical method used to reduce the probability of defects to 3.4 per million opportunities"
    - "A sequential planning method used to baseline scope, schedule, and cost before execution begins"
  correct: A
  explanation: "PDCA is a generic improvement loop, distinct from Kaizen (a philosophy) and Six Sigma (a data-driven defect-reduction philosophy) — though all three share a continuous-improvement spirit."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0172
  domain: process
  topic: quality audit vs quality inspection
  question: "What's the difference between a quality audit and a quality inspection, in terms of what each one examines?"
  answer: "A quality audit verifies adherence to quality standards and processes (usually done by an external auditor) — it examines the process. A quality inspection verifies whether deliverables conform to quality requirements — it examines the product."
  choices:
    - "An audit verifies deliverables conform to requirements (the product); an inspection verifies adherence to quality standards and processes (the process)"
    - "An audit verifies adherence to quality standards and processes (the process); an inspection verifies deliverables conform to requirements (the product)"
    - "An audit and an inspection both examine the product; the only difference is that an audit is performed by an external party"
    - "An audit verifies the customer formally accepts deliverables (the scope); an inspection verifies adherence to procedures (the process)"
  correct: B
  explanation: "Audits check compliance with procedures; inspections check the actual output."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0173
  domain: process
  topic: ISO 9000 series
  question: "What does the ISO 9000 series of standards define?"
  answer: "An effective Quality Assurance system for manufacturing and service industries."
  choices:
    - "A mandatory legal regulation governing product safety in manufacturing industries"
    - "A statistical method for reducing defects to 3.4 per million opportunities"
    - "An effective Quality Assurance system for manufacturing and service industries"
    - "A risk management framework for identifying and responding to project threats"
  correct: C
  explanation: "ISO 9000 is a standard, not a regulation — voluntary best practice unless a contract or regulation specifically requires certification against it."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0174
  domain: process
  topic: Six Sigma vs TQM
  question: "How does Six Sigma differ from Total Quality Management (TQM) as a quality philosophy?"
  answer: "Six Sigma is a data-driven philosophy specifically aimed at reducing the probability of errors/defects occurring. TQM is a broader management philosophy focused on continuous improvement through the involvement of all employees in quality goals."
  choices:
    - "Six Sigma is broader, pursuing continuous improvement through all employees' involvement; TQM is data-driven and aimed at reducing the probability of defects"
    - "Six Sigma is data-driven and aimed at reducing the probability of defects; TQM is broader, pursuing continuous improvement through all employees' involvement"
    - "Six Sigma is data-driven and aimed at reducing the probability of defects; TQM is a one-time inspection program run by a dedicated quality department"
    - "Six Sigma is a philosophy of small daily improvements by every worker; TQM is an ISO certification standard for quality assurance systems"
  correct: B
  explanation: "Six Sigma is narrower and statistically-driven; TQM is organization-wide and culture-driven."
  source: sources/guides/2026-09-16-quality-management-keywords.md

- id: q-0175
  domain: process
  topic: data vs information vs knowledge
  question: "Classify these three items: (1) 'Task X is not yet complete,' (2) 'Task X's delay is jeopardizing the release,' (3) a lesson recorded for future projects about why similar delays happen. Which is data, which is information, and which is knowledge?"
  answer: "(1) Data — a raw fact. (2) Information — processed data giving meaning/context. (3) Knowledge — information and experience applied to improve future outcomes."
  choices:
    - "(1) Information, (2) Data, (3) Knowledge"
    - "(1) Data, (2) Knowledge, (3) Information"
    - "(1) Data, (2) Information, (3) Knowledge"
    - "(1) Knowledge, (2) Information, (3) Data"
  correct: C
  explanation: "This three-level hierarchy (data -> information -> knowledge) is a common classification exercise on the exam."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0176
  domain: process
  topic: explicit vs tacit knowledge
  question: "What's the difference between explicit and tacit knowledge, and why do lessons learned meetings specifically matter for one of them?"
  answer: "Explicit (codified) knowledge can be captured directly using words, pictures, or numbers. Tacit knowledge — beliefs, experience, insights — is difficult to articulate and share. Lessons learned meetings exist mainly to surface tacit knowledge before it's lost, since it doesn't get written down on its own."
  choices:
    - "Tacit knowledge is easily codified in words, pictures, or numbers; explicit knowledge (beliefs, experience, insight) is hard to articulate, so lessons learned meetings mainly surface explicit knowledge"
    - "Explicit knowledge is easily codified in words, pictures, or numbers; tacit knowledge (beliefs, experience, insight) is hard to articulate, so lessons learned meetings mainly surface explicit knowledge"
    - "Explicit knowledge is easily codified in words, pictures, or numbers; tacit knowledge (beliefs, experience, insight) is hard to articulate, so lessons learned meetings mainly surface tacit knowledge"
    - "Explicit knowledge belongs to the organization; tacit knowledge belongs to vendors and contractors, so lessons learned meetings mainly transfer vendor knowledge into contracts"
  correct: C
  explanation: "Documentation captures explicit knowledge automatically; tacit knowledge needs a deliberate conversation to extract."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0177
  domain: process
  topic: lessons learned meeting vs register
  question: "What's the difference between a lessons learned meeting and a lessons learned register?"
  answer: "The meeting is the event used to identify and share knowledge gained during a project, phase, or iteration. The register is the document that actually records that knowledge for future reuse."
  choices:
    - "The register is the event used to identify and share knowledge gained; the meeting is the document that records it for future reuse"
    - "The meeting is the event used to identify and share knowledge gained; the register is the document that records it for future reuse"
    - "The meeting is held only at project closure; the register is updated only by the PMO after the project has ended"
    - "The meeting records open issues that need resolution; the register tracks identified risks and their assigned owners"
  correct: B
  explanation: "One is the process/event, the other is the artifact it produces."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0178
  domain: process
  topic: OPA for past project performance
  question: "A team recalls a similar past project that went over budget and behind schedule. Where should the PM look to find that past project's actual performance details, and why not EEF or the current issue log?"
  answer: "Organizational Process Assets (OPA) — OPAs bundle the organization's processes/procedures with its corporate knowledge base, including past projects' scope/schedule/cost/quality baselines, stakeholder registers, and issue logs."
  choices:
    - "Enterprise Environmental Factors, which bundle internal culture with the corporate knowledge base, including past projects' baselines and logs"
    - "The current project's issue log, which records problems the team raises, including their recollections of similar past projects"
    - "The current project charter, which summarizes the business case and includes past projects' baselines and performance data"
    - "Organizational Process Assets, which bundle processes/procedures with the corporate knowledge base, including past projects' baselines and logs"
  correct: D
  explanation: "EEF covers external conditions surrounding the company, not internal historical records; the current project's own issue log wouldn't contain a different, past project's data."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0179
  domain: process
  topic: information radiator
  question: "What is an information radiator (aka visual control or Big Visible Chart), and what problem does it solve?"
  answer: "A visible, physical display that provides instant information about the project without needing to ask or disturb the team."
  choices:
    - "A scheduled status report emailed to stakeholders so they don't need to attend the team's meetings"
    - "A private dashboard the PM uses to track individual team performance without the team seeing it"
    - "A daily standup meeting where the team broadcasts its progress updates to any interested stakeholders"
    - "A visible, physical display that gives instant project information without needing to ask or disturb the team"
  correct: D
  explanation: "A posted Kanban board is one common example, but the concept is broader than any single tool — any big, visible, always-current chart counts."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0180
  domain: process
  topic: access control vs information security
  question: "What's the difference between access control (authorization) and information security?"
  answer: "Access control specifically regulates who can access and interact with documents, for security and confidentiality. Information security is the broader process of identifying, assessing, and managing information security risks generally."
  choices:
    - "Information security regulates who can access and interact with documents; access control is the broader process of identifying, assessing, and managing security risks"
    - "Access control regulates who can access and interact with documents; information security is limited to encrypting project documents in storage"
    - "Access control and information security are two names for the same process of managing who can view and edit project documents"
    - "Access control regulates who can access and interact with documents; information security is the broader process of identifying, assessing, and managing security risks"
  correct: D
  explanation: "Access control is one specific technique/tool used within the broader information security process."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0181
  domain: process
  topic: version control
  question: "What does version control actually do, beyond just naming files v1, v2, v3?"
  answer: "It applies numerical identifiers to track changes to files or deliverables, letting team members manage and collaborate on different versions effectively without overwriting each other's work."
  choices:
    - "It locks each file so only the project manager can edit it, preventing unapproved changes from entering the baseline"
    - "It archives superseded files at project closure so lessons learned can reference the final approved deliverables"
    - "It applies identifiers to track changes, letting team members collaborate on different versions without overwriting each other's work"
    - "It routes every file edit through the change control board so each new version is formally approved before use"
  correct: C
  explanation: "The value is in enabling parallel collaboration and change tracking, not just labeling."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0182
  domain: process
  topic: naming convention
  question: "Why does a naming convention matter for document/information management, even though it seems like a trivial detail?"
  answer: "It's a set of rules and guidelines for creating significant and consistent names for files or variables — without it, information retrieval and document management both become harder as a project scales."
  choices:
    - "It sets rules for meaningful, consistent file names; without it, retrieval and document management get harder as the project scales"
    - "It defines who may access each file and folder; without it, confidential documents are exposed to unauthorized stakeholders"
    - "It records which version of a file is current; without it, team members overwrite each other's approved changes and lose work"
    - "It sets the retention period for each document type; without it, the project fails its records audit at closure"
  correct: A
  explanation: "This is a low-tech but frequently-tested piece of document-management hygiene."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0183
  domain: process
  topic: project librarian vs L&D manager
  question: "What's the difference between a Project Librarian (Project Data Administrator) and a Learning and Development (L&D) Manager?"
  answer: "A Project Librarian manages information and documents within a project. An L&D Manager designs and implements programs to enhance employees' knowledge, skills, and capabilities across the organization."
  choices:
    - "A Project Librarian builds the team's skills on the project; an L&D Manager manages the organization's document archives and repositories"
    - "A Project Librarian approves change requests to documents; an L&D Manager approves training spend in the project budget"
    - "A Project Librarian maintains the lessons learned register; an L&D Manager maintains the project's resource management plan"
    - "A Project Librarian manages project information and documents; an L&D Manager designs programs to build employees' skills across the organization"
  correct: D
  explanation: "One is project-level and document-focused; the other is organization-level and people-development-focused."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0184
  domain: process
  topic: status report vs quality report vs project management plan
  question: "A sponsor asks broadly for an overview of work performance and where a high-risk, defect-prone project currently stands. Which document should the PM send, and why not a quality report or the project management plan?"
  answer: "A status report — a work performance report covering the project's progress and status (can include EV data, trend lines/forecasts, reserve burndown, and defect/risk summaries)."
  choices:
    - "A quality report: it details defects, quality issues, and corrective actions, which is what matters most on a defect-prone project like this one"
    - "A status report: a work performance report on progress and standing, which can include EV data, forecasts, reserve burndown, and defect/risk summaries"
    - "The project management plan: it shows the scope, schedule, and cost baselines the sponsor needs to judge where the project stands right now"
    - "The risk register: it lists the high risks, their owners, and planned responses, which is what the sponsor needs on a high-risk project"
  correct: B
  explanation: "The sponsor asked broadly for performance/standing, not a quality-specific deep-dive; the project management plan is a planning document, not a reporting one."
  source: sources/guides/2026-09-16-information-knowledge-management-keywords.md

- id: q-0185
  domain: process
  topic: inspect before pay or close
  question: "A supplier delivers materials on the agreed date under a firm-fixed contract. What should the PM do before paying the supplier or closing the contract?"
  answer: "Inspect the materials to ensure compliance with the requirements stipulated in the contract."
  choices:
    - "Pay the supplier promptly, since a firm-fixed contract obligates payment once delivery occurs on the agreed date"
    - "Inspect the materials to confirm they comply with the requirements stipulated in the contract"
    - "Close the contract and release the supplier, since on-time delivery satisfies the firm-fixed terms"
    - "Hand the materials to the team for use, and raise a claim later if any defects turn up during the work"
  correct: B
  explanation: "Inspection always comes before payment/closure and before using the materials — passing inspection is the trigger for payment and contract closure, not delivery alone."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0186
  domain: process
  topic: Validate Scope vs internal testing
  question: "A team internally tests a machine exhaustively, but the client calls asking whether it meets requirements. Is internal test confirmation enough to close the project?"
  answer: "No — the PM must collaborate with the client to get their formal approval that the product complies with requirements. This is the Validate Scope process: the customer, not the team, gives formal sign-off."
  choices:
    - "Yes; exhaustive internal testing under Control Quality confirms requirements are met, so the project can close"
    - "Yes; the PM should send the client the test results and close the project once the report is delivered"
    - "No; the PM should escalate to the sponsor, who formally signs off that the product complies with requirements"
    - "No; the PM must work with the client to get formal approval that the product meets requirements (Validate Scope)"
  correct: D
  explanation: "Internal verification alone can't substitute for the customer's own validation, even after exhaustive internal testing."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0187
  domain: process
  topic: technical debt to product backlog
  question: "An agile team member discovers code that violates coding standards while working on a new feature. What's the correct next step, and why not fix it immediately or ignore it?"
  answer: "Raise it with the Product Owner to add a new item to the product backlog for the technical debt, to be prioritized like any other work."
  choices:
    - "Raise it with the Product Owner to add a technical-debt item to the product backlog, prioritized like other work"
    - "Fix it immediately by adding the work straight to the sprint backlog so the debt doesn't grow further"
    - "Leave it alone and keep working on the feature, since the code isn't part of the current story"
    - "Log it in the risk register and escalate it to the Scrum Master to assign another developer to fix it"
  correct: A
  explanation: "Ignoring it is low ownership (not 'gold plating'); fixing it unplanned mid-sprint by adding it straight to the sprint backlog compromises the current iteration's committed work."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0188
  domain: process
  topic: updating the Quality Management Plan for new regulations
  question: "A PM receives updated building codes and regulations from local authorities at project start. What should the PM update to ensure regulatory compliance?"
  answer: "The Quality Management Plan — to include the updated quality standards and specifications mandated by the revised codes."
  choices:
    - "The schedule management plan, to add time for permit reviews and inspections required by the revised codes"
    - "The procurement management plan, so suppliers are told to source materials that meet the revised codes"
    - "The Quality Management Plan, to include the updated quality standards and specifications required by the revised codes"
    - "The communications management plan, so stakeholders are informed about the revised codes and their effects"
  correct: C
  explanation: "This ensures deliverables align with the new requirements, rather than just adjusting the schedule, procurement plan, or communications plan around the change."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0189
  domain: process
  topic: acceptance sampling for destructive testing
  question: "A PM needs 1000 identical filters, but a tested filter can't be reused once tested. How should the PM handle inspection given this constraint?"
  answer: "Order more than 1000 filters, then perform acceptance sampling on the batch surplus."
  choices:
    - "Order exactly 1000 filters and perform 100% inspection on each one before accepting the batch"
    - "Order exactly 1000 filters and skip inspection, relying on the supplier's certificate of conformance"
    - "Order exactly 1000 filters, test a sample from them, and reorder replacements for those destroyed"
    - "Order more than 1000 filters, then perform acceptance sampling on the batch surplus"
  correct: D
  explanation: "When 100% inspection is impossible (here, because testing destroys the item), sampling a portion of the batch/lot is the standard workaround — ordering extra makes that sampling possible without shorting the actual requirement."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0190
  domain: process
  topic: root-cause facilitation for a stalled deliverable
  question: "A team member misses a deadline for a status report, explaining it feels pointless — inaccurate, too long, and unlikely to be read. What should the PM do?"
  answer: "Review the report's requirements with the team member to redefine its purpose, addressing the root cause of the frustration."
  choices:
    - "Review the report's requirements with the team member to redefine its purpose, addressing the root cause"
    - "Remind the team member the report is required and have them submit it as-is by a new deadline"
    - "Reassign the status report to another team member who is less frustrated with the task"
    - "Escalate the missed deadline to the team member's functional manager for performance follow-up"
  correct: A
  explanation: "This beats forcing submission as-is, reassigning it, or escalating to a functional manager — none of which fix the underlying problem that the report itself may be poorly designed."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0191
  domain: process
  topic: inspection vs audit vs handover vs scope validation
  question: "Before announcing project execution complete, a construction PM reviews deliverables and does a site walkthrough. Which of these is this: inspection, audit, handover, or scope validation?"
  answer: "An inspection — reviewing deliverables and performing a site walkthrough if applicable."
  choices:
    - "An audit: reviewing deliverables and the site to confirm compliance before announcing completion"
    - "A handover: walking the site to transfer the completed deliverables to the client's operations team"
    - "An inspection: reviewing deliverables and doing a site walkthrough where applicable"
    - "Scope validation: reviewing deliverables on site to obtain formal acceptance of the completed work"
  correct: C
  explanation: "Audits check process compliance (not product condition); this scenario involves neither a formal customer sign-off (scope validation) nor a handover of deliverables to the client."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0192
  domain: process
  topic: appraisal cost calculation
  question: "A cost-of-quality report lists: Training $10,000, Rework $10,000, Inspection $5,000, Scrap $3,000, Warranty charges $2,000. What is the appraisal cost, and how do you know?"
  answer: "$5,000 — the Inspection line. Appraisal costs are the testing/inspecting/auditing/evaluating costs under Cost of Conformance."
  choices:
    - "$10,000, the Training line; appraisal costs are the prevention-focused costs under Cost of Conformance"
    - "$5,000, the Inspection line; appraisal costs are testing/inspecting/auditing costs under Cost of Conformance"
    - "$13,000, Rework plus Scrap; appraisal costs are the internal failure costs under Cost of Nonconformance"
    - "$15,000, Training plus Inspection; appraisal costs are all costs under Cost of Conformance"
  correct: B
  explanation: "Training is a Prevention cost; Rework and Scrap are Internal Failure costs; Warranty charges is an External Failure cost — only Inspection maps to Appraisal."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0193
  domain: process
  topic: quality audit scope
  question: "An external auditor is about to conduct a quality audit on a project. What should the PM expect the audit to examine — budget/schedule status, scope-baseline conformance, product defects, or process compliance?"
  answer: "Process compliance — whether the project follows organizational and project policies, processes, and procedures."
  choices:
    - "Process compliance: whether the project follows organizational and project policies, processes, and procedures"
    - "Budget and schedule status: whether the project is performing within its cost and schedule baselines"
    - "Scope-baseline conformance: whether completed deliverables match the approved scope baseline"
    - "Product defects: whether the deliverables contain defects that must be corrected before acceptance"
  correct: A
  explanation: "Budget/schedule status is a performance review; product defects are Control Quality's job; scope-baseline nonconformance is Scope Control's job — none of those are what a quality audit checks."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0194
  domain: process
  topic: historical information for an innovative project
  question: "A PM is skeptical about a new, innovative project's business model, but has worked with similar organizations before. Should they still use historical information for resource planning?"
  answer: "Yes — historical information can still provide insight when comparing to resources used on previous similar projects, even if it won't produce a perfectly accurate estimate on its own."
  choices:
    - "No; on an innovative project historical data is irrelevant to resource needs, so only bottom-up estimating should be used"
    - "Yes; historical information is the most accurate input available and should replace all other estimating methods on the project"
    - "No; the PM should wait until the business model is proven in the market before doing any resource planning at all"
    - "Yes; it can still give insight by comparison to resources used on similar past projects, though it won't be perfectly accurate alone"
  correct: D
  explanation: "Historical information supports analogous/parametric estimating, which is faster/cheaper than bottom-up but less accurate — useful insight, not the only valid input."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0195
  domain: process
  topic: Definition of Done and Quality Control together
  question: "A prospect requires 10 firewalls delivered incrementally, with final acceptance granted only after a penetration test confirms all simulated attacks are detected and prevented. What two things is this scenario defining?"
  answer: "Definition of Done (the checklist of criteria for the product to be considered ready for delivery) and Quality Control (the defect-identification process — here, via penetration testing)."
  choices:
    - "Definition of Ready (criteria for starting work) and Quality Assurance (defect prevention via penetration testing)"
    - "Definition of Done (criteria for being ready to deliver) and Quality Assurance (defect prevention via process audits)"
    - "Definition of Done (criteria for being ready to deliver) and Quality Control (defect identification via penetration testing)"
    - "Technical requirements (product specs for each firewall) and Quality Control (defect identification via penetration testing)"
  correct: C
  explanation: "Quality Assurance would instead focus on defect prevention, and technical requirements would cover product specs like WiFi support or storage — neither fits this acceptance-condition scenario."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0196
  domain: process
  topic: defect breakdown visualization
  question: "A PM has defect data broken into five categories by percentage (UI issues, UX issues, bugs, missing features, other). What visualization tool fits this data?"
  answer: "A histogram — a vertical bar chart showing how often each category occurs, letting each bar represent one category's share of the total."
  choices:
    - "A scatter diagram: a plot showing the correlation between each category and the defect total"
    - "A histogram: a vertical bar chart showing how often each category occurs, one bar per category"
    - "A flowchart: a diagram showing the process steps where each category of defect is introduced"
    - "A control chart: a plot showing whether each category's defects stay within control limits over time"
  correct: B
  explanation: "A scatter diagram would instead show correlation between two continuous variables, and a flowchart shows process steps — neither fits categorical frequency data like this."
  source: sources/guides/2026-09-16-quality-information-management-questions.md

- id: q-0197
  domain: business-environment
  topic: causes of risk categories
  question: "A team is worried a new provider's training might be lower quality than well-known providers, and a stakeholder is unsupportive of the training initiative. Which two causes-of-risk categories do these two risks fall under, respectively?"
  answer: "Competitiveness (lower-quality/cheaper provider affecting outcomes) and Stakeholder-based (an unsupportive stakeholder)."
  choices:
    - "Financial (low-cost provider) and Occupational (unsupportive stakeholder)"
    - "Contractual (new provider agreement) and Stakeholder-based (unsupportive stakeholder)"
    - "Project-related (training quality) and Environment (unsupportive stakeholder)"
    - "Competitiveness (lower-quality provider) and Stakeholder-based (unsupportive stakeholder)"
  correct: D
  explanation: "The 7 causes-of-risk categories are Project-related, Financial, Competitiveness, Contractual, Occupational, Environment, and Stakeholder-based — each gives a structured lens for brainstorming risks."
  source: sources/guides/2026-09-17-causes-of-risks.md

- id: q-0198
  domain: business-environment
  topic: causes of risk categories
  question: "A project team worries about high employee turnover and burnout on a demanding project. Which causes-of-risk category does this fall under?"
  answer: "Occupational — risks related to the health, safety, and well-being of workers."
  choices:
    - "Project-related: risks arising from gaps in planning and executing the work"
    - "Occupational: risks related to the health, safety, and well-being of workers"
    - "Financial: risks related to funding and the cost of retaining the workforce"
    - "Stakeholder-based: risks arising from the attitudes and interests of stakeholders"
  correct: B
  explanation: "Occupational risk examples include injury, burnout, and high turnover, distinct from Project-related risks (planning/execution gaps) or Financial risks (funding/cost)."
  source: sources/guides/2026-09-17-causes-of-risks.md

- id: q-0199
  domain: business-environment
  topic: causes of risk categories
  question: "What is the purpose of using the 7 causes-of-risk categories (Project-related, Financial, Competitiveness, Contractual, Occupational, Environment, Stakeholder-based) during risk identification?"
  answer: "They structure brainstorming so the team systematically covers all key risk areas instead of focusing on a narrow, familiar set of threats."
  choices:
    - "To structure brainstorming so the team systematically covers all key risk areas rather than a narrow, familiar set"
    - "To score each risk's probability and impact so the team can rank the risks in priority order for response planning"
    - "To assign each risk an owner based on which part of the organization its category belongs to, so ownership is clear"
    - "To calculate contingency reserve per category so that funding matches each area's risk exposure and likely impact"
  correct: A
  explanation: "Categorization streamlines identification and ensures discussion coverage — it's a checklist technique, not a scoring or prioritization method."
  source: sources/guides/2026-09-17-causes-of-risks.md

- id: q-0200
  domain: business-environment
  topic: causes of risk categories
  question: "A vendor contract includes financial penalties if the project misses its delivery date. Which causes-of-risk category best describes this exposure?"
  answer: "Contractual — risks associated with legal agreements and contracts."
  choices:
    - "Financial: risks associated with project funding and cost health"
    - "Project-related: risks associated with planning and schedule gaps"
    - "Contractual: risks associated with legal agreements and contracts"
    - "Competitiveness: risks associated with vendor and market pressures"
  correct: C
  explanation: "Contractual risk examples include penalties and loss of the project; this is distinct from Financial risk, which concerns funding health rather than agreement terms."
  source: sources/guides/2026-09-17-causes-of-risks.md

- id: q-0201
  domain: business-environment
  topic: causes of risk categories
  question: "Flooding near a construction site could delay the project, and the project's own runoff could affect a nearby wetland. Which causes-of-risk category covers both directions of this risk?"
  answer: "Environment — risks arising from the impact of a project on the environment or vice versa."
  choices:
    - "Environment: risks from the project's impact on the environment or the environment's impact on the project"
    - "Occupational: risks from site conditions affecting the health and safety of workers on the project"
    - "Project-related: risks from schedule gaps that natural events could expose during execution"
    - "Contractual: risks from regulatory and permit agreements governing work near protected land"
  correct: A
  explanation: "The Environment category is bidirectional: environmental conditions affecting the project, and the project's impact on the environment, both count."
  source: sources/guides/2026-09-17-causes-of-risks.md

- id: q-0202
  domain: business-environment
  topic: Monte Carlo simulation
  question: "How does a Monte Carlo simulation's output differ from a single-point estimate like 'the project will take 12 months'?"
  answer: "It produces a probability distribution — e.g. a 70% chance of finishing within 11 months and a 90% chance within 14 months — instead of one fixed number."
  choices:
    - "It produces a single most-likely duration that is more accurate than an expert's single-point estimate"
    - "It produces a weighted average of optimistic, most likely, and pessimistic durations for the whole project"
    - "It produces a probability distribution, e.g. 70% chance within 11 months and 90% within 14, instead of one number"
    - "It produces a ranked list of the activities with the largest influence on the schedule, instead of a duration"
  correct: C
  explanation: "Monte Carlo runs thousands of what-if iterations, each drawing different values from the uncertain variables' probability distributions, to map the full range of possible outcomes."
  source: sources/guides/2026-09-17-monte-carlo-simulations.md

- id: q-0203
  domain: business-environment
  topic: Monte Carlo simulation
  question: "What is the first step in setting up a Monte Carlo simulation for a project's schedule risk?"
  answer: "Define the uncertain variables — the parts of the project (e.g. activity durations, costs) that could vary in outcome."
  choices:
    - "Run the simulation iterations, then review the output curve to see which variables were uncertain"
    - "Choose the confidence level the sponsor wants, then set the contingency reserve to match it"
    - "Calculate the EMV of each risk, then add the results together to seed the simulation"
    - "Define the uncertain variables: the parts of the project (e.g. durations, costs) that could vary"
  correct: D
  explanation: "Only after uncertain variables are identified can probability distributions be assigned to them and simulations run against those distributions."
  source: sources/guides/2026-09-17-monte-carlo-simulations.md

- id: q-0204
  domain: business-environment
  topic: Monte Carlo simulation
  question: "A PM wants to know what level of contingency reserve is needed to have an 80% confidence of finishing within budget. What quantitative technique directly supports this decision?"
  answer: "Monte Carlo simulation — its output probability curve shows the confidence level associated with any given budget or schedule target."
  choices:
    - "Expected monetary value: multiplying each risk's probability by impact gives the reserve at 80% confidence"
    - "Monte Carlo simulation: its probability curve shows the confidence level tied to any budget or schedule target"
    - "Probability and impact matrix: ranking risks by score shows how much reserve gives 80% confidence"
    - "Sensitivity analysis: the tornado diagram shows what reserve is needed to reach 80% confidence"
  correct: B
  explanation: "This is a core benefit of Monte Carlo: it quantifies risk exposure in time and cost and supports data-driven contingency decisions at a chosen confidence level."
  source: sources/guides/2026-09-17-monte-carlo-simulations.md

- id: q-0205
  domain: business-environment
  topic: Monte Carlo simulation
  question: "True or false: Monte Carlo simulation replaces the need to assign probability distributions to individual uncertain variables."
  answer: "False — assigning probability distributions to each uncertain variable is a required step; the simulation then repeatedly samples from those distributions."
  choices:
    - "True; the simulation generates its own distributions from random iterations, so none need to be assigned"
    - "False; assigning a distribution to each uncertain variable is required, and the simulation samples from them"
    - "True; only the overall project estimate needs a distribution, not the individual uncertain variables"
    - "False; each variable needs a single fixed estimate, which the simulation then multiplies by its probability"
  correct: B
  explanation: "Without per-variable distributions (e.g. foundation work: 8 days minimum, 10 most likely, 14 maximum), there's nothing for the simulation to sample from."
  source: sources/guides/2026-09-17-monte-carlo-simulations.md

- id: q-0206
  domain: business-environment
  topic: EMV vs. Monte Carlo
  question: "How does Expected Monetary Value (EMV) differ from Monte Carlo simulation as a quantitative risk technique?"
  answer: "EMV multiplies each risk's probability by its impact and sums across risks to produce one contingency-reserve figure; Monte Carlo instead simulates thousands of scenarios to produce a full probability distribution of outcomes."
  choices:
    - "EMV multiplies each risk's probability by impact and sums them into one reserve figure; Monte Carlo simulates many scenarios for a full outcome distribution"
    - "EMV simulates many scenarios to produce a full outcome distribution; Monte Carlo multiplies probability by impact and sums them into one reserve figure"
    - "EMV is a qualitative technique that ranks risks on a grid; Monte Carlo is the quantitative technique that produces a single reserve figure"
    - "EMV adds each risk's full impact into one reserve figure; Monte Carlo multiplies probability by impact for each risk to rank them individually"
  correct: A
  explanation: "Both are quantitative techniques, but EMV yields a single aggregate number while Monte Carlo yields a range with associated confidence levels."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0207
  domain: business-environment
  topic: residual vs. secondary risk
  question: "A team responds to a data-loss risk by adding an automated nightly backup process. That new backup process itself now introduces a risk of exposing sensitive data during transfer. What is this new risk called, and what is any risk still left over from the original data-loss risk called?"
  answer: "The new risk introduced by the response is a secondary risk; whatever data-loss risk remains after the response is residual risk."
  choices:
    - "The new risk is a residual risk; the data-loss risk still left after the response is secondary risk"
    - "The new risk is an emergent risk; the data-loss risk still left after the response is inherent risk"
    - "The new risk is a residual risk; the data-loss risk still left after the response is inherent risk"
    - "The new risk is a secondary risk; the data-loss risk still left after the response is residual risk"
  correct: D
  explanation: "Secondary risk arises directly from implementing a response; residual risk is what's left of the original risk after that same response is applied — they're easy to swap on the exam."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0208
  domain: business-environment
  topic: risk attitudes
  question: "A stakeholder consistently underestimates how severe risks could be and tends to view risky situations as opportunities rather than threats. What risk attitude does this describe?"
  answer: "Risk-seeker (risk-taker) — a higher tolerance for risk paired with underestimating its severity."
  choices:
    - "Risk-neutral: objectively analyzing risks before deciding how to respond"
    - "Risk-averse: avoiding risk unless the reward clearly outweighs it"
    - "Risk-seeker (risk-taker): high risk tolerance paired with underestimating severity"
    - "Risk-tolerant threshold: accepting risks up to a set organizational limit"
  correct: C
  explanation: "Contrast with risk-averse (avoids risk unless reward clearly outweighs it) and risk-neutral (analyzes objectively before deciding), which are the other two named risk attitudes."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0209
  domain: business-environment
  topic: fallback plan
  question: "A risk occurs and the team's primary planned response turns out to be inadequate to handle it. What should the team fall back on?"
  answer: "The fallback plan (Plan B) — the backup response prepared specifically for when the primary response proves insufficient."
  choices:
    - "A workaround: the backup response the team prepared in advance for use when the primary response proves insufficient"
    - "The contingency plan: the primary response that is executed when the risk's trigger condition first occurs"
    - "The fallback plan (Plan B): the backup response prepared for when the primary response proves insufficient"
    - "Management reserve: the funds held by management for use when the primary planned response proves insufficient"
  correct: C
  explanation: "A fallback plan is distinct from a workaround: a workaround is an unplanned response to an issue that wasn't anticipated at all, while a fallback plan is pre-planned."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0210
  domain: business-environment
  topic: inherent risk vs. risk exposure
  question: "What is the difference between 'inherent risk' and 'risk exposure' as used in risk management vocabulary?"
  answer: "Inherent risk is the baseline level of risk present before any project work begins. Risk exposure is an aggregate measure of the potential impact of all risks across the entire project."
  choices:
    - "Inherent risk is the risk left after responses are applied; risk exposure is the probability-times-impact score of one risk"
    - "Inherent risk is the aggregate impact of all project risks; risk exposure is the baseline risk before any work begins"
    - "Inherent risk is a risk created by a response; risk exposure is the amount the organization is willing to accept"
    - "Inherent risk is the baseline risk before any work begins; risk exposure is the aggregate potential impact of all project risks"
  correct: D
  explanation: "Inherent risk is a starting-point concept (pre-work), while risk exposure is a running, project-wide total that changes as risks are identified, analyzed, and responded to."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0211
  domain: business-environment
  topic: manageability and risk perception
  question: "Two risks have identical probability and impact scores, but the risk owner finds one far easier to control the occurrence and effect of than the other. What risk parameter captures this difference?"
  answer: "Manageability — the ease with which the risk owner can manage a risk's occurrence or impact. High ease of management = high manageability."
  choices:
    - "Manageability: how easily the risk owner can manage a risk's occurrence or impact"
    - "Proximity: how soon the risk could occur and affect the project's objectives"
    - "Detectability: how easily the risk's occurrence can be detected before it has an impact"
    - "Urgency: how quickly a response must be put in place for it to be effective"
  correct: A
  explanation: "Manageability is distinct from probability/impact — two risks can score identically on likelihood and severity while differing sharply in how controllable they are."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0212
  domain: business-environment
  topic: risk rating and matrix
  question: "What tool visualizes a project's overall risks according to their likelihood of occurrence and their impact on the project, to help prioritize them?"
  answer: "A Risk Matrix / Probability and Impact Matrix (also called a Risk Assessment Matrix)."
  choices:
    - "A Monte Carlo simulation output curve (S-curve of outcome probabilities)"
    - "A Risk Matrix / Probability and Impact Matrix (Risk Assessment Matrix)"
    - "An expected monetary value decision tree (EMV analysis)"
    - "A risk breakdown structure (hierarchy of risk categories)"
  correct: B
  explanation: "This is a qualitative risk analysis tool, distinct from quantitative tools like Monte Carlo simulation or EMV, which produce numeric estimates rather than a prioritization grid."
  source: sources/guides/2026-09-17-risk-management-keywords.md

- id: q-0213
  domain: business-environment
  topic: risk response strategy selection
  question: "A team wants Python training. The PM is hesitant about a new low-cost provider's quality, so one developer is enrolled first to test it before committing the rest of the team. What risk response strategy is this?"
  answer: "Mitigate — reducing the probability/impact of the 'bad training quality' threat by testing with one developer before wider rollout."
  choices:
    - "Avoid: removing the threat of poor training quality by testing with one developer first"
    - "Accept: going ahead with the provider because one developer's training cost is low"
    - "Transfer: shifting the risk of poor training quality to the provider by testing with one developer first"
    - "Mitigate: reducing the probability/impact of poor training quality by testing with one developer first"
  correct: D
  explanation: "Compare: escalating (handing the decision to senior management), avoiding (choosing a known accredited provider instead), and accepting (going ahead anyway because the cost/impact is low) are the other three strategies matched in this scenario."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0214
  domain: process
  topic: last responsible moment in agile risk
  question: "An agile team isn't sure how to implement a user story because it depends on inputs from the current release still in progress. What should the team do next?"
  answer: "Wait — delay the decision until they have enough information (the last responsible moment), rather than estimating or committing now."
  choices:
    - "Wait: delay the decision until they have enough information (the last responsible moment)"
    - "Estimate now: give the story a best-guess estimate and commit to it for the next iteration"
    - "Escalate: ask the sponsor to decide how the story should be implemented to avoid delay"
    - "Design now: commit to a full implementation design before the current release finishes"
  correct: A
  explanation: "This follows the Lean principle of deciding as late as possible; final estimates should wait until the team has the information needed to make an educated decision, not be forced early."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0215
  domain: people
  topic: risk ownership in agile
  question: "In a risk-averse organization running an agile project with high uncertainty, how is risk management conducted? (Select two)"
  answer: "The project team analyzes and addresses risks in all planning meetings with a qualitative (not quantitative) focus, and risks are monitored via information radiators, stand-ups, iteration reviews, and retrospectives."
  choices:
    - "The PM analyzes and addresses risks in a dedicated planning meeting with a quantitative focus, and monitors them via a formal risk register updated monthly"
    - "The team analyzes and addresses risks in all planning meetings with a qualitative focus, and monitors them via information radiators, stand-ups, reviews, and retrospectives"
    - "The team analyzes and addresses risks in all planning meetings with a quantitative focus, and monitors them via Monte Carlo reports at each release"
    - "The PM analyzes and addresses risks in all planning meetings with a qualitative focus, and monitors them via formal status reports to the sponsor"
  correct: B
  explanation: "In agile, the project team owns risk management, not the PM alone — the PM facilitates. This contrasts with predictive projects, where the PM typically owns and updates the risk register directly."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0216
  domain: process
  topic: alternatives analysis for volatility
  question: "A PM needs a specialized, in-demand programming skillset that's hard to retain due to rapid language evolution. What's the best response?"
  answer: "Perform alternatives analysis to explore options, and allocate a sufficient cost reserve to mitigate the high-turnover risk."
  choices:
    - "Switch the project to a more stable, widely known programming language, and update the scope baseline to match"
    - "Commit the team to extensive in-house training on the new language, and add schedule time to the plan for it"
    - "Perform alternatives analysis to explore options, and allocate a sufficient cost reserve to mitigate the turnover risk"
    - "Escalate the skills shortage to the sponsor, and request that HR offer retention bonuses to the current developers"
  correct: C
  explanation: "This is a volatility risk (rapid, unpredictable change in available skillsets). Alternatives analysis plus a cost/schedule reserve is the standard response to volatility, rather than switching languages or over-committing team time to training."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0217
  domain: business-environment
  topic: EMV and contingency reserve drawdown
  question: "Three risks have EMVs of $1,000, $1,000, and $4,000 (total contingency reserve $6,000). During execution, the $5,000-impact risk with the $1,000 EMV occurs; the other two do not occur. How much contingency reserve is left?"
  answer: "$1,000 — the reserve started at $6,000 (sum of all EMVs) and is drawn down by the risk's actual impact ($5,000) when it occurs, not by its EMV."
  choices:
    - "$5,000: the $6,000 reserve is drawn down by the risk's EMV ($1,000), not its actual impact"
    - "$0: the reserve is drawn down by the occurring risk's impact plus the unused EMVs of the others"
    - "$1,000: the $6,000 reserve is drawn down by the risk's actual impact ($5,000), not its EMV"
    - "$6,000: the reserve is only drawn down after the risk response is closed out in the register"
  correct: C
  explanation: "A common trap is subtracting the EMV instead of the impact — the reserve is spent based on what actually happened, not the original probability-weighted estimate."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0218
  domain: business-environment
  topic: risk audit vs. risk review
  question: "Management insists on sending a team of experts to conduct a risk audit even though the PM already completed a risk review that found no shortcomings. Are these two activities redundant?"
  answer: "No — a risk audit checks whether the risk response plan is being followed (looking backward at process compliance), while a risk review examines the effectiveness of the risk management plan itself, re-evaluating risk events, probability, and impact."
  choices:
    - "Yes; both are compliance checks of whether the risk response plan is being followed and re-examine the same records, so the audit only duplicates the PM's review and adds unnecessary cost"
    - "No; a risk audit checks whether the risk response plan is being followed, while a risk review examines the risk management plan's effectiveness, re-evaluating events, probability, and impact"
    - "No; a risk review is the compliance check of whether the risk response plan is being followed, while a risk audit, usually run by outside experts, re-evaluates risk events, probability, and impact"
    - "Yes; both re-evaluate risk events, probability, and impact against the plan, so the PM should ask management to cancel the audit and save the cost"
  correct: B
  explanation: "They check different things: the audit is a compliance/process check (often by an external auditor), the review is an effectiveness check of the plan's content."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0219
  domain: business-environment
  topic: risk response strategy matching
  question: "For a construction project's adverse-weather risk, the team purchases weather insurance to protect against financial loss from delays. Which risk response strategy is this?"
  answer: "Transfer — shifting the financial impact of the risk to a third party (the insurer)."
  choices:
    - "Mitigate: reducing the financial impact of the risk by buying protection against losses"
    - "Avoid: eliminating the risk by insuring the project against all weather-related delays"
    - "Accept: acknowledging the risk and covering any losses through an insurance reserve"
    - "Transfer: shifting the financial impact of the risk to a third party (the insurer)"
  correct: D
  explanation: "Compare: mitigate (adding schedule buffers), escalate (seeking senior management approval for more budget), avoid (using weather-resistant construction methods), and accept (acknowledging the risk with no proactive action) are the other four strategies in this same scenario."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0220
  domain: business-environment
  topic: passive vs. active risk acceptance
  question: "Early in planning, a PM identifies some low-impact risks for a book fair project. What should they do next?"
  answer: "Add the risks to the risk register and keep monitoring them — passive acceptance is appropriate for low-impact risks."
  choices:
    - "Add the risks to the risk register and keep monitoring them, using passive acceptance"
    - "Develop a detailed contingency plan for each risk, using active acceptance"
    - "Ignore the risks, since low-impact risks don't need to be recorded or tracked"
    - "Escalate the risks to the sponsor, since the PM shouldn't decide on accepting risks"
  correct: A
  explanation: "Active acceptance (a detailed risk response or contingency plan) is reserved for risks that warrant proactive action; ignoring the risks entirely is never correct, even at low impact."
  source: sources/guides/2026-09-17-risk-management-questions.md

- id: q-0221
  domain: business-environment
  topic: risk register components
  question: "Which four groups of columns does a typical risk register organize its data into?"
  answer: "Identification (Risk ID, description, category), analysis & assessment (likelihood, impact, risk level/score), response planning (strategy, action plan, owner), and monitoring & control (trigger indicators, status, due date, residual risk, lessons learned)."
  choices:
    - "Identification, analysis & assessment, response planning, and monitoring & control"
    - "Identification, qualitative analysis, quantitative analysis, and closure & lessons learned"
    - "Initiation, planning, execution, and monitoring & control"
    - "Identification, prioritization, escalation, and reserve allocation"
  correct: A
  explanation: "This structure mirrors the risk management process itself: identify, analyze, plan responses, then monitor and control."
  source: sources/guides/2026-09-17-risk-register.md

- id: q-0222
  domain: business-environment
  topic: risk register components
  question: "A risk register lists a risk's likelihood as 'High' and impact as 'Severe,' and calculates a combined value from both. What is this combined value called, and how is it typically calculated?"
  answer: "The Risk Score (or risk level/priority) — typically calculated as Probability x Impact."
  choices:
    - "The Expected Monetary Value, typically Probability x Cost Impact in dollars"
    - "The Risk Threshold, typically Impact divided by Probability"
    - "The Risk Exposure, typically Probability + Impact summed across all risks"
    - "The Risk Score (risk level/priority), typically Probability x Impact"
  correct: D
  explanation: "This score is what lets the team rank and prioritize which risks get response planning attention first."
  source: sources/guides/2026-09-17-risk-register.md

- id: q-0223
  domain: business-environment
  topic: risk register benefits
  question: "Besides tracking risks throughout the project lifecycle, what are the risk register's other two key benefits?"
  answer: "Accountability, through assigned risk owners, and serving as a communication tool for stakeholders."
  choices:
    - "Calculating contingency reserve automatically, and replacing the need for a risk management plan"
    - "Accountability through assigned risk owners, and serving as a communication tool for stakeholders"
    - "Accountability through assigned risk owners, and replacing the need for status reporting to stakeholders"
    - "Calculating contingency reserve automatically, and serving as a communication tool for stakeholders"
  correct: B
  explanation: "Beyond being a structured identify/assess/prioritize/manage tool, the register's owner column and stakeholder visibility are exam-relevant benefits in their own right."
  source: sources/guides/2026-09-17-risk-register.md

- id: q-0224
  domain: business-environment
  topic: trigger indicators vs. status
  question: "A risk register entry lists 'warning signs the risk may occur' in one column and 'Open/Mitigated/Closed' in another. What are these two columns called?"
  answer: "Trigger indicators and status, respectively — both part of the register's monitoring & control group."
  choices:
    - "Risk triggers and risk level, both in the analysis & assessment group"
    - "Risk description and response strategy, both in the identification group"
    - "Trigger indicators and status, both in the monitoring & control group"
    - "Trigger indicators and residual risk, both in the response planning group"
  correct: C
  explanation: "Trigger indicators are early-warning signs (this is what a trigger condition maps to in the register), while status tracks the risk's current lifecycle state."
  source: sources/guides/2026-09-17-risk-register.md

- id: q-0225
  domain: business-environment
  topic: residual risk in the register
  question: "After a mitigation response is applied to a risk, what should the risk register record to capture what danger, if any, remains?"
  answer: "Residual risk — the remaining risk after the response has been applied, recorded under monitoring & control."
  choices:
    - "Secondary risk: the risk remaining after the response is applied, recorded under response planning"
    - "Inherent risk: the risk remaining after the response is applied, recorded under identification"
    - "Risk exposure: the risk remaining after the response is applied, recorded under analysis & assessment"
    - "Residual risk: the risk remaining after the response is applied, recorded under monitoring & control"
  correct: D
  explanation: "This is distinct from secondary risk, which would be a brand-new risk introduced by the response itself, not what's left of the original."
  source: sources/guides/2026-09-17-risk-register.md

- id: q-0226
  domain: process
  topic: development approach selection
  question: "A PM will manage a project with some clearly defined requirements and some unclear ones. What development approach should they choose, and what should they do about the unclear parts?"
  answer: "An iterative, agile, or hybrid approach — not predictive or incremental — and meet with stakeholders to clarify the unclear requirements."
  choices:
    - "A predictive approach, and delay execution until the stakeholders finalize the unclear requirements"
    - "An incremental approach, and have the team assume the unclear requirements based on past projects"
    - "An iterative, agile, or hybrid approach, and meet with stakeholders to clarify the unclear requirements"
    - "A predictive approach, and handle the unclear requirements later through formal change requests"
  correct: C
  explanation: "Partial requirement clarity is the classic cue for an adaptive approach; predictive assumes requirements are fully known up front, which doesn't fit here."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0227
  domain: process
  topic: development approach selection
  question: "A project has unclear scope but also must follow strict regulations and detailed documentation requirements. What development approach fits, and why?"
  answer: "A hybrid approach — agile addresses the scope uncertainty, while predictive elements handle the regulatory compliance and documentation burden."
  choices:
    - "Hybrid: agile handles the scope uncertainty, while predictive elements handle regulatory compliance and documentation"
    - "Agile: short iterations handle the scope uncertainty, and the team can add documentation at the final release"
    - "Predictive: detailed upfront planning satisfies the regulations, and scope is clarified through change requests"
    - "Incremental: delivering in fixed chunks handles both the scope uncertainty and the documentation burden"
  correct: A
  explanation: "Neither pure agile (doesn't guarantee the documentation rigor regulations need) nor pure predictive (doesn't handle the scope uncertainty well) fits alone."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0228
  domain: people
  topic: unclear roles and RACI
  question: "A new team member complains about unclear roles and about receiving assignments from multiple stakeholders. Where should the PM look first, and where might they look in an agile project specifically?"
  answer: "Review the RACI matrix (part of the Resource Management Plan) for accuracy first; in an agile project, also review the team charter, which can list team members and their roles."
  choices:
    - "Review the resource calendar (in the Resource Management Plan) first; in agile, also review the product backlog for roles"
    - "Review the RACI matrix (in the Resource Management Plan) first; in agile, also review the team charter for roles"
    - "Review the stakeholder register (in the Stakeholder Engagement Plan) first; in agile, also review the sprint backlog for roles"
    - "Review the communications management plan first; in agile, also review the Definition of Done for roles"
  correct: B
  explanation: "The RACI/RAM answers 'who does what,' distinct from a resource calendar (who's available when) — and the team charter is the agile-specific document covering ground rules and roles."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0229
  domain: process
  topic: estimation technique selection
  question: "A PM isn't sure how to produce a high-level estimate for a project's cost or duration. What two techniques does this scenario point to?"
  answer: "Analogous estimating (using data from a similar past project) and/or consulting an expert for their evaluation."
  choices:
    - "Bottom-up estimating (rolling up activity estimates) and/or Monte Carlo simulation"
    - "Analogous estimating (data from a similar past project) and/or consulting an expert"
    - "Three-point estimating (PERT averages) and/or bottom-up estimating"
    - "Parametric estimating (unit rates from a model) and/or reserve analysis"
  correct: B
  explanation: "Analogous estimating is fast but less accurate than bottom-up; it's the standard answer when a PM needs a quick, high-level number rather than a precise one."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0230
  domain: process
  topic: critical path method
  question: "A PM is planning a detailed schedule of project activities and needs to determine which activities are critical to the project's minimum duration. What technique should they use?"
  answer: "The Critical Path Method (CPM) — it determines the project schedule and identifies which activities are on the critical path."
  choices:
    - "The Critical Path Method (CPM), which determines the schedule and identifies activities on the critical path"
    - "The Program Evaluation and Review Technique (PERT), which weights three estimates to set each activity's duration"
    - "Resource leveling, which adjusts start and finish dates to match the availability of resources"
    - "Fast tracking, which overlaps sequential activities to shorten the project's minimum duration"
  correct: A
  explanation: "Activities on the critical path have zero float; any slip there slips the whole project's finish date."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0231
  domain: process
  topic: change request vs. product backlog
  question: "During execution, a stakeholder submits a new requirement. How should the PM handle this in a predictive project versus an agile project?"
  answer: "Predictive: issue a change request and track it in the change log. Agile: document the new requirement in the Product Backlog for later review/prioritization by the PO."
  choices:
    - "Predictive: add it to the requirements traceability matrix and implement it. Agile: add it to the current sprint backlog"
    - "Predictive: issue a change request and track it in the change log. Agile: issue a change request to the Scrum Master"
    - "Predictive: issue a change request and track it in the change log. Agile: add it to the Product Backlog for PO prioritization"
    - "Predictive: add it to the Product Backlog for sponsor review. Agile: issue a change request and track it in the change log"
  correct: C
  explanation: "Predictive routes new requirements through formal change control; agile absorbs them into backlog prioritization without a formal CR."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0232
  domain: process
  topic: burndown chart reading
  question: "A sponsor wants to know how many user stories are done so far in the sprint, and whether the team is on track against plan. What chart answers this?"
  answer: "A burndown chart — it tracks remaining sprint work and lets the team measure actual vs. planned progress during sprint execution."
  choices:
    - "A burnup chart: it tracks scope completed across the release and shows progress toward the release goal"
    - "A cumulative flow diagram: it tracks work items in each state and shows bottlenecks in the workflow"
    - "A velocity chart: it tracks story points completed per sprint and shows the team's average capacity"
    - "A burndown chart: it tracks remaining sprint work and shows actual vs. planned progress during the sprint"
  correct: D
  explanation: "Burndown (remaining work, owned by the PM/Scrum Master) is the sprint-level view; burnup (scope completed, owned by the PO) tracks the release/project level instead."
  source: sources/guides/2026-09-18-pmp-scenarios-1.md

- id: q-0233
  domain: process
  topic: Kanban focus
  question: "A team is using the Kanban framework, and the sponsor asks how the team's performance should be shown. What should the PM focus on and show?"
  answer: "Continuous workflow with limited Work In Progress (WIP) — and the Kanban board itself, for a visual display of the team's progress."
  choices:
    - "Continuous workflow with limited WIP, shown on the Kanban board as a visual display of progress"
    - "Sprint velocity with timeboxed iterations, shown on a burndown chart as remaining work per sprint"
    - "Earned value with fixed baselines, shown in a status report as cost and schedule variances"
    - "Story points committed per sprint, shown on a velocity chart as team capacity over time"
  correct: A
  explanation: "Kanban is a pull-based, flow-based method distinct from Scrum's timeboxed sprints; the board doubles as an information radiator for exactly this kind of status question."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0234
  domain: process
  topic: supplier performance issues
  question: "A supplier is struggling to meet quality requirements. What should the PM do, and what's the last resort?"
  answer: "Provide the supplier with feedback to help them improve their performance; only as a last resort, find another supplier."
  choices:
    - "Terminate the contract for default right away and find another supplier who meets quality"
    - "Withhold all payments until quality improves; only as a last resort, give the supplier feedback"
    - "Escalate to the sponsor to renegotiate the contract; only as a last resort, give the supplier feedback"
    - "Give the supplier feedback to help them improve; only as a last resort, find another supplier"
  correct: D
  explanation: "Switching suppliers is costly and disruptive — the exam favors resolving the relationship first before escalating to replacement."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0235
  domain: people
  topic: losing a key team member
  question: "A key team member leaves the project before it's finished. What three things should the PM do?"
  answer: "Evaluate the impact on the project, ensure knowledge transfer is performed, and follow the resource management plan to find a replacement."
  choices:
    - "Evaluate the impact, redistribute the work across the team with overtime, and update the schedule baseline"
    - "Evaluate the impact, ensure knowledge transfer is performed, and follow the resource management plan to find a replacement"
    - "Escalate to the sponsor, request a replacement from HR immediately, and update the resource calendar"
    - "Ensure knowledge transfer is performed, crash the schedule with added resources, and submit a change request"
  correct: B
  explanation: "Knowledge transfer is its own distinct ECO task — losing a team member risks losing tacit knowledge, not just headcount, so it needs explicit handling before/alongside finding a replacement."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0236
  domain: business-environment
  topic: workplace safety incident
  question: "An accident in the work environment injures a team member. What should the PM do?"
  answer: "Investigate the causes of the incident and develop a plan to avoid its recurrence, ensuring safety in the work environment going forward."
  choices:
    - "Document the incident in the issue log and continue the work once the injured member is replaced"
    - "Report the incident to the sponsor and let the functional manager handle the injured team member"
    - "Investigate the causes of the incident and develop a plan to prevent recurrence, ensuring a safe work environment"
    - "Add schedule buffer for the lost time and assign the injured member's tasks to the rest of the team"
  correct: C
  explanation: "This is an Occupational risk realized as an issue — the response is root-cause-driven prevention, not just documenting the incident."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0237
  domain: people
  topic: scaling Scrum teams
  question: "A single Scrum team keeps growing, and communication and synchronization are getting harder. What should the PM do?"
  answer: "Apply a Scrum of Scrums approach — divide the team into smaller teams and coordinate them across their Scrum Masters."
  choices:
    - "Switch to a predictive approach so a detailed communications plan can manage the larger team"
    - "Keep one team but extend the daily stand-up so every member has time to synchronize"
    - "Remove the lowest-performing members so the team returns to a manageable size"
    - "Apply Scrum of Scrums: split into smaller teams and coordinate them across their Scrum Masters"
  correct: D
  explanation: "This is the standard answer once a Scrum team outgrows its practical size (~9 members) — not abandoning Scrum for a predictive approach."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0238
  domain: process
  topic: choosing between two projects financially
  question: "A PM is evaluating two potential projects and needs an objective way to decide which to execute. What should they calculate?"
  answer: "Net Present Value (NPV), Internal Rate of Return (IRR), or Benefit-Cost Ratio (BCR) for both — the project scoring higher is generally the better choice."
  choices:
    - "Schedule variance and cost variance for both; the project with smaller variances is generally better"
    - "NPV, IRR, or Benefit-Cost Ratio for both; the higher-scoring project is generally the better choice"
    - "Payback period only for both; the project that pays back slower is generally the better choice"
    - "Sunk cost for both; the project with more already invested is generally the better choice"
  correct: B
  explanation: "These are the core financial project-selection metrics; the exam expects a numbers-based comparison rather than a qualitative judgment call here."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0239
  domain: people
  topic: stakeholder dissatisfaction despite plan adherence
  question: "The PM is following the project management plan exactly, but stakeholders still seem unhappy. What should the PM do?"
  answer: "Meet the stakeholders, listen to their concerns, and perform a root cause analysis behind their dissatisfaction."
  choices:
    - "Show the stakeholders the approved plan and explain that the project is following it exactly as agreed"
    - "Escalate the stakeholders' dissatisfaction to the sponsor and ask the sponsor to resolve it with them directly"
    - "Meet the stakeholders, listen to their concerns, and perform a root cause analysis of their dissatisfaction"
    - "Submit a change request to revise the plan so it matches what the PM thinks stakeholders actually want"
  correct: C
  explanation: "Following the plan doesn't guarantee stakeholder satisfaction — the plan itself might not reflect what stakeholders actually need, so the fix starts with listening and root-causing, not defending the plan."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md

- id: q-0240
  domain: people
  topic: stakeholder resistance
  question: "The PM is facing resistance from key stakeholders. What three things should they do?"
  answer: "Understand the reason behind the resistance, involve the key stakeholder, and adjust the stakeholder engagement plan and communication management plan accordingly."
  choices:
    - "Understand the reason for the resistance, involve the key stakeholder, and adjust the stakeholder engagement and communication management plans"
    - "Escalate the resistance to the sponsor, exclude the key stakeholder from further decisions, and update the risk register accordingly"
    - "Understand the reason for the resistance, push ahead with the approved plan anyway, and record the issue in the issue log for follow-up"
    - "Involve the key stakeholder, submit a change request to the scope baseline, and update the resource management plan to match"
  correct: A
  explanation: "Resistance is a signal to update the engagement approach, not just push through — the response updates both the engagement plan and the comms plan, since the two work together."
  source: sources/guides/2026-09-18-pmp-scenarios-2.md
